[package]
name    = "cogra-linter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cogra-lint"
path = "src/main.rs"

[dependencies]
# The corpus graph and every judgment over it — ruled first-class and
# unwrapped (architecture, petgraph decision); pinned per the ruling.
petgraph = "0.8.3"
# The Markdown frontend (design, markdown-surface convention); driven
# through into_offset_iter, with ENABLE_TABLES the only extension.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The Rust frontend (design, rust-surface convention): parse_file plus the
# visit::Visit walk. `full` and `visit` are optional, and a linter parsing
# whole files and walking them needs both; `parsing` comes from the
# defaults. Verified against docs.rs/syn 3.0.4 on 2026-08-25.
syn = { version = "3.0.4", features = ["full", "visit", "extra-traits"] }
# Byte ranges out of syn spans (design, syn-spans decision). Direct rather
# than transitive precisely so `span-locations` is switched on where a
# reader can see it. Verified against docs.rs/proc-macro2 1.0.107 on
# 2026-08-25: outside a procedural macro the range is accurate on stable.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# The web frontend (architecture, web-frontend convention): parse_file_as_program
# with a comments store beside it. `typescript` is one of this crate's
# DEFAULT features, which is why no feature list appears here; tsx and dts
# are per-file syntax settings rather than build-time ones. Verified
# against docs.rs/swc_ecma_parser 45.0.0 on 2026-08-26.
swc_ecma_parser = "45.0.0"
# The comments store the parser fills, the source map owning the file's
# byte positions, and the span type those are keyed by. Verified against
# docs.rs/swc_common 26.0.0 on 2026-08-26.
swc_common = "26.0.0"
# `EsVersion`, the parse target `parse_file_as_program` takes. The syntax
# tree itself goes unread: the web package carries no census in version 1,
# so the AST's only duty is to have been built. Verified against
# docs.rs/swc_ecma_ast 29.0.0 on 2026-08-26.
swc_ecma_ast = "29.0.0"
# The Kotlin frontend runtime (architecture, kotlin-tree-sitter decision):
# Parser, Tree and Node over the vendored first-party grammar. The version
# is the one whose CLI generated the committed parser.c, which the grammar's
# PROGRESS.md records as 0.26.13 — runtime and generator from one release
# rather than two. Verified against docs.rs/tree-sitter 0.26.13 on
# 2026-08-26; the parser declares ABI 14, which the runtime's own
# MIN_COMPATIBLE_LANGUAGE_VERSION admits (asserted in the suite).
tree-sitter = "0.27.0"
# `LanguageFn`, which is what the vendored grammar's `tree_sitter_kotlin()`
# becomes before it is a `Language`. Direct rather than transitive because
# this crate names the type: the vendored tree carries no `bindings/rust`,
# so the binding tree-sitter's CLI would have generated is written here
# instead. Verified against docs.rs/tree-sitter-language 0.1.7 on
# 2026-08-26.
tree-sitter-language = "0.1.7"
# The adoption-data parser (design, TOML-parsing decision); Spanned locates
# adoption defects at their row.
toml = "1.1"
serde = { workspace = true }
thiserror = { workspace = true }
# The three modes of the command line (design, CLI signature). The derive
# API is the one clap's own documentation leads with, and it is behind the
# `derive` feature; nothing else is enabled. Verified against
# docs.rs/clap 4.6.6 on 2026-08-25.
clap = { version = "4.6.6", features = ["derive"] }
# main.rs only, per the repository's error rule: thiserror for a library's
# typed surface, anyhow for a binary that prints what went wrong and exits.
anyhow = { workspace = true }

[build-dependencies]
# Compiles the vendored grammar's parser.c and scanner.c, in the shape
# tree-sitter's own generated bindings use (see build.rs). Verified against
# crates.io/crates/cc 1.4.4 on 2026-08-26.
cc = "1.4.4"

[dev-dependencies]
# Property obligations of the design's metatheorem table.
proptest = "1"
