[package]
name    = "cogra-linter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cogra-lint"
path = "src/main.rs"

[dependencies]
# The corpus graph and every judgment over it — ruled first-class and
# unwrapped (architecture, petgraph decision); pinned per the ruling.
petgraph = "0.8.3"
# The adoption-data parser (design, TOML-parsing decision); Spanned locates
# adoption defects at their row.
toml = "1.1"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Property obligations of the design's metatheorem table.
proptest = "1"
