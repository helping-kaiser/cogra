[package]
name    = "ranker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The pure feed-ranking computation (feed-ranking.md, ranker-core §3): slice,
# parameters and network parameters in, ordered entries out. No I/O, no
# async, no clock, no randomness — so it tests in isolation and every runner
# (the ranker pod, a delegated miner, the device) computes the same bits.
[dependencies]
# One census and one fold: the family-fixed leg rows and the sum-then-clip
# netting are common's, so the math cannot diverge from the seam's.
common    = { path = "../common" }
libm      = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The golden-vector export (tests/vectors.rs) and the property suites.
serde_json = { workspace = true }
proptest   = "1"
