[package]
name    = "api"
version.workspace = true
edition.workspace = true
# Several binaries live here (server + tools); name the server as default
# so `cargo run -p api` and `make api` stay unambiguous.
default-run = "api"

[lints]
workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "l1-dev"
path = "src/bin/l1-dev.rs"

[dependencies]
common           = { path = "../common" }
l1-standin       = { path = "../l1-standin" }
postgres-store   = { path = "../postgres-store" }

tokio              = { workspace = true }
axum               = { workspace = true }
async-graphql      = { workspace = true, features = ["chrono", "uuid"] }
async-graphql-axum = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
hex                = { workspace = true }
dotenvy            = { workspace = true }
sha2               = { workspace = true }
sqlx               = { workspace = true }
argon2             = { workspace = true }
jsonwebtoken       = { workspace = true }
base64             = { workspace = true }
rand               = { workspace = true }
ed25519-dalek      = { workspace = true }

[dev-dependencies]
tower          = { version = "0.5", features = ["util"] }
http-body-util = { version = "0.1" }
