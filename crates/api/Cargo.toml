[package]
name    = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
# Several binaries live here (server + tools); name the server as default
# so `cargo run -p api` and `make api` stay unambiguous.
default-run = "api"

[lints]
workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "l1-dev"
path = "src/bin/l1-dev.rs"

[dependencies]
common           = { path = "../common" }
l1-standin       = { path = "../l1-standin" }
postgres-store   = { path = "../postgres-store" }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
axum               = { workspace = true }
# `tempfile` is what makes an uploaded body spool to disk instead of
# being buffered in memory: without it a concurrent burst of uploads is a
# memory-exhaustion primitive rather than a queue of temporary files.
async-graphql      = { workspace = true, features = ["chrono", "uuid", "dataloader", "tempfile"] }
async-graphql-axum = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
hex                = { workspace = true }
dotenvy            = { workspace = true }
sha2               = { workspace = true }
hkdf               = { workspace = true }
aes-gcm            = { workspace = true }
sqlx               = { workspace = true }
argon2             = { workspace = true }
jsonwebtoken       = { workspace = true }
base64             = { workspace = true }
rand               = { workspace = true }
ed25519-dalek      = { workspace = true }
axum-client-ip     = { workspace = true }
reqwest            = { workspace = true }
sha1               = { workspace = true }
object_store       = { workspace = true }
image              = { workspace = true }

[dev-dependencies]
tower          = { version = "0.5", features = ["util"] }
http-body-util = { version = "0.1" }
