[package]
name    = "cogra-interchange"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned fork exposing the anchored whole-string matcher (Regex::is_full_match);
# upstream exposure filed as Paligo/regexml#15 — repoint at crates.io when it
# merges and releases.
regexml = { git = "https://github.com/helping-kaiser/regexml", rev = "feddb83dfdacceff2e81e86e7618ca31acccf910" }
thiserror = { workspace = true }

[dev-dependencies]
# Property obligations of the design's metatheorem table: shrinking and
# prop_recursive over the recursive Value model (design.md, dependency
# justifications).
proptest = "1"
# Loads the vector corpus in tests only. The library's refusal of serde
# (design.md, refused dependencies) is about its own data model, which no
# test fixture reaches.
serde_json = { workspace = true }
