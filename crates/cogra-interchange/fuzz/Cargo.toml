[package]
name = "cogra-interchange-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detached from the crate's workspace: the fuzz crate builds only on the
# nightly cargo-fuzz lane, never as a member of the version-1 tree, and
# `make ci` does not compile it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cogra-interchange]
path = ".."

[[bin]]
name = "decode_canonical"
path = "fuzz_targets/decode_canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cddl_parse"
path = "fuzz_targets/cddl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "accept_document"
path = "fuzz_targets/accept_document.rs"
test = false
doc = false
bench = false
