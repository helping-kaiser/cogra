[workspace]
members = [
    "crates/api",
    "crates/l1-standin",
    "crates/postgres-store",
    "crates/common",
    "crates/cogra-interchange",
    "crates/cogra-linter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# The body-stream-to-AsyncRead bridge the GraphQL multipart parse needs —
# the same two adapters async-graphql-axum's own extractor uses, pulled in
# directly because that extractor cannot be given upload limits.
tokio-util = { version = "0.7", features = ["io", "compat"] }

# Web framework + GraphQL
# axum 0.8 matches the version async-graphql-axum 7 builds against, so the
# GraphQLRequest extractor and the router agree on one axum.
axum = { version = "0.8" }
async-graphql = { version = "7" }
async-graphql-axum = { version = "7" }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Tracing / logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
# Loads .env into the process environment at binary startup (runtime
# counterpart of the .env convention sqlx's macros use at compile time).
dotenvy = { version = "0.15" }

# Shared primitive types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# The interim act-authentication realization for the L1 stand-in
# (open-questions.md Q30 — stand-in-scoped choices, not a Q30 resolution):
# Ed25519 signatures, SHA-256 salted hash commitments.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
sha2 = { version = "0.10" }
rand = { version = "0.8" }
hex = { version = "0.4" }

# Service-side auth (auth.md): Argon2id password hashing, Ed25519-signed
# JWT access tokens, url-safe token material. jsonwebtoken 10+ has no
# built-in backend — one crypto-provider feature must be picked, and
# `rust_crypto` signs EdDSA through the same ed25519-dalek the rest of
# the workspace uses (`aws_lc_rs` would add a C toolchain to every build).
argon2 = { version = "0.5" }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = { version = "0.23" }

# API-edge hardening (auth.md "Rate limiting", "Password requirements"):
# client-IP derivation behind the CLIENT_IP_SOURCE knob, the HIBP
# range-API breach lookup (rustls to stay on the sqlx TLS stack), and
# SHA-1 for the k-anonymity prefix — same RustCrypto generation as sha2.
axum-client-ip = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = { version = "0.10" }

# Media carriage. `object_store` speaks the S3 object protocol behind one
# small trait, which is the boundary the standalone media service needs —
# the same code reaches a MinIO container, a cloud bucket, or a federated
# peer's store.
#
# `aws` is the bundled feature its own documentation points at: S3 over
# the built-in reqwest transport, signed by aws-lc-rs "matching reqwest's
# default so that applications do not end up with two crypto stacks".
# Splitting it (`aws-base` + `reqwest` + `ring`) to keep aws-lc-rs out —
# the reason jsonwebtoken is on `rust_crypto` — does not work here and
# was measured, not assumed: the transport's TLS is `reqwest/rustls`,
# whose only provider in reqwest 0.13 is aws-lc-rs, so the split leaves
# TLS unselected (the build fails outright) and, once selected, adds ring
# beside aws-lc-rs rather than instead of it. The C toolchain arrives
# with the HTTPS client either way; this way it arrives once.
object_store = { version = "0.14", default-features = false, features = ["aws"] }

# The decode probe over uploaded pictures (WebP only — clients re-encode
# on device). Decoding alone: the crate's encoders, and every format but
# the one that is stored, are off.
image = { version = "0.25", default-features = false, features = ["webp"] }

# The key-backup blob reference (auth.md "Blob format (v1)") — used only
# by common's golden-vector export. Pinned to the 0.10-generation
# RustCrypto stack to stay on the workspace's sha2/digest line.
hkdf = { version = "0.12" }
aes-gcm = { version = "0.10" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
