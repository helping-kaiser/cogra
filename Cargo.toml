[workspace]
members = [
    "crates/api",
    "crates/l1-standin",
    "crates/postgres-store",
    "crates/common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework + GraphQL
# axum 0.8 matches the version async-graphql-axum 7 builds against, so the
# GraphQLRequest extractor and the router agree on one axum.
axum = { version = "0.8" }
async-graphql = { version = "7" }
async-graphql-axum = { version = "7" }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Tracing / logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
config = { version = "0.14" }

# Shared primitive types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# The interim act-authentication realization for the L1 stand-in
# (open-questions.md Q30 — stand-in-scoped choices, not a Q30 resolution):
# Ed25519 signatures, SHA-256 salted hash commitments.
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = { version = "0.10" }
rand = { version = "0.8" }
hex = { version = "0.4" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
