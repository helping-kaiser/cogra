# The content surface (api-spec.md "Content authoring", roadmap
# "Slice 2"): the four prepare verbs, the chronological listing, and
# the post-with-thread read. Reads are anonymous-capable; prepares are
# member-session writes signed in this browser. Documents spread the
# shared selections from `fragments.graphql`; masking is off in
# `codegen.ts`, so a spread reads exactly as an inline selection did.

mutation PreparePost($input: PreparePostInput!) {
  preparePost(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PreparePostEdit($input: PreparePostEditInput!) {
  preparePostEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareComment($input: PrepareCommentInput!) {
  prepareComment(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareCommentEdit($input: PrepareCommentEditInput!) {
  prepareCommentEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# `includePending` carries the schema's own default: a listing serves
# pending entries unless the reader asks for the settled graph.
query Posts($first: Int!, $after: String, $includePending: Boolean! = true) {
  posts(first: $first, after: $after, includePending: $includePending) {
    edges {
      node {
        ...PostFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query PostDetail(
  $id: UUID!
  $commentsFirst: Int!
  $commentsAfter: String
  $includePending: Boolean! = true
) {
  post(id: $id) {
    ...PostFields
    # The AUTHOR'S OWN mark, which is not the same question as
    # `moderationStatus` (round 4): what a reader sees is the OR of the two
    # marks and neither side can clear the other, so an edit that re-stated the
    # OR would let a moderator's mark become the author's. The edit switch reads
    # this and nothing else. Selected here, on the single root post, and
    # deliberately outside `PostFields`, where every feed card would pay for it.
    sensitiveSelfMark
    comments(
      first: $commentsFirst
      after: $commentsAfter
      includePending: $includePending
    ) {
      edges {
        node {
          ...CommentFields
          # THE BRANCH ARRIVES AS A COUNT, NOT AS A PAGE (Q49). A thread read
          # used to carry a page of replies inside every comment, which priced
          # eighty-odd nodes to draw a line reading "View 2 replies".
          # `first: 0` asks for no edges at all and `totalCount` is one
          # aggregate the budget charges nothing for, so a collapsed thread
          # costs its comments and nothing more. Unfolding a branch is its own
          # read, made only by the reader who asked for it.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies, each
# carrying only the COUNT of its own branch — the same rule as the thread
# read, one level down, so unfolding cannot re-create the cost Q49 removed.
query CommentReplies(
  $id: UUID!
  $first: Int!
  $after: String
  $includePending: Boolean! = true
) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          # The same rule as the thread read, one level down: an unfolded
          # branch carries its own children as a count, never as a page.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE COMMENT EDIT'S OWN READ, and the reason it is its own operation.
#
# The edit switch shows the AUTHOR'S own sensitive mark, never the OR a reader
# sees (round 4). `sensitiveSelfMark` could have been selected on the comment
# nodes inside `PostDetail` — but a detail read carries a page of comments each
# carrying a page of replies, so one scalar there is paid for eighty-odd times
# on every open of every post. Here it is paid for once, and only by the reader
# who actually opened an editor.
query CommentSelfMark($id: UUID!) {
  comment(id: $id) {
    id
    sensitiveSelfMark
  }
}
