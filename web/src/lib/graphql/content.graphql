query Posts($first: Int!, $after: String) {
  posts(first: $first, after: $after) {
    edges {
      node {
    id
        title {
          value
          status
        }
        description {
          value
          status
        }
        content {
          value
          status
        }
        author {
          id
          handle
        }
        createdAt
        updatedAt
        moderationStatus
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query PostDetail($id: UUID!, $commentsFirst: Int!, $commentsAfter: String) {
  post(id: $id) {
    id
    title {
      value
      status
    }
    description {
      value
      status
    }
    content {
      value
      status
    }
    author {
      id
      handle
    }
    createdAt
    updatedAt
    moderationStatus
    comments(first: $commentsFirst, after: $commentsAfter) {
      edges {
        node {
          id
          content {
            value
            status
          }
          author {
            id
            handle
          }
          createdAt
          updatedAt
          moderationStatus
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
