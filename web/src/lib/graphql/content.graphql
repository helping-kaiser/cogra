# `includePending` carries the schema's own default: a listing serves
# pending entries unless the reader asks for the settled graph.
query Posts($first: Int!, $after: String, $includePending: Boolean! = true) {
  posts(first: $first, after: $after, includePending: $includePending) {
    edges {
      node {
        id
        title {
          value
          status
        }
        description {
          value
          status
        }
        content {
          value
          status
        }
        # The gallery, in the author's order, the first entry the cover. A
        # bounded fold list rather than a connection, so it prices at its
        # cap. `digest` is deliberately unread: checking the transitive
        # witness is not what a render does, and the field would cost its
        # bound on every node.
        attachments {
          id
          url
          altText
          status
          options {
            aspectRatio
          }
        }
        # One state for the whole set: sensitivity veils the body as one.
        attachmentsStatus
        author {
          id
          handle
          displayName {
            value
          }
        }
        createdAt
        updatedAt
        landing {
          state
        }
        moderationStatus
        license {
          attribution
          provenance
        }
        # The chip row (D8): the author's own current tags only — the
        # content-intrinsic channel, the one that needs no forward-path
        # weight (feed-ranking.md §4; the ranker arrives in slice 3).
        topics(includePending: $includePending) {
          hashtag {
            id
            name {
              value
              status
            }
          }
          relevance
          confidence
          pending
        }
        # The reference row (D12, D16): the author's own current
        # citations only — the content-intrinsic channel, the one that
        # needs no forward-path weight. The target is typed so a chip
        # renders without a second read; it is null when CoGra carries
        # no display row for what the citation names.
        references(includePending: $includePending) {
          targetId
          relevance
          support
          # The feed's own row never edits, but `PostView` is the type
          # the detail's post is read through, and the compose edit
          # surface builds its drafts from that — so the field the
          # withdrawal confirm reads has to be on this selection too.
          withdrawalCost
          pending
          target {
            __typename
            ... on User {
              id
              handle
              displayName {
                value
              }
            }
            ... on Post {
              id
              title {
                value
              }
              content {
                value
              }
              author {
                handle
              }
            }
            # A referenced comment opens the post carrying it —
            # comment permalinks are a parked item — so the selection
            # walks up far enough to find one.
            ... on Comment {
              id
              content {
                value
              }
              author {
                handle
              }
              target {
                __typename
                ... on Post {
                  id
                }
                ... on Comment {
                  target {
                    __typename
                    ... on Post {
                      id
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

