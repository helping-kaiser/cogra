query Posts($first: Int!, $after: String) {
  posts(first: $first, after: $after) {
    edges {
      node {
        id
        title {
          value
          status
        }
        description {
          value
          status
        }
        content {
          value
          status
        }
        author {
          id
          handle
          displayName {
            value
          }
        }
        createdAt
        updatedAt
        landing {
          state
        }
        moderationStatus
        license {
          attribution
          oversight
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query PostDetail($id: UUID!, $commentsFirst: Int!, $commentsAfter: String, $repliesFirst: Int!) {
  post(id: $id) {
    id
    title {
      value
      status
    }
    description {
      value
      status
    }
    content {
      value
      status
    }
    author {
      id
      handle
      displayName {
        value
      }
    }
    createdAt
    updatedAt
    landing {
      state
    }
    moderationStatus
    license {
      attribution
      oversight
    }
    comments(first: $commentsFirst, after: $commentsAfter) {
      edges {
        node {
          id
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          license {
            attribution
            oversight
          }
          replies(first: $repliesFirst) {
            edges {
              node {
                id
                content {
                  value
                  status
                }
                author {
                  id
                  handle
                  displayName {
                    value
                  }
                }
                createdAt
                updatedAt
                landing {
                  state
                }
                moderationStatus
                license {
                  attribution
                  oversight
                }
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies,
# each carrying its own first reply page so nesting can continue.
query CommentReplies($id: UUID!, $first: Int!, $after: String, $repliesFirst: Int!) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after) {
      edges {
        node {
          id
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          license {
            attribution
            oversight
          }
          replies(first: $repliesFirst) {
            edges {
              node {
                id
                content {
                  value
                  status
                }
                author {
                  id
                  handle
                  displayName {
                    value
                  }
                }
                createdAt
                updatedAt
                landing {
                  state
                }
                moderationStatus
                license {
                  attribution
                  oversight
                }
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
