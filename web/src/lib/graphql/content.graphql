# The content surface (api-spec.md "Content authoring", roadmap
# "Slice 2"): the four prepare verbs, the chronological listing, and
# the post-with-thread read. Reads are anonymous-capable; prepares are
# member-session writes signed in this browser. Documents spread the
# shared selections from `fragments.graphql`; masking is off in
# `codegen.ts`, so a spread reads exactly as an inline selection did.

mutation PreparePost($input: PreparePostInput!) {
  preparePost(input: $input) {
    node
    writes {
      ...PreparedWriteFields
      # Carried with an applicant's application: checked, kept, signed at the landing.
      carried
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PreparePostEdit($input: PreparePostEditInput!) {
  preparePostEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareComment($input: PrepareCommentInput!) {
  prepareComment(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareCommentEdit($input: PrepareCommentEditInput!) {
  prepareCommentEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# THE AUTHOR'S REMOVE (api-spec.md `removeContent`; erasure.md §1): the whole
# chain at once — the node's genesis record named by `genesisRecordId`, and
# `includeRevisions: true` because the confirm promises "every earlier
# version's". Immediate and unsigned: nothing is prepared or signed, so it
# is not a prepare. The payload names only the records that have landed — a
# still-settling post answers `records: []` with no error and lands reduced —
# so the surface re-reads the node to draw its mark rather than trusting
# this list.
mutation RemoveContent($record: RecordId!) {
  removeContent(input: { record: $record, includeRevisions: true }) {
    records {
      id
      payloadState
      redactedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# THE NODE RE-READ AFTER A REMOVE (the packet's RM-G5 build word): the mark
# alone, off the node itself — `removal` is the one field the card's whole
# removed state derives from. A node read rather than the surface's own
# refetch, because the surfaces a removal happens on hold things a refetch
# would throw away: the thread its unfolded branches and the reader's place
# (CommentRemoved.md:15, :19), the feed its derived window. Apollo normalises
# the answer onto the cached node, so every cached read agrees with it.
query PostRemoval($id: UUID!) {
  post(id: $id) {
    id
    removal {
      at
      by
    }
  }
}

query CommentRemoval($id: UUID!) {
  comment(id: $id) {
    id
    removal {
      at
      by
    }
  }
}

# A post as the FEED CARD draws it — and, for the same reason, what the detail
# page paints from the cache before its own read lands (`readCachedPost`).
#
# One definition for both is the point: the cache read asks for exactly what
# the feed wrote, so a field the feed gains is a field the read asks for, and
# the two can never drift into a read that always misses.
fragment FeedPost on Post {
  ...PostFields
  # THE CARD'S COMMENT AFFORDANCE (design/components/content/PostCard.jsx
  # :317-349): "read the replies" is a different intent from "read the
  # post", so the count is on the card rather than behind its tap. Asked
  # for the same way the thread read asks for a branch — `first: 0` for
  # no edges at all, and `totalCount` alone, the one aggregate the budget
  # charges nothing for — so a feed of twenty cards still costs twenty
  # posts. It stays outside `PostFields` because the detail read selects
  # the same connection with a page of edges, and one response key cannot
  # carry two argument sets.
  comments(first: 0, includePending: $includePending) {
    totalCount
  }
}

query PostDetail(
  $id: UUID!
  $commentsFirst: Int!
  $commentsAfter: String
  $includePending: Boolean! = true
) {
  post(id: $id) {
    # `PostFields` carries the AUTHOR'S OWN mark and its reason, which the
    # edit switch reads and nothing else (round 4): what a reader sees is the
    # OR of the two marks and neither side can clear the other, so an edit
    # that re-stated the OR would let a moderator's mark become the author's,
    # and the edit contract is complete state, so a save that re-states the
    # mark without its reason silently clears the line the veil shows.
    ...PostFields
    comments(
      first: $commentsFirst
      after: $commentsAfter
      includePending: $includePending
    ) {
      # The detail card wears the same comment affordance the feed card does,
      # and the count it states is the WHOLE thread's, not this page's.
      totalCount
      edges {
        node {
          ...CommentFields
          # THE BRANCH ARRIVES AS A COUNT, NOT AS A PAGE (Q49). A thread read
          # used to carry a page of replies inside every comment, which priced
          # eighty-odd nodes to draw a line reading "View 2 replies".
          # `first: 0` asks for no edges at all and `totalCount` is one
          # aggregate the budget charges nothing for, so a collapsed thread
          # costs its comments and nothing more. Unfolding a branch is its own
          # read, made only by the reader who asked for it.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE THREAD'S OWN READ, and the reason it is its own operation.
#
# The comments sheet is the one comments surface (jakob 2026-09-15): the count
# on a feed card raises the same full-function thread the detail's count does.
# A feed card has no detail read behind it, so a thread that could only arrive
# inside `PostDetail` could not be raised there at all.
#
# It selects the comments connection exactly as `PostDetail` does — the same
# fields, the same `first: 0` branch counts (Q49) — and nothing of the post
# beyond the id that answered, because the surface underneath already has the
# post it drew the count from.
query PostComments(
  $id: UUID!
  $first: Int!
  $after: String
  $includePending: Boolean! = true
) {
  post(id: $id) {
    id
    comments(first: $first, after: $after, includePending: $includePending) {
      # The whole thread's size, cursor-independent — the count the card
      # states, so the sheet can stand on its own beside it.
      totalCount
      edges {
        node {
          ...CommentFields
          # A branch arrives as a count, never as a page (Q49).
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies, each
# carrying only the COUNT of its own branch — the same rule as the thread
# read, one level down, so unfolding cannot re-create the cost Q49 removed.
query CommentReplies(
  $id: UUID!
  $first: Int!
  $after: String
  $includePending: Boolean! = true
) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          # The same rule as the thread read, one level down: an unfolded
          # branch carries its own children as a count, never as a page.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE COMMENT EDIT'S OWN READ. The edit switch shows the AUTHOR'S own
# sensitive mark, never the OR a reader sees (round 4), and the edit contract
# is complete state, so the editor reads the mark and its reason from the
# record as it stands when it opens, never from the thread's copy of it.
query CommentSelfMark($id: UUID!) {
  comment(id: $id) {
    id
    sensitiveSelfMark
    sensitiveReason
  }
}

# THE EDIT PAD'S BACKING READ (EditPad.md): the author's own Publish bundle
# toward their post — the genesis and every edit — as its RAW sum, which
# `Current backing`, `Backing after`, the cap line and `Walk it all back` all
# fold from. Its own operation for the reason `CommentSelfMark` is: an edit
# opens one post, once. Pending records count — an edit signed a moment ago
# is part of the backing the next edit adds to, landed or not. Null for any
# viewer but the post's creator.
query PostBacking($id: UUID!) {
  post(id: $id) {
    id
    viewerBacking(includePending: true) {
      rawPDirected
    }
  }
}

# LANDING ON A COMMENT (Saved.md; jakob 2026-10-01): one step up a comment's
# chain — what it answers. A reply sits behind its parent's collapsed count, so
# the thread walks up to the top level and unfolds each branch on the way down.
query CommentParent($id: UUID!) {
  comment(id: $id) {
    id
    target {
      __typename
      ... on Comment {
        id
      }
      ... on Post {
        id
      }
    }
  }
}
