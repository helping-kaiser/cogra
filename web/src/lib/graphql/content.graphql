# `includePending` carries the schema's own default: a listing serves
# pending entries unless the reader asks for the settled graph.
query Posts($first: Int!, $after: String, $includePending: Boolean! = true) {
  posts(first: $first, after: $after, includePending: $includePending) {
    edges {
      node {
        id
        title {
          value
          status
        }
        description {
          value
          status
        }
        content {
          value
          status
        }
        # The gallery, in the author's order, the first entry the cover. A
        # bounded fold list rather than a connection, so it prices at its
        # cap. `digest` is deliberately unread: checking the transitive
        # witness is not what a render does, and the field would cost its
        # bound on every node.
        attachments {
          id
          url
          altText
          status
          options {
            aspectRatio
          }
        }
        # One state for the whole set: sensitivity veils the body as one.
        attachmentsStatus
        author {
          id
          handle
          displayName {
            value
          }
          avatar {
            url
          }
        }
        createdAt
        updatedAt
        landing {
          state
        }
        moderationStatus
        license {
          attribution
          provenance
        }
        # The chip row (D8): the author's own current tags only — the
        # content-intrinsic channel, the one that needs no forward-path
        # weight (feed-ranking.md §4; the ranker arrives in slice 3).
        topics(includePending: $includePending) {
          hashtag {
            id
            name {
              value
              status
            }
          }
          relevance
          confidence
          pending
        }
        # The reference row (D12, D16): the author's own current
        # citations only — the content-intrinsic channel, the one that
        # needs no forward-path weight. The target is typed so a chip
        # renders without a second read; it is null when CoGra carries
        # no display row for what the citation names.
        references(includePending: $includePending) {
          targetId
          relevance
          support
          # The feed's own row never edits, but `PostView` is the type
          # the detail's post is read through, and the compose edit
          # surface builds its drafts from that — so the field the
          # withdrawal confirm reads has to be on this selection too.
          withdrawalCost
          pending
          target {
            __typename
            ... on User {
              id
              handle
              displayName {
                value
              }
            }
            ... on Post {
              id
              title {
                value
              }
              content {
                value
              }
              author {
                handle
              }
            }
            # A referenced comment opens the post carrying it —
            # comment permalinks are a parked item — so the selection
            # walks up far enough to find one.
            ... on Comment {
              id
              content {
                value
              }
              author {
                handle
              }
              target {
                __typename
                ... on Post {
                  id
                }
                ... on Comment {
                  target {
                    __typename
                    ... on Post {
                      id
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query PostDetail(
  $id: UUID!
  $commentsFirst: Int!
  $commentsAfter: String
  $includePending: Boolean! = true
) {
  post(id: $id) {
    id
    title {
      value
      status
    }
    description {
      value
      status
    }
    content {
      value
      status
    }
    # The gallery, in the author's order, the first entry the cover. A
    # bounded fold list rather than a connection, so it prices at its
    # cap. `digest` is deliberately unread: checking the transitive
    # witness is not what a render does, and the field would cost its
    # bound on every node.
    attachments {
      id
      url
      altText
      status
      options {
        aspectRatio
      }
    }
    # One state for the whole set: sensitivity veils the body as one.
    attachmentsStatus
    # The AUTHOR'S OWN mark, which is not the same question as
    # `moderationStatus` (round 4): what a reader sees is the OR of the two
    # marks and neither side can clear the other, so an edit that re-stated the
    # OR would let a moderator's mark become the author's. The edit switch reads
    # this and nothing else. Selected here, on the single root post, and
    # deliberately NOT on the comment and reply selections below, where it would
    # be paid for on every one of them.
    sensitiveSelfMark
    author {
      id
      handle
      displayName {
        value
      }
      avatar {
        url
      }
    }
    createdAt
    updatedAt
    landing {
      state
    }
    moderationStatus
    license {
      attribution
      provenance
    }
    topics(includePending: $includePending) {
      hashtag {
        id
        name {
          value
          status
        }
      }
      relevance
      confidence
      pending
    }
    # The reference row (D12, D16): the author's own current
    # citations only — the content-intrinsic channel, the one that
    # needs no forward-path weight. The target is typed so a chip
    # renders without a second read; it is null when CoGra carries
    # no display row for what the citation names.
    references(includePending: $includePending) {
      targetId
      relevance
      support
      # What removing this citation costs: the counter-records that net
      # its bundle to (0, 0), off the RAW sums the clipped pair above
      # has already lost. An editing surface confirms against this
      # BEFORE it prepares anything.
      withdrawalCost
      pending
      target {
        __typename
        ... on User {
          id
          handle
          displayName {
            value
          }
        }
        ... on Post {
          id
          title {
            value
          }
          content {
            value
          }
          author {
            handle
          }
        }
        # A referenced comment opens the post carrying it —
        # comment permalinks are a parked item — so the selection
        # walks up far enough to find one.
        ... on Comment {
          id
          content {
            value
          }
          author {
            handle
          }
          target {
            __typename
            ... on Post {
              id
            }
            ... on Comment {
              target {
                __typename
                ... on Post {
                  id
                }
              }
            }
          }
        }
      }
    }
    comments(
      first: $commentsFirst
      after: $commentsAfter
      includePending: $includePending
    ) {
      edges {
        node {
          id
          content {
            value
            status
          }
          # The gallery, in the author's order, the first entry the cover. A
          # bounded fold list rather than a connection, so it prices at its
          # cap. `digest` is deliberately unread: checking the transitive
          # witness is not what a render does, and the field would cost its
          # bound on every node.
          attachments {
            id
            url
            altText
            status
            options {
              aspectRatio
            }
          }
          # One state for the whole set: sensitivity veils the body as one.
          attachmentsStatus
          author {
            id
            handle
            displayName {
              value
            }
            avatar {
              url
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          license {
            attribution
            provenance
          }
          topics(includePending: $includePending) {
            hashtag {
              id
              name {
                value
                status
              }
            }
            relevance
            confidence
            pending
          }
          # The reference row (D12, D16): the author's own current
          # citations only — the content-intrinsic channel, the one that
          # needs no forward-path weight. The target is typed so a chip
          # renders without a second read; it is null when CoGra carries
          # no display row for what the citation names.
          references(includePending: $includePending) {
            targetId
            relevance
            support
            withdrawalCost
            pending
            target {
              __typename
              ... on User {
                id
                handle
                displayName {
                  value
                }
              }
              ... on Post {
                id
                title {
                  value
                }
                content {
                  value
                }
                author {
                  handle
                }
              }
              # A referenced comment opens the post carrying it —
              # comment permalinks are a parked item — so the selection
              # walks up far enough to find one.
              ... on Comment {
                id
                content {
                  value
                }
                author {
                  handle
                }
                target {
                  __typename
                  ... on Post {
                    id
                  }
                  ... on Comment {
                    target {
                      __typename
                      ... on Post {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
          # THE BRANCH ARRIVES AS A COUNT, NOT AS A PAGE (Q49). A thread read
          # used to carry a page of replies inside every comment, which priced
          # eighty-odd nodes to draw a line reading "View 2 replies".
          # `first: 0` asks for no edges at all and `totalCount` is one
          # aggregate the budget charges nothing for, so a collapsed thread
          # costs its comments and nothing more. Unfolding a branch is its own
          # read, made only by the reader who asked for it.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies, each
# carrying only the COUNT of its own branch — the same rule as the thread
# read, one level down, so unfolding cannot re-create the cost Q49 removed.
query CommentReplies(
  $id: UUID!
  $first: Int!
  $after: String
  $includePending: Boolean! = true
) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after, includePending: $includePending) {
      edges {
        node {
          id
          content {
            value
            status
          }
          # The gallery, in the author's order, the first entry the cover. A
          # bounded fold list rather than a connection, so it prices at its
          # cap. `digest` is deliberately unread: checking the transitive
          # witness is not what a render does, and the field would cost its
          # bound on every node.
          attachments {
            id
            url
            altText
            status
            options {
              aspectRatio
            }
          }
          # One state for the whole set: sensitivity veils the body as one.
          attachmentsStatus
          author {
            id
            handle
            displayName {
              value
            }
            avatar {
              url
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          license {
            attribution
            provenance
          }
          topics(includePending: $includePending) {
            hashtag {
              id
              name {
                value
                status
              }
            }
            relevance
            confidence
            pending
          }
          # The reference row (D12, D16): the author's own current
          # citations only — the content-intrinsic channel, the one that
          # needs no forward-path weight. The target is typed so a chip
          # renders without a second read; it is null when CoGra carries
          # no display row for what the citation names.
          references(includePending: $includePending) {
            targetId
            relevance
            support
            withdrawalCost
            pending
            target {
              __typename
              ... on User {
                id
                handle
                displayName {
                  value
                }
              }
              ... on Post {
                id
                title {
                  value
                }
                content {
                  value
                }
                author {
                  handle
                }
              }
              # A referenced comment opens the post carrying it —
              # comment permalinks are a parked item — so the selection
              # walks up far enough to find one.
              ... on Comment {
                id
                content {
                  value
                }
                author {
                  handle
                }
                target {
                  __typename
                  ... on Post {
                    id
                  }
                  ... on Comment {
                    target {
                      __typename
                      ... on Post {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
          # The same rule as the thread read, one level down: an unfolded
          # branch carries its own children as a count, never as a page.
          replies(first: 0, includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE COMMENT EDIT'S OWN READ, and the reason it is its own operation.
#
# The edit switch shows the AUTHOR'S own sensitive mark, never the OR a reader
# sees (round 4). `sensitiveSelfMark` could have been selected on the comment
# nodes inside `PostDetail` — but a detail read carries a page of comments each
# carrying a page of replies, so one scalar there is paid for eighty-odd times
# on every open of every post. Here it is paid for once, and only by the reader
# who actually opened an editor.
query CommentSelfMark($id: UUID!) {
  comment(id: $id) {
    id
    sensitiveSelfMark
  }
}
