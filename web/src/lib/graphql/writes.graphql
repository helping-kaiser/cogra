# The client legs of the write path this slice signs: prepare →
# submit → approve → observe, plus the seal key the device verifies
# against (api-spec.md "The write flow").

query HostPublicKey {
  hostPublicKey
}

# The raw L1 identifiers of the nodes a gesture names, read before its
# batch is prepared: the device checks every act's endpoints against
# them before it pre-signs anything (intent.ts). Content resolves through
# `nodes`; a person through `user`, which `nodes` does not cover.
query ContentGraphIds($ids: [UUID!]!) {
  nodes(ids: $ids) {
    __typename
    ... on Post {
      id
      graphId
    }
    ... on Comment {
      id
      graphId
    }
  }
}

query UserGraphId($id: UUID!) {
  user(id: $id) {
    id
    graphId
  }
}

mutation PrepareStance($input: PrepareStanceInput!) {
  prepareStance(input: $input) {
    writes {
      id
      family
      canonicalProposal
      # Carried with an applicant's application: checked, kept, signed at the landing.
      carried
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation SubmitProposals($input: SubmitProposalsInput!) {
  submitProposals(input: $input) {
    stagedWrites {
      ...StagedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ApproveActs($input: ApproveActsInput!) {
  approveActs(input: $input) {
    stagedWrites {
      ...StagedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

query StagedWrite($id: UUID!) {
  stagedWrite(id: $id) {
    ...StagedWriteFields
  }
}
