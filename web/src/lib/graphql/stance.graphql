# The stance surface (api-spec.md "The generic stance", design.md §8):
# the viewer's own bundle toward a node, the projection of a candidate
# pick, and severance staging.
#
# `viewerStance` hangs off the four concrete types that carry it —
# Post, Comment, User, and Hashtag — and no interface gathers them, so
# the read enters through the root that matches the target. Asking
# `node(id:)` and `user(id:)` in one document instead would issue a
# lookup known to be null on every post and comment, and a feed page
# renders one control per card.
#
# `pick` omitted leaves `projected` null: the same field answers both
# the standing read and the landing read, so a projection costs one
# round trip and carries the standing with it.
#
# The four reads differ only in their root, so the bundle itself is one
# spread of `StanceBundleFields` (fragments.graphql).

query PostStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  post(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query CommentStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  comment(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query ProfileStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  user(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# The follow control's own read (hashtag.md §3, D9): a topic's identity
# is its name, not a UUID, so this root takes `name` where the other
# three take `id` — otherwise the identical `viewerStance` shape.
query HashtagStance($name: String!, $pick: StancePickInput, $includePending: Boolean! = true) {
  hashtag(name: $name) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# Stages the counter-records that net the bundle to (0, 0) — each its
# own priced act, so the batch length is the gesture's cost. Refused
# when the bundle already nets there (api-spec.md "The generic
# stance").
mutation PrepareSeverance($input: PrepareSeveranceInput!) {
  prepareSeverance(input: $input) {
    writes {
      id
      family
      canonicalProposal
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
