# The stance surface (api-spec.md "The generic stance", design.md §8):
# the viewer's own bundle toward a node, the projection of a candidate
# pick, and severance staging.
#
# `viewerStance` hangs off the four concrete types that carry it —
# Post, Comment, User, and Hashtag — and no interface gathers them, so
# the read enters through the root that matches the target. Asking
# `node(id:)` and `user(id:)` in one document instead would issue a
# lookup known to be null on every post and comment, and a feed page
# renders one control per card.
#
# `pick` omitted leaves `projected` null: the same field answers both
# the standing read and the landing read, so a projection costs one
# round trip and carries the standing with it.
#
# The four reads differ only in their root, so the bundle itself is one
# spread of `StanceBundleFields` (fragments.graphql).

query PostStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  post(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query CommentStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  comment(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query ProfileStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean! = true) {
  user(id: $id) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# A PAGE'S FACES IN ONE REQUEST. The controls a page mounts together ask
# their standings through this one read rather than one root read each
# (apollo-stance-data.ts `bundle`): the server answers the faces at one
# depth of a document in one grouped bundle read, whatever the page's size
# (api-spec.md "The generic stance"). Standing only — a projection names a
# pick and keeps the per-root read above. `nodes` is priced at its ids times
# the row and capped at the server's page size, so the seam sends at most
# that many ids at once. A topic is not a `Node` and keeps `HashtagStance`.
query PageStances($ids: [UUID!]!, $includePending: Boolean!) {
  nodes(ids: $ids) {
    __typename
    id
    ... on Post {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
    ... on Comment {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
    ... on User {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
  }
}

# The follow control's own read (hashtag.md §3, D9): a topic's identity
# is its name, not a UUID, so this root takes `name` where the other
# three take `id` — otherwise the identical `viewerStance` shape.
query HashtagStance($name: String!, $pick: StancePickInput, $includePending: Boolean! = true) {
  hashtag(name: $name) {
    id
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# A GUEST'S FACES WEAR THE BORROWED VIEW'S OWN STANCE (FeedBare.md:7,
# TagPage.md:73, GuestGate.md:11): `borrowedStance`, read-only, null where
# that view holds none and for any session. Its own four reads rather than a
# field on the four above: a guest's request never asks `viewerStance` or a
# `targetGraphId`, so nothing an act could be signed toward rides it, and a
# member's reads stay as they were. Never in a card fragment (the price of
# the card pages, seam 428).

query PostBorrowedStance($id: UUID!) {
  post(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query CommentBorrowedStance($id: UUID!) {
  comment(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query ProfileBorrowedStance($id: UUID!) {
  user(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query HashtagBorrowedStance($name: String!) {
  hashtag(name: $name) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

# Stages the counter-records that net the bundle to (0, 0) — each its
# own priced act, so the batch length is the gesture's cost. Refused
# when the bundle already nets there (api-spec.md "The generic
# stance").
mutation PrepareSeverance($input: PrepareSeveranceInput!) {
  prepareSeverance(input: $input) {
    writes {
      id
      family
      canonicalProposal
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
