# The score's trace (api-spec.md `feedTrace`; score-readout packet §7,
# X-SR1): one LIVE read per trace open, the four levels drawn from its one
# answer (CD-SR2). It carries no pin — paths are never stored, so every tap
# is a real fetch, and the reader adopts the figure it finds (PR-39).
#
# THE SELECTION IS WHAT THE BOARDS DRAW, and nothing the ranker keeps for
# spot-checks: `weight`, `magnitude` and `recency` are never rendered
# (RankPath.md: no step carries a number), so they are not asked for. A
# path's people are named by their slice nodes; the records carry their
# own family, giver, legs and landing instant — what a step's title, its
# fold and the floor's rows read.
query FeedTrace($viewer: UUID!, $target: UUID!) {
  feedTrace(viewer: $viewer, target: $target) {
    score
    paths {
      nodes {
        graphId
        id
        kind
      }
      sign
      contribution
      hops {
        pDirected
        pInterest
        records {
          id
          family
          authorId
          author {
            id
            handle
            displayName {
              value
            }
          }
          targetId
          terminalId
          landedAt
          legs {
            role
            sourceId
            targetId
            pDirected
            pInterest
            censusUnknown
          }
        }
      }
    }
  }
}

# The trace's people and things, hydrated once per open over the answer's
# distinct node ids (score-readout §7: "batched over the answer's distinct
# ids that carry a UUID"), the held thing among them when the tap handed no
# cover (a reload). A person is a face and a handle; a post its title, its
# author and how it starts; a comment its author and first words.
query TraceNodes($ids: [UUID!]!, $includePending: Boolean! = true) {
  nodes(ids: $ids) {
    __typename
    ... on User {
      id
      handle
      displayName {
        value
      }
      avatar {
        url
      }
    }
    ... on Post {
      ...PostFields
    }
    ... on Comment {
      id
      content {
        value
        status
      }
      author {
        id
        handle
        displayName {
          value
        }
        avatar {
          url
        }
      }
      landing {
        state
      }
    }
  }
}
