# The device lock's three verbs (auth.md "Device lock"): issue while
# signed in with "don't remember" on, release behind the current password
# at sign-in, discard when the opt-in ends. Mirrors the Android operation
# set (android/core/network).

mutation IssueDeviceLock {
  issueDeviceLock {
    lock {
      id
      secret
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ReleaseDeviceLock($input: ReleaseDeviceLockInput!) {
  releaseDeviceLock(input: $input) {
    secret
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation DiscardDeviceLock($input: DiscardDeviceLockInput!) {
  discardDeviceLock(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}
