# Account reads, credential recovery, and credential changes.
# requestPasswordReset is a silent verb: no userErrors by design —
# surfacing a failure would reintroduce account enumeration (api-spec.md § Mutations → Conventions →
# Errors).

query Me {
  me {
    id
    handle
    displayName {
      value
    }
    # WHOSE KEY THE ACCOUNT ACCEPTS. A custody slot holding a key says
    # nothing on its own about whose it is, so the signer compares this
    # against the slot's public half before it signs anything
    # (`key-usable.ts`). Null is the pre-attach window.
    actorPubkey
    accountState
    hasReciprocated
    # The vouch-back prompt's dismissal is account state, so it holds on
    # every device (auth.md "Reciprocation is the joiner's own act").
    vouchBackDismissed
    # The member who vouched the account in — the vouch card, the
    # vouch-back pad and the ceremony all name them, and wear their face.
    invitedBy {
      id
      handle
      displayName {
        value
      }
      ... on User {
        avatar {
          url
        }
      }
    }
    # The sensitive-content choice is the ACCOUNT's (Settings' Always
    # unveil sensitive content): 0 unveils wherever the account reads,
    # null or 1–10 keeps the veil — read here, never kept on the device.
    preferences {
      contentFilteringSeverityLevel
    }
  }
}

mutation DismissVouchBack {
  dismissVouchBack {
    user {
      id
      vouchBackDismissed
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Whose view this reader browses from (api-spec.md "Queries") — the one
# read behind the borrowed-view band, and the only account-shaped read a
# signed-out reader makes. Null once their own view exists.
query BorrowedView {
  borrowedView {
    id
    handle
    displayName {
      value
    }
    # The band wears the vantage's face (VouchBack board); `Actor` has
    # no avatar of its own, so it is read off the User the vantage is.
    ... on User {
      avatar {
        url
      }
    }
  }
}

mutation RequestPasswordReset($input: RequestPasswordResetInput!) {
  requestPasswordReset(input: $input) {
    ok
  }
}

mutation ConfirmPasswordReset($input: ConfirmPasswordResetInput!) {
  confirmPasswordReset(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

query KeyBackup {
  me {
    id
    keyBackup
  }
}

mutation CreateKeyBackupChallenge {
  createKeyBackupChallenge {
    challenge
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation UploadKeyBackup($input: UploadKeyBackupInput!) {
  uploadKeyBackup(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangeHandle($input: ChangeHandleInput!) {
  changeHandle(input: $input) {
    user {
      id
      handle
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Settings' one read (settings-surface §6.1): every row the page draws
# stands on these, all viewer-only. The sessions come this device first
# by the client's own sort, `isCurrent` naming it.
query SettingsAccount {
  me {
    id
    handle
    email
    emailVerified
    accountState
    actorPubkey
    passwordChangedAt
    keyBackupCreatedAt
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    preferences {
      contentFilteringSeverityLevel
      defaultLicense {
        attribution
        provenance
      }
    }
    sessions {
      id
      deviceLabel
      createdAt
      lastUsedAt
      isCurrent
    }
  }
}

# The license a new post starts from — the wizard's seed. Null reads as
# public domain.
query DefaultLicense {
  me {
    id
    preferences {
      defaultLicense {
        attribution
        provenance
      }
    }
  }
}

# An absent field is left as it is; null restores the default.
mutation SetPreferences($input: SetPreferencesInput!) {
  setPreferences(input: $input) {
    preferences {
      contentFilteringSeverityLevel
      defaultLicense {
        attribution
        provenance
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# A wrong password and a malformed address refuse as userErrors; a spent
# account mail budget, and a run of wrong passwords, are a transport-tier
# RATE_LIMITED.
mutation RequestEmailChange($input: RequestEmailChangeInput!) {
  requestEmailChange(input: $input) {
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The code from the current address or the token from the new one's
# link; `user.pendingEmailChange` reads null once the change applied.
mutation ConfirmEmailChange($input: ConfirmEmailChangeInput!) {
  confirmEmailChange(input: $input) {
    user {
      id
      email
      pendingEmailChange {
        ...PendingEmailChangeFields
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Re-mails the owed sides only; NOT_FOUND once nothing is pending.
mutation ResendEmailChange {
  resendEmailChange {
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation CancelEmailChange {
  cancelEmailChange {
    user {
      id
      email
      pendingEmailChange {
        ...PendingEmailChangeFields
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The signed-out landing's read of a new-address link: anonymous, writes
# nothing, null for any token that names no change. The token is a
# secret, so it rides the POST body like every operation here.
query EmailChangeLinkCheck($token: String!) {
  emailChangeLinkCheck(token: $token) {
    newEmail
    state
  }
}

# Account deletion (auth.md "Self-service deletion"). The member path
# mails a link and schedules nothing; `accountDeletion` is non-null only
# once a deletion is confirmed — and on a request made while one already
# is, which changes nothing. A spent deletion mail budget is a
# transport-tier RATE_LIMITED. `deletionPath` is the server's read of which
# deletion verb answers (IMMEDIATE, BY_LINK or LOCKED); clients never
# re-derive it from `application.*`.
query AccountDeletion {
  me {
    id
    accountDeletion {
      ...AccountDeletionFields
    }
    deletionPath
  }
}

mutation RequestAccountDeletion($input: RequestAccountDeletionInput!) {
  requestAccountDeletion(input: $input) {
    accountDeletion {
      ...AccountDeletionFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Session-free: the link's token is the capability. Every dead link is
# one DELETION_TOKEN_INVALID; includeContent true adds the content
# sweep, and nothing takes it back.
mutation ConfirmAccountDeletion($input: ConfirmAccountDeletionInput!) {
  confirmAccountDeletion(input: $input) {
    accountDeletion {
      ...AccountDeletionFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Idempotent: with nothing standing it answers null and no error.
mutation CancelAccountDeletion {
  cancelAccountDeletion {
    accountDeletion {
      ...AccountDeletionFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The unfunded applicant's immediate delete; the session dies with the
# account. FORBIDDEN for a member and for a funded applicant.
mutation DeleteApplicantAccount {
  deleteApplicantAccount {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}
