# The Saved list (api-spec.md `User.bookmarks`, `setBookmark`,
# `removeBookmark`; saved-surface packet). One mixed list of posts,
# comments and people, newest first by save time, a page of TEN at a
# time — the page size is written as a literal so the client-operation
# guard prices the call the device actually makes. Ten, not the feed's
# twenty: every edge carries two whole card selections (a post's and a
# comment's), and twenty of them price past the complexity ceiling's
# headroom (`crates/api/tests/client_operations.rs`).
#
# SAVED IS A FEED (Saved.md, round 12): every saved thing stands as its
# kind's own live feed card, so each kind is read the way its card reads
# it — a post as the feed's own `FeedPost`, a comment as the thread's
# `CommentFields` plus what its head row names (the thing it answers)
# and what its search reads it by (its thread's root post), and a person
# as the profile card draws them. `bookmarkedAt` is the list's order and
# Undo's restore time; no card wears it.
query SavedPage($after: String, $includePending: Boolean! = true) {
  me {
    id
    bookmarks(first: 10, after: $after) {
      edges {
        cursor
        bookmarkedAt
        node {
          __typename
          ... on Post {
            ...FeedPost
          }
          ... on Comment {
            ...CommentFields
            # The comment card's head row: what the comment answers — a
            # post by its title (or first words) over its author, or a
            # comment by its author over its first words.
            target {
              __typename
              ... on Post {
                id
                title {
                  value
                  status
                }
                content {
                  value
                  status
                }
                # The head row's mark: the cover, or a clip's still.
                attachments {
                  url
                  status
                  mimeType
                  coverMedia {
                    url
                    status
                  }
                }
                author {
                  id
                  handle
                }
                moderationStatus
              }
              ... on Comment {
                id
                content {
                  value
                  status
                }
                author {
                  id
                  handle
                }
                moderationStatus
              }
            }
            # The thread's root post: where the card's doors land, and the
            # title a search reads a comment through.
            post {
              id
              title {
                value
                status
              }
            }
          }
          ... on User {
            id
            handle
            displayName {
              value
              status
            }
            bio {
              value
              status
            }
            avatar {
              url
              status
            }
            viewerBookmarkedAt
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Save, or restore a removed row's place: Undo passes the edge's own
# `bookmarkedAt` back.
mutation SetBookmark($node: UUID!, $bookmarkedAt: DateTime) {
  setBookmark(input: { node: $node, bookmarkedAt: $bookmarkedAt }) {
    bookmark {
      cursor
      bookmarkedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RemoveBookmark($node: UUID!) {
  removeBookmark(input: { node: $node }) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}
