# The profile surface (api-spec.md "Actors"; roadmap "Slice 2.1"):
# public reads by handle, the viewer's own profile, the authored
# chronicle, and the parallel-Registration update. The shared
# selections live in `fragments.graphql`.

query UserProfile($handle: String!) {
  user(handle: $handle) {
    id
    handle
    displayName {
      value
      status
    }
    bio {
      value
      status
    }
    websiteUrl {
      value
      status
    }
    # Null is the ordinary state, not a gap: the monogram is the designed
    # placeholder and stays the permanent fallback (D13).
    avatar {
      id
      url
      altText
      status
    }
    # The profile menu's Save / Unsave row.
    viewerBookmarkedAt
  }
}

query MyProfile {
  me {
    id
    handle
    displayName {
      value
      status
    }
    bio {
      value
      status
    }
    websiteUrl {
      value
      status
    }
    # Null is the ordinary state, not a gap: the monogram is the designed
    # placeholder and stays the permanent fallback (D13).
    avatar {
      id
      url
      altText
      status
    }
    # One ProfileView shape for both reads; null on the viewer's own.
    viewerBookmarkedAt
  }
}

# THE EVERYTHING TAB: the person's chronicle (`User.chronicle`), every act
# they signed, rendered as labelled rows — the Posts and Comments tabs are
# card views on reads of their own (ProfilePosts, ProfileComments). Its order
# is the server's and the content listings' (Profile.md:31,
# ProfileOther.md:27): the posts and comments still settling lead, newest
# signed first, then the landed records newest first; once one lands it
# stands ONCE, as its minting record. Every other act joins only once landed.
#
# A LANDED ACT is a `Record`: family + genesis mark, a snippet of the touched
# content, and the post to open. A record is a genesis when its
# target/terminal is the mint of its own act id. The row's age is its
# landing, an opinion row wears its own face (the pair, and `severed` to tell
# a walk-back), and an opinion on a person names them (`on @mira`,
# copy-voice's chronicle rows). `act` is the server's reading of what the
# record did beyond its family — GENESIS (a post published, a comment made,
# the account's joining), WALK_BACK (every record a walk-back signed), VOUCH
# (the vouch that landed someone), ORDINARY — the chronicle verbs' data.
#
# A STILL-SETTLING POST OR COMMENT is the node itself, read as light as its
# row: a union row prices at the sum of its kinds, so each carries only what
# the row draws and its door — its `landing`, its signing instant (the age;
# `createdAt` is when its minting record was authored), its words, and
# `genesisRecordId`, the record it lands as, which keys the row so the landed
# record and the settling entry are one row (`pagination.ts`). A comment
# carries its thread's post, the door the Comments tab's card opens. Their
# ids ride aliases: a `Record`'s `id` is a `RecordId`, a node's a `UUID`, and
# one response name may not carry both (GraphQL spec §5.3.2, *Field
# Selection Merging*).
query ProfileChronicle($id: UUID!, $first: Int!, $after: String) {
  user(id: $id) {
    id
    chronicle(first: $first, after: $after) {
      edges {
        node {
          __typename
          ... on Record {
            id
            family
            act
            targetId
            terminalId
            # A Type is no Node, so a topic the record ends at — a Tag's, or an
            # opinion's on a topic — is read here: the row's `#saltmaps` aside.
            topic {
              name {
                value
              }
            }
            landedAt
            pDirected
            pInterest
            severed
            target {
              __typename
              ... on User {
                id
                handle
              }
              # A removed post or comment keeps its row in the chronicle; `removal`
              # is the mark its second line reads in its words' place
              # (Profile.md:37, :39).
              ... on Post {
                id
                title {
                  value
                }
                content {
                  value
                }
                removal {
                  at
                  by
                }
              }
              ... on Comment {
                id
                content {
                  value
                }
                removal {
                  at
                  by
                }
                target {
                  __typename
                  ... on Post {
                    id
                  }
                }
              }
            }
            # The terminal leg: a Review's Comment, or what a Reference cites —
            # a post (`Cited a post`, its title under), a comment, or a person
            # (`Mentioned`, `@ada` beside) — copy-voice's chronicle verbs. Its
            # `removal` reads the mark in its words' place (Profile.md:37, :39).
            terminal {
              __typename
              ... on Comment {
                id
                content {
                  value
                }
                removal {
                  at
                  by
                }
                target {
                  __typename
                  ... on Post {
                    id
                  }
                }
              }
              ... on Post {
                id
                title {
                  value
                }
                content {
                  value
                }
                removal {
                  at
                  by
                }
              }
              ... on User {
                id
                handle
                avatar {
                  url
                }
              }
            }
          }
          ... on Post {
            postId: id
            genesisRecordId
            createdAt
            landing {
              state
            }
            title {
              value
            }
            content {
              value
            }
            removal {
              at
              by
            }
          }
          ... on Comment {
            commentId: id
            genesisRecordId
            createdAt
            landing {
              state
            }
            content {
              value
            }
            removal {
              at
              by
            }
            post {
              id
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE POSTS VIEW (ProfilePosts.md:3: "the posts view lists the person's
# posts as post cards, never as chronicle entries"): `User.posts`, the
# connection the header's `Posts` figure counts — every post the person
# published, a removed one and a still-settling one included, never an edit
# (ProfilePosts.md:15) — so the figure and the list agree. Newest first in
# the post listing's own order: the still-settling posts head it, newest
# signed first, each card wearing `Still settling` off its own
# `landing.state` (ProfilePosts.md:7), then the landed ones. Each edge's node
# is the post as the feed card draws it (`FeedPost`). A page of TWENTY: every
# edge carries a whole card. The page size is a literal so the
# client-operation guard prices the call the device makes.
query ProfilePosts($id: UUID!, $after: String, $includePending: Boolean! = true) {
  user(id: $id) {
    id
    posts(first: 20, after: $after) {
      edges {
        node {
          ...FeedPost
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# THE COMMENTS VIEW (ProfileComments.md:3: "the comments view lists the
# person's comments as comment cards, each in reach of its thread"):
# `User.comments`, every comment the person made, whatever it answers, a
# removed one included, never an edit. Newest first in the thread read's own
# order: the still-settling comments head it, newest signed first, each card
# wearing `Still settling` off its own `landing.state` (ProfileComments.md:5),
# then the landed ones. Each edge's node is the comment, carrying what its
# card draws: the thread's own fields, what it answers (the pointer it leads
# with, `CommentCard`'s line shape), the thread's post (where its doors
# land). A page of TWENTY, the posts view's size: every edge carries a
# whole card. The page size is a literal so the client-operation guard
# prices the call the device makes.
query ProfileComments($id: UUID!, $after: String, $includePending: Boolean! = true) {
  user(id: $id) {
    id
    comments(first: 20, after: $after) {
      edges {
        node {
          ...CommentFields
          target {
            __typename
            ... on Post {
              id
              title {
                value
                status
              }
              content {
                value
                status
              }
              attachments {
                url
                status
                mimeType
                coverMedia {
                  url
                  status
                }
              }
              author {
                id
                handle
              }
              moderationStatus
              removal {
                at
                by
              }
            }
            ... on Comment {
              id
              content {
                value
                status
              }
              author {
                id
                handle
              }
              moderationStatus
              removal {
                at
                by
              }
            }
          }
          post {
            id
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The header's three figures (ProfileHeader; open-questions.md Q35): they
# count BUNDLES, never records (jakob 2026-11-10) — one person's opinions
# toward one target are one, however often revised — each labelled and
# never merged, each read with `first: 0`, the number without a page.
# `Posts` is the Posts tab's own connection counted (`User.posts`): every
# post the person published, a removed one and a still-settling one
# included, never an edit, one per post, so its `totalCount` is its bundles
# and the figure and the list agree (ProfilePosts.md:15); `Opinions on them`
# the people holding an opinion on them and `Opinions by them` the people
# they hold one on, each a `bundleCount` over the unmarked Opinion records —
# exactly the rows the opinions page folds and lists.
query ProfileFigures($id: UUID!) {
  user(id: $id) {
    id
    posts(first: 0) {
      totalCount
    }
    opinionsOn: incomingRecords(family: OPINION, payloadMarked: false, first: 0) {
      bundleCount
    }
    opinionsBy: outgoingRecords(family: OPINION, toKind: USER, payloadMarked: false, first: 0) {
      bundleCount
    }
  }
}

mutation PrepareProfileUpdate($input: PrepareProfileUpdateInput!) {
  prepareProfileUpdate(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
