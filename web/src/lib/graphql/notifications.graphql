# The notification list (api-spec.md `User.notifications`,
# `User.hasUnreadNotifications`, `markNotificationsSeen`,
# `markNotificationRead`; notifications.md). The document is android's
# twin (android/core/network/src/main/graphql/notifications.graphql).

# THE BELL'S DOT, read on a fresh root load and never live (FeedUnread):
# a boolean, never a count. A root whose own load query has no `me`
# (the Wallet coming-soon root) reads this alone; the others may select
# the same field beside their own read.
query NotificationBell {
  me {
    id
    hasUnreadNotifications
  }
}

# THE LIST, newest first, one page of the default size at a time. Every
# row is one act: `kind` picks the drawn sentence, `actor` names who
# acted, `subject` is where the tap lands and carries the second line's
# words, `record` carries an opinion row's pair, and `application` is
# the queue entry an application row concerns, in its current state.
#
# A comment's own thread post is walked two levels up, the depth the
# reference row walks: a mention or citation carried by a comment reads
# `in <the thread's post title>`. `attachments` is read for its kinds
# only, for the untitled media form.
query Notifications($after: String) {
  me {
    id
    notifications(first: 20, after: $after) {
      edges {
        cursor
        node {
          id
          kind
          createdAt
          readAt
          actor {
            id
            handle
            displayName {
              value
              status
            }
            ... on User {
              avatar {
                url
                status
              }
            }
          }
          subject {
            __typename
            ... on Post {
              id
              title {
                value
                status
              }
              content {
                value
                status
              }
              attachments {
                mimeType
              }
            }
            ... on Comment {
              id
              content {
                value
                status
              }
              attachments {
                mimeType
              }
              target {
                __typename
                ... on Post {
                  id
                  title {
                    value
                    status
                  }
                  content {
                    value
                    status
                  }
                }
                ... on Comment {
                  id
                  target {
                    __typename
                    ... on Post {
                      id
                      title {
                        value
                        status
                      }
                      content {
                        value
                        status
                      }
                    }
                  }
                }
              }
            }
            ... on User {
              id
              handle
            }
          }
          context {
            __typename
            ... on Post {
              id
            }
            ... on Comment {
              id
            }
            ... on User {
              id
            }
          }
          record {
            id
            pDirected
            pInterest
          }
          application {
            id
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Clears the bell's dot when the list opens: everything at or before the
# newest row the opened list holds becomes seen. A row that arrived after
# the read stays unseen and lights the bell at the next root load.
mutation MarkNotificationsSeen($through: DateTime!) {
  markNotificationsSeen(input: { through: $through }) {
    hasUnreadNotifications
    userErrors {
      ...UserErrorFields
    }
  }
}

# Clears one row's unread dot when it is tapped.
mutation MarkNotificationRead($notification: UUID!) {
  markNotificationRead(input: { notification: $notification }) {
    notification {
      id
      readAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
