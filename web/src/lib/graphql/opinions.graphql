# WHO HOLDS AN OPINION ON THIS (design/readme.md item 55,
# `screens/PostOpinions.jsx`, `CommentOpinionsEmpty.jsx`) AND THE
# OPINIONS PAGE (`screens/ProfileStances.jsx`): the Opinion records on a
# post, a comment or a person, and the ones a person gave toward people
# — ungated, everyone can check every node.
#
# THE RECORDS, NOT THE PEOPLE. A revised opinion is a parallel record in
# its author's bundle, so a list's rows — one per person, their
# standing opinion — are the client's fold over the whole set
# (`held-opinions.ts`), read 100 at a time. `totalCount` would count
# records, which is why it is not read here: the profile's figures read
# it on purpose (`ProfileFigures`) and say records.
#
# INBOUND RECORDS ARE DISPLAY ONLY. Nothing read here reaches a feed —
# per the ranking model only viewer-rooted forward paths do.
query NodeOpinions($id: UUID!, $after: String) {
  node(id: $id) {
    id
    incomingRecords(family: OPINION, first: 100, after: $after) {
      edges {
        node {
          ...OpinionRecordFields
          # The person the row is about. Null where no account fronts
          # the address.
          author {
            ...OpinionPersonFields
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# `On them`: the Opinion records aimed at a person's profile — the same
# set the `Opinions on them` figure counts — one row per author.
query UserOpinionsOn($id: UUID!, $after: String) {
  user(id: $id) {
    id
    incomingRecords(family: OPINION, first: 100, after: $after) {
      edges {
        node {
          ...OpinionRecordFields
          author {
            ...OpinionPersonFields
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# `By them`: the Opinion records a person gave toward people — the same
# set the `Opinions by them` figure counts — one row per person they are
# about. The target is a `Node`; a person is the only kind `toKind:
# USER` admits.
query UserOpinionsBy($id: UUID!, $after: String) {
  user(id: $id) {
    id
    outgoingRecords(family: OPINION, toKind: USER, first: 100, after: $after) {
      edges {
        node {
          ...OpinionRecordFields
          target {
            __typename
            ... on User {
              ...OpinionPersonFields
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
