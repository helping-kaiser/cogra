# Session lifecycle: credentials in, rotating token pair out.
# Mirrors the Android operation set (android/core/network).

mutation LogIn($input: LogInInput!) {
  logIn(input: $input) {
    auth {
      accessToken
      refreshToken
      user {
        id
      }
    }
    reuseDetectedAt
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RefreshSession($input: RefreshSessionInput!) {
  refreshSession(input: $input) {
    auth {
      accessToken
      refreshToken
      user {
        id
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

query Sessions {
  me {
    id
    sessions {
      id
      deviceLabel
      isCurrent
    }
  }
}

mutation RevokeSession($input: RevokeSessionInput!) {
  revokeSession(input: $input) {
    session {
      id
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RevokeOtherSessions {
  revokeOtherSessions {
    revokedCount
    userErrors {
      ...UserErrorFields
    }
  }
}
