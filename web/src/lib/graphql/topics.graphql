# The topic surface (api-spec.md "Content authoring", hashtag.md): the
# topic page's own read, and the tag/un-tag gesture the edit screen
# stages. A stance toward a topic rides `viewerStance` on `Hashtag` —
# see `stance.graphql`'s `HashtagStance`, the same seam every other
# stance-able node uses — which no surface offers before slice 3.
#
# `hashtag(name:)` resolves any well-formed name (D4): a Type is
# anchored vacuously, so a topic nobody has tagged yet still renders —
# null answers only a substrate-illegal name. The shared selections
# live in `fragments.graphql`.

query HashtagDetail($name: String!, $includePending: Boolean! = true) {
  hashtag(name: $name) {
    id
    name {
      value
      status
    }
    moderationStatus
    taggedContent(includePending: $includePending) {
      relevance
      confidence
      pending
      node {
        __typename
        # The same card renders here, so it reads the same post the feed
        # reads — the video fields included, or the card would be handed
        # a post whose attachments cannot say whether they move.
        ... on Post {
          ...PostFields
          # The card wears the comments affordance wherever it is drawn, and
          # the count is asked for the same cost-free way the feed asks: no
          # edges, one aggregate.
          comments(first: 0, includePending: $includePending) {
            totalCount
          }
        }
        # A TAGGED COMMENT IS ONLY NAMED HERE; ITS CARD IS `TaggedComments`
        # BELOW. The list is a union, and the static price sums every branch
        # for every row although each row is one kind — so a post's card and
        # a comment's card in one document would charge the page's twenty
        # rows twice. Read apart, as the app reads them, each card is priced
        # once, for the rows that are its kind.
        ... on Comment {
          id
        }
      }
    }
  }
}

# The tag page's comment cards (TagPage.md: tagPage.commentCard leading with
# the thread it answers), over exactly the comment ids `HashtagDetail` named:
# the comment whole — its tags line and its references count, as the feed's
# comment card draws them, and the own comment's Edit starting from it —
# what it answers (the pointer's words), and its thread's post (where its
# doors land). Priced per id (`nodes`: `ids.len()` × the card), never for a
# row that is a post.
query TaggedComments($ids: [UUID!]!, $includePending: Boolean! = true) {
  nodes(ids: $ids) {
    __typename
    ... on Comment {
      ...CommentFields
      target {
        __typename
        ... on Post {
          id
          title {
            value
            status
          }
          content {
            value
            status
          }
          attachments {
            url
            status
            mimeType
            coverMedia {
              url
              status
            }
          }
          author {
            id
            handle
          }
          moderationStatus
          removal {
            at
            by
          }
        }
        ... on Comment {
          id
          content {
            value
            status
          }
          author {
            id
            handle
          }
          moderationStatus
          removal {
            at
            by
          }
        }
      }
      post {
        id
      }
    }
  }
}

# One standalone topic declaration on existing content (D6) — the
# gesture that adds a topic after creation, and, at `pDirected: 0`, the
# one that withdraws it (post.md §3; PrepareTagInput). Never rides the
# post/comment edit form (D14).
mutation PrepareTag($input: PrepareTagInput!) {
  prepareTag(input: $input) {
    writes {
      id
      family
      canonicalProposal
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The tag picker's index rows (TagPicker.jsx: "THE ROWS UNDER IT ARE THE
# INDEX'S"): the names in use that start with what was typed, through the
# one search matcher's topic cue — `#prefix` names every Hashtag whose name
# starts with it, the exact name leading (api-spec.md "Search", *Cues*).
# `kinds: [HASHTAG]` keeps the topic section alone: a bare cue would also
# list everything the matched topics reach, which a picker of names has no
# use for. No count rides a row — the picker draws none (§3).
query TagNames($query: String!, $first: Int) {
  search(query: $query, kinds: [HASHTAG], first: $first) {
    edges {
      node {
        __typename
        ... on Hashtag {
          id
          name {
            value
          }
        }
      }
    }
  }
}

# Your topics (YourTopics.dc.html; api-spec.md `User.heldTopics`): every
# topic the reader holds, strongest first by association, each row the
# topic's mark and name with the pair the reader signed and the pending
# marker while an act is in flight. The page size is a literal so the
# client-operation guard prices the call the client actually makes.
query HeldTopics($after: String, $includePending: Boolean! = true) {
  me {
    id
    heldTopics(first: 50, after: $after, includePending: $includePending) {
      totalCount
      edges {
        cursor
        pDirected
        pInterest
        pending
        node {
          id
          name {
            value
            status
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Explore's Your topics door (Explore.md: the second line counts the topics
# the reader holds, the length of the list it opens) — the count alone, no
# edges.
query HeldTopicsCount($includePending: Boolean! = true) {
  me {
    id
    heldTopics(first: 0, includePending: $includePending) {
      totalCount
    }
  }
}
