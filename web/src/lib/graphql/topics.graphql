# The topic surface (api-spec.md "Content authoring", hashtag.md): the
# topic page's own read, and the tag/un-tag gesture the edit screen
# stages. A stance toward a topic rides `viewerStance` on `Hashtag` —
# see `stance.graphql`'s `HashtagStance`, the same seam every other
# stance-able node uses — which no surface offers before slice 3.
#
# `hashtag(name:)` resolves any well-formed name (D4): a Type is
# anchored vacuously, so a topic nobody has tagged yet still renders —
# null answers only a substrate-illegal name. Field selections are
# inlined per the house style (content.graphql).

query HashtagDetail($name: String!, $includePending: Boolean! = true) {
  hashtag(name: $name) {
    id
    name {
      value
      status
    }
    moderationStatus
    taggedContent(includePending: $includePending) {
      relevance
      confidence
      pending
      node {
        __typename
        ... on Post {
          id
          title {
            value
            status
          }
          description {
            value
            status
          }
          content {
            value
            status
          }
          # The same card renders here, so it reads the same gallery.
          attachments {
            id
            url
            altText
            status
            options {
              aspectRatio
            }
          }
          attachmentsStatus
          author {
            id
            handle
            displayName {
              value
            }
            avatar {
              url
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          license {
            attribution
            provenance
          }
          topics(includePending: $includePending) {
            hashtag {
              id
              name {
                value
                status
              }
            }
            relevance
            confidence
            pending
          }
          # The reference row (D12, D16): the author's own current
          # citations only — the content-intrinsic channel, the one that
          # needs no forward-path weight. The target is typed so a chip
          # renders without a second read; it is null when CoGra carries
          # no display row for what the citation names.
          references(includePending: $includePending) {
            targetId
            relevance
            support
            withdrawalCost
            pending
            target {
              __typename
              ... on User {
                id
                handle
                displayName {
                  value
                }
              }
              ... on Post {
                id
                title {
                  value
                }
                content {
                  value
                }
                author {
                  handle
                }
              }
              # A referenced comment opens the post carrying it —
              # comment permalinks are a parked item — so the selection
              # walks up far enough to find one.
              ... on Comment {
                id
                content {
                  value
                }
                author {
                  handle
                }
                target {
                  __typename
                  ... on Post {
                    id
                  }
                  ... on Comment {
                    target {
                      __typename
                      ... on Post {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
        ... on Comment {
          id
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
            avatar {
              url
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          target {
            __typename
            ... on Post {
              id
            }
          }
        }
      }
    }
  }
}

# One standalone topic declaration on existing content (D6) — the
# gesture that adds a topic after creation, and, at `pDirected: 0`, the
# one that withdraws it (post.md §3; PrepareTagInput). Never rides the
# post/comment edit form (D14).
mutation PrepareTag($input: PrepareTagInput!) {
  prepareTag(input: $input) {
    writes {
      id
      family
      canonicalProposal
    }
    userErrors {
      message
      code
      field
    }
  }
}
