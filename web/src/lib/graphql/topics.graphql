# The topic surface (api-spec.md "Content authoring", hashtag.md): the
# topic page's own read, and the tag/un-tag gesture the edit screen
# stages. A stance toward a topic rides `viewerStance` on `Hashtag` —
# see `stance.graphql`'s `HashtagStance`, the same seam every other
# stance-able node uses — which no surface offers before slice 3.
#
# `hashtag(name:)` resolves any well-formed name (D4): a Type is
# anchored vacuously, so a topic nobody has tagged yet still renders —
# null answers only a substrate-illegal name. The shared selections
# live in `fragments.graphql`.

query HashtagDetail($name: String!, $includePending: Boolean! = true) {
  hashtag(name: $name) {
    id
    name {
      value
      status
    }
    moderationStatus
    taggedContent(includePending: $includePending) {
      relevance
      confidence
      pending
      node {
        __typename
        # The same card renders here, so it reads the same post the feed
        # reads — the video fields included, or the card would be handed
        # a post whose attachments cannot say whether they move.
        ... on Post {
          ...PostFields
          # The card wears the comments affordance wherever it is drawn, and
          # the count is asked for the same cost-free way the feed asks: no
          # edges, one aggregate.
          comments(first: 0, includePending: $includePending) {
            totalCount
          }
        }
        # A tagged comment draws a line, not a card: it opens the post
        # carrying it, so the selection stops at what that line needs.
        ... on Comment {
          id
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
            avatar {
              url
            }
          }
          createdAt
          updatedAt
          landing {
            state
          }
          moderationStatus
          target {
            __typename
            ... on Post {
              id
            }
          }
        }
      }
    }
  }
}

# One standalone topic declaration on existing content (D6) — the
# gesture that adds a topic after creation, and, at `pDirected: 0`, the
# one that withdraws it (post.md §3; PrepareTagInput). Never rides the
# post/comment edit form (D14).
mutation PrepareTag($input: PrepareTagInput!) {
  prepareTag(input: $input) {
    writes {
      id
      family
      canonicalProposal
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Your topics (YourTopics.dc.html; api-spec.md `User.heldTopics`): every
# topic the reader holds, strongest first by association, each row the
# topic's mark and name with the pair the reader signed and the pending
# marker while an act is in flight. The page size is a literal so the
# client-operation guard prices the call the client actually makes.
query HeldTopics($after: String, $includePending: Boolean! = true) {
  me {
    id
    heldTopics(first: 50, after: $after, includePending: $includePending) {
      totalCount
      edges {
        cursor
        pDirected
        pInterest
        pending
        node {
          id
          name {
            value
            status
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Explore's Your topics door (Explore.md: the second line counts the topics
# the reader holds, the length of the list it opens) — the count alone, no
# edges.
query HeldTopicsCount($includePending: Boolean! = true) {
  me {
    id
    heldTopics(first: 0, includePending: $includePending) {
      totalCount
    }
  }
}
