name: CI

# Workflow runs on every PR and push to main, regardless of which paths
# changed. The `changes` job detects whether any non-doc files were
# touched; the `lint` and `test` jobs are gated at the job level on that
# output and skip entirely on docs-only changes — services and all.
#
# GitHub treats a skipped job's check_run as a passing required status
# check, so branch protection accepts the skipped state. Workflow-level
# `paths-ignore` does NOT have this property: a path-skipped workflow
# posts no commit status at all and leaves required checks hanging
# forever, which is what blocked docs-only PRs before this structure.
#
# The `predicate-quantifier: 'every'` on the paths-filter step is
# load-bearing: with the default `some` quantifier the negation
# patterns are OR'd as alternative inclusions rather than subtracted,
# so the `'**'` line alone matches every file and the gate never
# fires. Do not remove it without replacing the filter shape.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (GitHub's hardening guide): checkout needs contents,
# paths-filter reads PR file lists via the API on pull_request events.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.frontends.outputs.android }}
      web: ${{ steps.frontends.outputs.web }}
      fixtures: ${{ steps.fixtures.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7
      # The Rust gate. `android/**` and `web/**` are subtracted alongside docs
      # so a frontend-only PR skips the Rust lint/test jobs; a schema.graphql
      # change is NOT excluded, so it still trips the Rust jobs (and, below,
      # the frontend ones) since all sides of the contract depend on it.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!android/**'
              - '!web/**'
      # The frontend gates. Default (OR) quantifier: any of these paths fires
      # them. Kept in their own step because the OR semantics are incompatible
      # with the `every` quantifier the Rust gate above depends on. Both
      # contract artifacts are listed for the same reason schema.graphql is:
      # the frontend golden-vector tests pin to client-crypto-vectors.json,
      # so a vector regeneration must run them, not just the Rust jobs.
      # `.github/workflows/**` is listed because these jobs' own setup steps
      # live there — an action bump must run them, or its green is vacuous.
      - uses: dorny/paths-filter@v4
        id: frontends
        with:
          filters: |
            android:
              - 'android/**'
              - 'schema.graphql'
              - 'client-crypto-vectors.json'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'schema.graphql'
              - 'client-crypto-vectors.json'
              - '.github/workflows/**'
      # The linter-fixture gate. cogra-linter's tests read these doc trees
      # as fixtures (registry_as_data pins their head census), so a change
      # to them must run the Rust test job even when the Rust gate above
      # subtracts it as markdown.
      - uses: dorny/paths-filter@v4
        id: fixtures
        with:
          filters: |
            fixtures:
              - 'crates/cogra-interchange/docs/**'
              - 'crates/cogra-linter/docs/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # No database here: the sqlx `query!` macros compile against the committed
    # `.sqlx/` metadata. A query changed without re-running `cargo sqlx prepare`
    # fails the build with "no cached data for this query" — the staleness
    # tripwire for query-vs-cache drift.
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gnp
          POSTGRES_PASSWORD: gnp_secret
          POSTGRES_DB: gnp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gnp:gnp_secret@localhost:5432/gnp_db
      RUST_LOG: debug
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - name: Run migrations
        run: sqlx migrate run --source migrations
      # Recompiles every query! against the freshly-migrated live schema and
      # asserts the committed .sqlx/ matches. Catches the drift the offline
      # lint job can't: a migration that changed a column under an unchanged
      # query string.
      - name: Check .sqlx metadata is current
        run: cargo sqlx prepare --workspace --check
      - name: Run tests
        run: cargo test --all
      # Redundant with the api schema_drift test on purpose: a named CI
      # step makes contract drift readable from the checks list alone.
      - name: Check schema.graphql drift
        run: |
          cargo run -p api --bin export-schema > schema.graphql
          git diff --exit-code schema.graphql
      # Same rationale for the other cross-platform contract artifact: the
      # test already ran under `cargo test --all`; the named step makes
      # client-crypto drift readable from the checks list alone.
      - name: Check client-crypto-vectors.json drift
        run: cargo test -p common --test client_vectors

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # Driven by the committed Gradle wrapper so CI and local builds resolve the
    # same Gradle. Apollo codegen, Hilt/KSP processing, and the unit tests all
    # run as part of these tasks.
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Both toolchains: 17 compiles the app, 21 launches the tests
          # (Robolectric's API 36 sandbox requires it). Gradle picks each
          # by language version, so the order here does not matter.
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew test
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Codegen runs against the committed schema.graphql, so contract drift
    # fails this job as a TypeScript compile error in `build`.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate GraphQL types
        run: npm run codegen
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
