<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px}.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.lbl{font-size:var(--text-label-small);color:var(--text-secondary)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { MoneyFigure, CgtMark, HelpDot, Card } = window.CoGraDesignSystem_9084ba;
function Row({ words, amount, signed }){return (
  <div style={{display:"flex",justifyContent:"space-between",gap:16,width:260,fontSize:"var(--text-body-medium)"}}>
    <span style={{color:"var(--text-secondary)"}}>{words}</span>
    <MoneyFigure amount={amount} signed={signed} />
  </div>
)}
function Demo(){return (
<div className="grid">
  <div className="col">
    <span className="lbl">The mark — 1em, scales with its text</span>
    <div style={{display:"flex",gap:16,alignItems:"baseline"}}>
      <span style={{fontSize:14}}><CgtMark /></span>
      <span style={{fontSize:20}}><CgtMark /></span>
      <span style={{fontSize:32}}><CgtMark /></span>
    </div>
    <span className="lbl">The figure — rest, large, dust, zero</span>
    <div className="col" style={{fontSize:"var(--text-body-medium)",gap:4}}>
      <MoneyFigure amount={15.2} />
      <MoneyFigure amount={12500} />
      <MoneyFigure amount={0.0003} />
      <MoneyFigure amount={0} />
    </div>
  </div>
  <div className="col">
    <span className="lbl">History lines — direction is the sign and the words, never a colour</span>
    <Row words="Payout · campaign settled" amount={12.4} signed />
    <Row words="Tip to @ada" amount={-2} signed />
    <Row words="Payout · campaign settled" amount={0.0003} signed />
  </div>
  <div className="col" style={{width:300}}>
    <span className="lbl">The balance headline — the one surface that spells the word</span>
    <Card>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <span style={{fontSize:"var(--text-label-medium)",color:"var(--text-secondary)"}}>Your balance</span>
          <span style={{fontSize:"var(--text-headline-small)",lineHeight:"var(--text-headline-small--line-height)",fontWeight:"var(--text-headline-small--font-weight)"}}><MoneyFigure amount={128.4} unit /></span>
        </div>
        <HelpDot ariaLabel="What is CGT?" />
      </div>
    </Card>
  </div>
</div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
