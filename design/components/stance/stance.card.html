<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<!-- The pad parks with `position:fixed`, which is the master's own rule. A
     `transform` on the host makes that host the containing block, so the
     specimen can park the real pad inside its column instead of redrawing it. -->
<style>body{margin:0;padding:16px;background:var(--surface)}.lbl{font-size:var(--text-label-small);color:var(--text-secondary)}.grid{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}.col{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.park{position:relative;transform:translateZ(0);width:100%;height:610px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.CoGraDesignSystem_9084ba;
const { StanceControl, StanceCoachMark } = NS;
const standing={current:{pDirected:0.55,pInterest:0.2},rawSum:{pDirected:0.55,pInterest:0.2},records:2,severed:false,severance:{records:2}};
function Demo(){
  return (
  <div className="grid">
    <div className="col">
      <span className="lbl">At rest — no opinion yet</span>
      <StanceControl targetLabel="this post" taught/>
      <span className="lbl">At rest — with an opinion</span>
      <StanceControl targetLabel="this post" bundle={standing} taught/>
      <span className="lbl">The coach mark — it rides the first open, and what it teaches is the hold</span>
      <StanceCoachMark/>
    </div>
    <div className="col">
      <span className="lbl">The bloomed pad — the master's own open state</span>
      <div className="park">
        <StanceControl targetLabel="this post" bundle={standing} defaultPick={{pDirected:0.4,pInterest:0.2}} defaultOpen taught/>
      </div>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
