<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px}.col{display:flex;flex-direction:column;gap:14px;max-width:420px}.lbl{font-size:var(--text-label-small);color:var(--text-secondary)}.bar{border-radius:var(--radius-medium);overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { PageHeader, BottomNav, Icon, Button, SegmentedFilter, BorrowedViewBand, ALL_SLOTS } = window.CoGraDesignSystem_9084ba;
const link = {color:"var(--primary)",fontSize:"var(--text-label-large)",textDecoration:"none"};
function Demo(){
  const [active,setActive]=React.useState("feed");
  const [view,setView]=React.useState("ranked");
  return (
  <div className="col">
    <span className="lbl">Tab root — no back arrow</span>
    <PageHeader title="Feed"/>
    <span className="lbl">Drill-in with a trailing action</span>

    <span className="lbl">Segmented filter — two to four alternatives where exactly one is true, in equal segments. The feed's real filter is a sheet: see "What your feed shows"</span>
    <SegmentedFilter ariaLabel="Order" value={view} onChange={setView} options={[{value:"ranked",label:"Ranked"},{value:"newest",label:"Newest"}]}/>
    <span className="lbl">Borrowed-view band — a guest feed is ranked from a borrowed vantage point, and the band always names it</span>
    <BorrowedViewBand handle="mira" displayName="Mira Halvorsen" actionLabel="Sign in or join"/>
    <span className="lbl">The applicant reading — same vantage, no join entry</span>
    <BorrowedViewBand handle="mira" line="Browsing from @mira's view while your application lands."/>
    <span className="lbl">Bottom bar — what ships today: feed, the compose action, profile</span>
    <div className="bar"><BottomNav inline active={active} onSelect={setActive}/></div>
    <span className="lbl">Bottom bar — all five slots, once Explore and Wallet have surfaces</span>

    <div style={{display:"flex",gap:16,color:"var(--text-secondary)"}}>
      <Icon name="dynamic_feed"/><Icon name="person"/><Icon name="person_outline"/><Icon name="add"/><Icon name="search"/><Icon name="wallet"/><Icon name="settings"/><Icon name="visibility"/><Icon name="visibility_off"/><Icon name="arrow_back"/><Icon name="more_vert"/><Icon name="chat_bubble"/><Icon name="volume_up"/><Icon name="volume_off"/><Icon name="check"/><Icon name="graph"/>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
