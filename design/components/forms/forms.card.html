<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px}.grid{display:grid;grid-template-columns:300px 320px;gap:24px;align-items:start}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:var(--text-label-small);color:var(--text-secondary)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TextField, PasswordField, Checkbox, LicenseChooser, LicenseTerms, RecoveryCode, Card } = window.CoGraDesignSystem_9084ba;
function Demo(){
  const [email,setEmail]=React.useState("ada@example.org");
  const [pw,setPw]=React.useState("hunter2hunter2");
  const [forget,setForget]=React.useState(false);
  const [body,setBody]=React.useState("Walked the long way home and the whole street smelled of rain.");
  const [license,setLicense]=React.useState({attribution:0.5,provenance:0});
  return (
  <div className="grid">
    <div className="col">
      <TextField label="Email" type="email" value={email} onChange={setEmail}/>
      <TextField label="Handle" value="a" onChange={()=>{}} error="3–30 characters: a–z, 0–9, _"/>
      <PasswordField label="Password" value={pw} onChange={setPw}/>
      <Checkbox label="Don't remember this account on this device" checked={forget} onChange={setForget}/>
      <TextField label="What do you want to publish?" rows={3} value={body} onChange={setBody}/>
    </div>
    <div className="col">
      <LicenseChooser value={license} onChange={setLicense}/>
      <span className="lbl">On the read surface</span>
      <LicenseTerms license={license}/>
      <span className="lbl">Recovery code, inside a card</span>
      <Card>
        <RecoveryCode code="7Q3ZD-XK9P2-M4TVE-0RH8N-1WYB6C" explainer="This is the only way to restore your key. We can't show it again."/>
      </Card>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
