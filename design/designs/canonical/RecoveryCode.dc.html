<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --secondary-container: #feaa81; --on-secondary-container: #783c1c;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --surface-container: #ffeae1; --surface-container-high: #fbe3d9; --surface-container-highest: #f5ded4;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --secondary-container: #743918; --on-secondary-container: #f8a57b;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --surface-container: #221f1e; --surface-container-high: #2c2928; --surface-container-highest: #373433;
      --outline: #968f8d; --outline-variant: #4b4644;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary); }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--on-surface); overflow: hidden; box-sizing: border-box;">

  <div style="min-height: 48px; flex: none;"></div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 8px 24px 32px 24px; overflow: hidden;">

    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400;">Your recovery code</h1>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 12px; background: var(--surface-container-highest); padding: 16px;">
      <p style="margin: 0; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; line-height: 24px; letter-spacing: 0.05em;">7Q3ZD-XK9P2-M4TVE-0RH8N-1WYB6C</p>
      <p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-surface-variant);">This is the only way to restore your key. It is shown once and never stored — keep it offline, written down, somewhere safe.</p>
      <span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 32px; padding: 6px 12px; border-radius: 9999px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Copy</span>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Type or paste the code to confirm</label>
        <div style="display: flex; align-items: center; height: 40px; border: 1px solid var(--outline); border-radius: 4px; background: transparent; padding: 8px 12px; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 20px;">7Q3ZD-XK9P2-M4TVE-0RH8N-1WYB6C</div>
      </div>
      <span style="align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 6px 12px; border-radius: 9999px; background: var(--primary); color: var(--on-primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">I've written it down</span>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.media = window.matchMedia("(prefers-color-scheme: dark)");
    this.onScheme = () => this.forceUpdate();
    this.media.addEventListener("change", this.onScheme);
    this.onMsg = (event) => {
      const d = event.data;
      if (d && (d.cograTheme === "light" || d.cograTheme === "dark" || d.cograTheme === "auto")) {
        if (!this.state || this.state.remote !== d.cograTheme) this.setState({ remote: d.cograTheme });
      } else if (d && d.cograThemeQuery && this.state && this.state.remote && event.source) {
        try { event.source.postMessage({ cograTheme: this.state.remote }, "*"); } catch (e) {}
      }
    };
    window.addEventListener("message", this.onMsg);
    try {
      const askWalk = (w, depth) => {
        if (depth > 5) return;
        let n = 0;
        try { n = w.length; } catch (e) { n = 0; }
        for (let i = 0; i < n; i++) {
          let c = null;
          try { c = w[i]; } catch (e) { c = null; }
          if (c) {
            try { c.postMessage({ cograThemeQuery: true }, "*"); } catch (e) {}
            askWalk(c, depth + 1);
          }
        }
      };
      askWalk(window.top, 0);
    } catch (e) {}
  }
  componentDidUpdate(prevProps) {
    if (prevProps.theme !== this.props.theme && this.state && this.state.remote) {
      this.setState({ remote: null });
    }
  }
  componentWillUnmount() {
    if (this.media) this.media.removeEventListener("change", this.onScheme);
    window.removeEventListener("message", this.onMsg);
  }
  renderVals() {
    const remote = this.state ? this.state.remote : null;
    const mode = remote ?? this.props.theme ?? "auto";
    const dark = mode === "auto"
      ? window.matchMedia("(prefers-color-scheme: dark)").matches
      : mode === "dark";
    return { theme: dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
