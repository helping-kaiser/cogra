<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --secondary-container: #feaa81; --on-secondary-container: #783c1c;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --surface-container: #ffeae1; --surface-container-high: #fbe3d9; --surface-container-highest: #f5ded4;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      --tile-a: #e8d5c8; --tile-b: #d9c2b0; --tile-c: #cbb39e; --tile-d: #bfa38c;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --secondary-container: #743918; --on-secondary-container: #f8a57b;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --surface-container: #221f1e; --surface-container-high: #2c2928; --surface-container-highest: #373433;
      --outline: #968f8d; --outline-variant: #4b4644;
      --tile-a: #3a332e; --tile-b: #453c35; --tile-c: #50453c; --tile-d: #5b4e43;
    }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--on-surface); overflow: hidden; box-sizing: border-box;">

  <div style="min-height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 12px; flex: none;">
    <span style="height: 48px; width: 48px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; color: var(--on-surface-variant);"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg></span>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400;">New post</h1>
    <span style="flex: 1;"></span>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 8px; margin: 8px 24px; border-radius: 12px; background: var(--surface-container-highest); padding: 16px;">
    <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px;">Your draft is here</h2>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex: none;"><img src="post-photo.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
      <span style="flex: 1; display: flex; flex-direction: column;">
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px;">Salt maps of the coast road</span>
        <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-surface-variant);">2 pictures — kept on this device</span>
      </span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 40px; padding: 10px 24px; min-width: 64px; border-radius: 9999px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Discard</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 40px; padding: 10px 24px; min-width: 64px; border-radius: 9999px; background: var(--primary); color: var(--on-primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Continue</span>
    </div>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 24px;">
    <p style="margin: 0; flex: 1; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-surface-variant);">Or start fresh — pick one picture, several, or one video.</p>
  </div>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 4px 0 4px; overflow: hidden; align-content: flex-start; opacity: 0.55;">
    <div style="position: relative; width: 125px; height: 125px; overflow: hidden;"><img src="post-photo.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
    <div style="position: relative; width: 125px; height: 125px; overflow: hidden;"><img src="inviter.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-a);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-b);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-c);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-d);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-b);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-d);"></div>
    <div style="width: 125px; height: 125px; background: var(--tile-a);"></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.media = window.matchMedia("(prefers-color-scheme: dark)");
    this.onScheme = () => this.forceUpdate();
    this.media.addEventListener("change", this.onScheme);
    this.onMsg = (event) => {
      const d = event.data;
      if (d && (d.cograTheme === "light" || d.cograTheme === "dark" || d.cograTheme === "auto")) {
        if (!this.state || this.state.remote !== d.cograTheme) this.setState({ remote: d.cograTheme });
      } else if (d && d.cograThemeQuery && this.state && this.state.remote && event.source) {
        try { event.source.postMessage({ cograTheme: this.state.remote }, "*"); } catch (e) {}
      }
    };
    window.addEventListener("message", this.onMsg);
    try {
      const askWalk = (w, depth) => {
        if (depth > 5) return;
        let n = 0;
        try { n = w.length; } catch (e) { n = 0; }
        for (let i = 0; i < n; i++) {
          let c = null;
          try { c = w[i]; } catch (e) { c = null; }
          if (c) {
            try { c.postMessage({ cograThemeQuery: true }, "*"); } catch (e) {}
            askWalk(c, depth + 1);
          }
        }
      };
      askWalk(window.top, 0);
    } catch (e) {}
  }
  componentDidUpdate(prevProps) {
    if (prevProps.theme !== this.props.theme && this.state && this.state.remote) {
      this.setState({ remote: null });
    }
  }
  componentWillUnmount() {
    if (this.media) this.media.removeEventListener("change", this.onScheme);
    window.removeEventListener("message", this.onMsg);
  }
  renderVals() {
    const remote = this.state ? this.state.remote : null;
    const mode = remote ?? this.props.theme ?? "auto";
    const dark = mode === "auto"
      ? window.matchMedia("(prefers-color-scheme: dark)").matches
      : mode === "dark";
    return { theme: dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
