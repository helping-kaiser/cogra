<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --outline: #968f8d; --outline-variant: #4b4644;
    }
    a { color: var(--primary); }
    a:hover { color: var(--primary); }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 300px; height: 180px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); color: var(--on-surface); padding: 20px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--outline-variant);">
  <span style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Canvas theme</span>
  <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-surface-variant);">One tap themes every screen on the canvas. Auto follows your system setting.</span>
  <div style="display: flex; gap: 8px;">
    <button onClick="{{setLight}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border-radius: 9999px; border: 1px solid var(--outline); background: {{lightBg}}; color: {{lightFg}}; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer;">Light</button>
    <button onClick="{{setDark}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border-radius: 9999px; border: 1px solid var(--outline); background: {{darkBg}}; color: {{darkFg}}; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer;">Dark</button>
    <button onClick="{{setAuto}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border-radius: 9999px; border: 1px solid var(--outline); background: {{autoBg}}; color: {{autoFg}}; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer;">Auto</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":300,"height":180}}'>
class Component extends DCLogic {
  broadcast(mode) {
    const walk = (w, depth) => {
      if (depth > 5) return;
      let n = 0;
      try { n = w.length; } catch (e) { n = 0; }
      for (let i = 0; i < n; i++) {
        let child = null;
        try { child = w[i]; } catch (e) { child = null; }
        if (child) {
          try { child.postMessage({ cograTheme: mode }, "*"); } catch (e) {}
          walk(child, depth + 1);
        }
      }
    };
    try { walk(window.top, 0); } catch (e) {}
    try { window.postMessage({ cograTheme: mode }, "*"); } catch (e) {}
    this.setState({ mode });
  }
  componentDidMount() {
    this.media = window.matchMedia("(prefers-color-scheme: dark)");
    this.onScheme = () => this.forceUpdate();
    this.media.addEventListener("change", this.onScheme);
    this.onMsg = (event) => {
      const d = event.data;
      if (d && (d.cograTheme === "light" || d.cograTheme === "dark" || d.cograTheme === "auto")) {
        if (!this.state || this.state.mode !== d.cograTheme) this.setState({ mode: d.cograTheme });
      } else if (d && d.cograThemeQuery && this.state && this.state.mode && event.source && event.source !== window) {
        try { event.source.postMessage({ cograTheme: this.state.mode }, "*"); } catch (e) {}
      }
    };
    window.addEventListener("message", this.onMsg);
    try {
      const askWalk = (w, depth) => {
        if (depth > 5) return;
        let n = 0;
        try { n = w.length; } catch (e) { n = 0; }
        for (let i = 0; i < n; i++) {
          let c = null;
          try { c = w[i]; } catch (e) { c = null; }
          if (c) {
            try { c.postMessage({ cograThemeQuery: true }, "*"); } catch (e) {}
            askWalk(c, depth + 1);
          }
        }
      };
      askWalk(window.top, 0);
    } catch (e) {}
  }
  componentWillUnmount() {
    this.media.removeEventListener("change", this.onScheme);
    window.removeEventListener("message", this.onMsg);
  }
  renderVals() {
    const mode = (this.state && this.state.mode) || "auto";
    const dark = mode === "auto"
      ? window.matchMedia("(prefers-color-scheme: dark)").matches
      : mode === "dark";
    const on = (m) => mode === m;
    return {
      theme: dark ? "dark" : "light",
      setLight: () => this.broadcast("light"),
      setDark: () => this.broadcast("dark"),
      setAuto: () => this.broadcast("auto"),
      lightBg: on("light") ? "var(--primary)" : "transparent",
      lightFg: on("light") ? "var(--on-primary)" : "var(--primary)",
      darkBg: on("dark") ? "var(--primary)" : "transparent",
      darkFg: on("dark") ? "var(--on-primary)" : "var(--primary)",
      autoBg: on("auto") ? "var(--primary)" : "transparent",
      autoFg: on("auto") ? "var(--on-primary)" : "var(--primary)",
    };
  }
}
</script>
</body>
</html>
