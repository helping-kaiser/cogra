<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --secondary-container: #feaa81; --on-secondary-container: #783c1c;
      --tertiary-container: #b7af26; --on-tertiary-container: #454100;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --surface-container: #ffeae1; --surface-container-high: #fbe3d9; --surface-container-highest: #f5ded4;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --secondary-container: #743918; --on-secondary-container: #f8a57b;
      --tertiary-container: #b7af26; --on-tertiary-container: #454100;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --surface-container: #221f1e; --surface-container-high: #2c2928; --surface-container-highest: #373433;
      --outline: #968f8d; --outline-variant: #4b4644;
    }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--on-surface); overflow: hidden; box-sizing: border-box;">

  <div style="min-height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 12px; flex: none;">
    <span style="height: 48px; width: 48px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; color: var(--on-surface-variant);"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg></span>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400;">New post</h1>
    <span style="flex: 1;"></span>
    <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-surface-variant);">Step 1 of 3</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px 24px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <label style="flex: 1; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Title</label>
        <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-surface-variant);">Optional</span>
      </div>
      <div style="min-height: 44px; display: flex; align-items: center; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--outline); font-size: 16px; line-height: 24px; letter-spacing: 0.5px; box-sizing: border-box;">Salt maps of the coast road<span style="display: inline-block; width: 2px; height: 20px; background: var(--primary); margin-left: 1px;"></span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">What is the body?</label>
      <div style="display: flex; flex-direction: column; gap: 12px; border-radius: 12px; background: var(--surface-container-highest); padding: 20px 16px; align-items: flex-start;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="var(--primary)" aria-hidden="true"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"></path></svg>
        <span style="font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px;">Words</span>
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-surface-variant);">The post is what you write.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; border-radius: 12px; background: var(--surface-container-highest); padding: 20px 16px; align-items: flex-start;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="var(--primary)" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"></path></svg>
        <span style="font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px;">Pictures or video</span>
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-surface-variant);">One picture, a set of them, or one video — the post is what you show.</span>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-surface-variant);">A post is one or the other, never both. A description can carry words beside the pictures.</p>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 16px; border-radius: 9999px; background: var(--primary); color: var(--on-primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; opacity: 0.4;">Next</div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.media = window.matchMedia("(prefers-color-scheme: dark)");
    this.onScheme = () => this.forceUpdate();
    this.media.addEventListener("change", this.onScheme);
    this.onMsg = (event) => {
      const d = event.data;
      if (d && (d.cograTheme === "light" || d.cograTheme === "dark" || d.cograTheme === "auto")) {
        if (!this.state || this.state.remote !== d.cograTheme) this.setState({ remote: d.cograTheme });
      } else if (d && d.cograThemeQuery && this.state && this.state.remote && event.source) {
        try { event.source.postMessage({ cograTheme: this.state.remote }, "*"); } catch (e) {}
      }
    };
    window.addEventListener("message", this.onMsg);
    try {
      const askWalk = (w, depth) => {
        if (depth > 5) return;
        let n = 0;
        try { n = w.length; } catch (e) { n = 0; }
        for (let i = 0; i < n; i++) {
          let c = null;
          try { c = w[i]; } catch (e) { c = null; }
          if (c) {
            try { c.postMessage({ cograThemeQuery: true }, "*"); } catch (e) {}
            askWalk(c, depth + 1);
          }
        }
      };
      askWalk(window.top, 0);
    } catch (e) {}
  }
  componentDidUpdate(prevProps) {
    if (prevProps.theme !== this.props.theme && this.state && this.state.remote) {
      this.setState({ remote: null });
    }
  }
  componentWillUnmount() {
    if (this.media) this.media.removeEventListener("change", this.onScheme);
    window.removeEventListener("message", this.onMsg);
  }
  renderVals() {
    const remote = this.state ? this.state.remote : null;
    const mode = remote ?? this.props.theme ?? "auto";
    const dark = mode === "auto"
      ? window.matchMedia("(prefers-color-scheme: dark)").matches
      : mode === "dark";
    return { theme: dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
