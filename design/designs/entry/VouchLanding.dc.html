<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --secondary-container: #feaa81; --on-secondary-container: #783c1c;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --surface-container: #ffeae1; --surface-container-high: #fbe3d9; --surface-container-highest: #f5ded4;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --secondary-container: #743918; --on-secondary-container: #f8a57b;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --surface-container: #221f1e; --surface-container-high: #2c2928; --surface-container-highest: #373433;
      --outline: #968f8d; --outline-variant: #4b4644;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary); }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; align-items: center; background: var(--surface); color: var(--on-surface); overflow: hidden; padding: 0 24px; box-sizing: border-box;">

  <div style="height: 96px; flex: none;"></div>

  <svg viewBox="0 0 100 100" width="88" height="88" aria-hidden="true"><circle cx="50.00" cy="38.35" r="22.52" fill="none" stroke="var(--primary)" stroke-width="15.66"></circle><path d="M72.520 17.220 L72.520 62.560 C72.450 63.280 72.340 65.460 72.090 66.870 C71.830 68.290 71.480 69.710 70.980 71.050 C70.470 72.390 69.830 73.720 69.060 74.920 C68.280 76.130 67.360 77.280 66.330 78.270 C65.300 79.270 64.110 80.150 62.880 80.890 C61.660 81.620 60.310 82.210 58.950 82.690 C57.600 83.170 56.180 83.500 54.760 83.740 C53.340 83.980 51.890 84.080 50.450 84.140 C49.010 84.200 47.560 84.170 46.120 84.090 C44.680 84.020 42.520 83.760 41.810 83.690" fill="none" stroke="var(--primary)" stroke-width="15.66" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="53.53" cy="34.82" r="8.52" fill="var(--primary-container)"></circle></svg>

  <span style="margin-top: 12px; font-size: 32px; line-height: 40px; font-weight: 700;">cogra</span>

  <div style="margin-top: 48px; display: flex; align-items: center; gap: 8px;">
    <img src="ava1.jpg" alt="" style="width: 48px; height: 48px; border-radius: 9999px; object-fit: cover;">
    <span style="width: 48px; height: 48px; border-radius: 9999px; background: var(--secondary-container); color: var(--on-secondary-container); display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 24px; font-weight: 500;">A</span>
    <img src="inviter.jpg" alt="" style="width: 48px; height: 48px; border-radius: 9999px; object-fit: cover;">
    <span style="width: 48px; height: 48px; border-radius: 9999px; background: var(--secondary-container); color: var(--on-secondary-container); display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 24px; font-weight: 500;">T</span>
    <img src="ava2.jpg" alt="" style="width: 48px; height: 48px; border-radius: 9999px; object-fit: cover;">
  </div>

  <h1 style="margin: 32px 0 0 0; font-size: 28px; line-height: 36px; font-weight: 400; text-align: center;">Built on real relationships</h1>

  <p style="margin: 12px 0 0 0; max-width: 310px; font-size: 16px; line-height: 24px; letter-spacing: 0.5px; color: var(--on-surface-variant); text-align: center;">What reaches you comes through people you trust — never from an algorithm. Members vouch for new members, one at a time.</p>

  <div style="flex: 1;"></div>

  <div style="align-self: stretch; display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px;">
    <div style="display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 16px; border-radius: 9999px; background: var(--primary); color: var(--on-primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Enter your invite</div>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 16px; border-radius: 9999px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Sign in</div>
    <p style="margin: 8px 0 0 0; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; text-align: center;"><a href="#">Just looking? Browse the feed &#8594;</a></p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
