<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&amp;display=swap">
  <style>
    body { margin: 0; }
    .screen {
      --primary: #9f4100; --on-primary: #ffffff;
      --primary-container: #ef6c1a; --on-primary-container: #4f1d00;
      --secondary-container: #feaa81; --on-secondary-container: #783c1c;
      --surface: #fff8f6; --on-surface: #251913; --on-surface-variant: #584237;
      --surface-container: #ffeae1; --surface-container-high: #fbe3d9; --surface-container-highest: #f5ded4;
      --outline: #8c7165; --outline-variant: #e0c0b2;
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }
    .screen[data-theme="dark"] {
      --primary: #ff8d50; --on-primary: #341100;
      --secondary-container: #743918; --on-secondary-container: #f8a57b;
      --surface: #151312; --on-surface: #e8e1df; --on-surface-variant: #cdc5c2;
      --surface-container: #221f1e; --surface-container-high: #2c2928; --surface-container-highest: #373433;
      --outline: #968f8d; --outline-variant: #4b4644;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary); }
  </style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--on-surface); overflow: hidden; position: relative;">

  <div style="display: flex; flex-direction: column;">
    <div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 24px;">
      <svg viewBox="0 0 100 100" width="24" height="24" aria-hidden="true"><circle cx="50.00" cy="38.35" r="22.52" fill="none" stroke="var(--primary)" stroke-width="15.66"></circle><path d="M72.520 17.220 L72.520 62.560 C72.450 63.280 72.340 65.460 72.090 66.870 C71.830 68.290 71.480 69.710 70.980 71.050 C70.470 72.390 69.830 73.720 69.060 74.920 C68.280 76.130 67.360 77.280 66.330 78.270 C65.300 79.270 64.110 80.150 62.880 80.890 C61.660 81.620 60.310 82.210 58.950 82.690 C57.600 83.170 56.180 83.500 54.760 83.740 C53.340 83.980 51.890 84.080 50.450 84.140 C49.010 84.200 47.560 84.170 46.120 84.090 C44.680 84.020 42.520 83.760 41.810 83.690" fill="none" stroke="var(--primary)" stroke-width="15.66" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="53.53" cy="34.82" r="8.52" fill="var(--primary-container)"></circle></svg>
      <span style="font-size: 22px; line-height: 28px; font-weight: 600;">cogra</span>
    </div>
    <div style="margin: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 12px; background: var(--surface-container-highest); padding: 16px;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 24px;">
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: var(--secondary-container); color: var(--on-secondary-container); display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 16px; font-weight: 500; flex: none;">A</span>
        <span style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Ada Okonkwo</span>
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; color: var(--on-surface-variant);">@ada</span>
      </div>
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px;">The long way home</h2>
      <div style="margin: 0 -16px;">
        <img src="post-photo.jpg" alt="" style="display: block; width: 100%; height: 192px; object-fit: cover;">
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-surface-variant);">Took the coast road instead of the tunnel. Four hours longer, worth every minute.</p>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: var(--surface-container-high); padding: 12px 24px 24px 24px; display: flex; flex-direction: column; gap: 16px;">
    <span style="align-self: center; height: 4px; width: 32px; border-radius: 9999px; background: var(--outline-variant); flex: none;"></span>
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400;">Sign in to CoGra</h1>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Email</label>
      <div style="height: 40px; border: 1px solid var(--outline); border-radius: 4px; background: transparent;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Password</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="flex: 1; height: 40px; border: 1px solid var(--outline); border-radius: 4px; background: transparent;"></div>
        <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); flex: none;"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path></svg></span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px;">
      <span style="width: 18px; height: 18px; border: 1px solid var(--outline); border-radius: 4px; flex: none;"></span>
      <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px;">Don't remember this account on this device</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 16px; border-radius: 9999px; background: var(--primary); color: var(--on-primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Sign in</div>
    <div style="display: flex; flex-direction: column;">
      <span style="display: flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Forgot password?</span>
      <span style="display: flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">New here? Enter your invite</span>
      <span style="display: flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px;">Keep browsing</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
