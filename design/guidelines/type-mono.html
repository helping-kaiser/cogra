<!-- @dsCard group="Type" viewport="700x150" name="The monospace exception" subtitle="The platform monospace, on codes and identifiers only. It is never UI chrome." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface)}.code{font-family:var(--font-mono);font-size:var(--text-title-large);letter-spacing:0.05em;text-align:center}.note{font-size:12px;color:var(--text-secondary);margin-top:8px}</style>
</head><body><p class="code">K7QF-2M9X-4TVB-8RJD</p><p class="note">title-large, wider tracking, centred — a recovery code is the biggest thing on its surface, because it is transcribed by hand. 0/O and l/1 must separate. Nothing else in the product is monospace.</p></body></html>
