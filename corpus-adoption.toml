#   tree also holds kickoff.md and adoption-notes.md, which write
#   every label-shaped reference in displayed double backticks and so
#   participate in nothing; including them costs nothing and keeps the
#   prefix one line instead of seven.
# crates/cogra-interchange/docs/ — that crate's phase artifacts, whose
#   concept and design are written under the discipline and whose
#   audit and commissioning notes join them.
# docs/ — the four doc-tree owners at once, since one prefix covers
#   what four would and the partition's own rules decide ownership
#   below it. R20 left the trees carrying no occurrence: every
