####################################################################
# cogra corpus linter — ADOPTION DATA
#
# This file instantiates, for THIS repository, the seven data the
# label calculus is parametric in, plus this corpus's own additions,
# exactly as ARCH sig:linter:adoption-data specifies:
#
#   Sigma  the prefix Signature ............... [signature]
#   Omega  the owner partition ................ [partition]
#   Pi     the profile signature .............. [profiles]
#   K      the reserved kinds ................. [reserved-kinds]
#          designated typed-data classes ...... [typed-data]
#          citation-index designations ........ [citation-indexes]
#          scanned-region recognition ......... [scanned-regions]
#   plus   banned-token sets .................. [banned-tokens]
#          the carrier's exclusions ........... [carrier]
#          the kind registry's adoption ....... [kinds]
#          head recognition per format ........ [head-recognition]
#          the enforcement partition .......... [enforcement]
#
# Conventions in this file:
#   * References to discipline labels are written PLAIN (no backticks,
#     no acutes, no parentheses) so that this file can never be read
#     as carrying label occurrences, whatever frontend later sees it.
#     Read "LBL sig:labels:owners" as "the Signature environment of
#     the label calculus".
#   * Path prefixes are LITERAL, never patterns — ARCH
#     sig:linter:adoption-data, honoring ARCH dec:linter:no-regex
#     even in configuration. A prefix ending in "/" matches a tree;
#     a prefix naming a file matches that file.
#   * Every value here is a recorded decision. Where a value carries a
#     cost or a consequence, its section states it; the reasoning,
#     the findings behind it, and the measurements that fixed it live
#     in crates/cogra-linter/docs/adoption-notes.md.
####################################################################

[meta]
drafted          = "2026-08-20"
ruled            = "2026-08-21"
status           = "ruled — every value in this file is a recorded decision"
rationale        = "crates/cogra-linter/docs/adoption-notes.md"
corpus_root      = "."          # repository root
discipline_docs  = [
  "crates/cogra-linter/docs/label-calculus.md",
  "crates/cogra-linter/docs/environment-kinds.md",
  "crates/cogra-linter/docs/identity-adjudication.md",
  "crates/cogra-linter/docs/interchange-conventions.md",
]


####################################################################
# [carrier] — what the corpus IS
#
# RULED 2026-08-21.
#
# Not one of the seven parameters by name, but LBL judg:labels:minting
# fixes the carrier ("every committed prose and code source of the
# corpus, authored and generated alike, excluding version-control
# internals, build and dependency directories, archived and vendored
# trees, and uncommitted generated artifacts") and Omega must be TOTAL
# on it. A partition cannot be checked total against an unstated
# domain, so the carrier's exclusions are adoption data and live here:
# "this corpus's own additions" of ARCH sig:linter:adoption-data is an
# open list, and stating the exclusions in their own section keeps
# them out of Omega, where they could only appear as owner-less rules.
####################################################################

[carrier]

# Version-control internals, build outputs, dependency trees.
exclude_trees = [
  ".git/",
  "target/",                    # cargo, workspace-level
  "android/build/",
  "android/app/build/",
  "android/.gradle/",
  "android/gradle/wrapper/",    # vendored wrapper jar + properties
  "web/node_modules/",
  "web/.next/",
  "web/out/",
]

# Committed generated files: in the carrier in full. Under LBL
# inv:labels:generated-compliance their occurrences are occurrences
# in full — each the unique mint of its label on its warrant, or a
# resolving citation — excluded only from what the region PRESENTS
# (its rows never feed the sets they were generated from). Freshness
# is byte-exact either way (ARCH rule:linter:register-freshness).
generated_files = [
  "crates/cogra-linter/docs/attestation-register.md",  # E_hat_A, see [kinds.register]
  "schema.graphql",             # exported, CI-diffed (CLAUDE.md)
  "Cargo.lock",
  "web/package-lock.json",
  "design-tokens.json",
  "client-crypto-vectors.json",
  "android/gradle/libs.versions.toml",
  # The per-owner label registers of the rust-test profile, one per
  # owner with covered assets, materialized by the generator on
  # 2026-08-26; see [profiles] profile rust-test, standard_place.
  "crates/api/label-register.md",
  "crates/cogra-interchange/label-register.md",
  "crates/cogra-linter/label-register.md",
  "crates/common/label-register.md",
  "crates/l1-standin/label-register.md",
  "crates/postgres-store/label-register.md",
]

# Vendored trees: third-party sources kept in-repo. Empty today; the
# first-party Kotlin grammar of ARCH dec:linter:kotlin-tree-sitter
# ships a GENERATED parser, which lands here when it exists.
vendored_trees = [
  # "crates/cogra-linter/vendor/tree-sitter-kotlin-generated/",
]

# Vendored files: single third-party sources kept in-repo.
#
# docs/primitive/layer1-interface.md is a DERIVED extraction of a
# third-party specification (its own provenance note), under a
# separate licence (LICENSE-DOCS, CC-BY-4.0), whose ~364 label names
# are contractually frozen upstream — renaming a pinned name is a
# breaking change on the L1 team's side, so this corpus cannot migrate
# them. It is therefore outside the carrier: outside the label graph
# entirely — no owner, no prefix, no scanned region, no mints, no
# citations, and nothing in it to resolve or to fail.
#
# THE FUTURE PATH: when the L1 repository becomes public, the upstream
# specification joins as a citable owner, and citations of the L1
# surface from CoGra docs point THERE, in imported form, at the names
# their author owns. Registering that owner is the decision that ends
# this exclusion.
vendored_files = [
  "docs/primitive/layer1-interface.md",
]


####################################################################
# [signature] — Sigma: registered prefixes -> owners
#
# RULED 2026-08-21.
#
# LBL sig:labels:owners. Sigma is a partial map from registered
# prefixes to owners; each registered prefix names exactly one owner
# in Omega's range. Sigma is closed under its registered FAMILIES;
# a prefix outside every family enters only by recorded decision.
#
# Two sources of prefixes here:
#   (a) hand-registered prefixes for document owners and doc-tree
#       owners — the SPEC/GUIDE/NOTES pattern of the illustration;
#   (b) one registered FAMILY for code packages, with the derivation
#       rule stated below.
####################################################################

[signature]

# --- Family: code packages -------------------------------------
# LBL sig:labels:owners: "each code package | one prefix per package,
# derived from the package name". Derivation rule R-PKG', stated so the
# family is closed: take the package's directory basename relative to
# the corpus root, uppercase it, delete every hyphen, then delete a
# leading COGRA when what remains is nonempty and unique among
# prefixes. Hyphens must go: PREFIX ::= [A-Z][A-Z0-9]* admits no
# punctuation. The COGRA strip earns its special case in legibility at
# every imported citation — INTERCHANGE over COGRAINTERCHANGE — and
# stays closed: it is a total function of the name, with the two
# provisos deciding the two ways it could fail. Uniqueness is
# otherwise inherited from directory uniqueness. A NEW package
# therefore needs no decision — it joins the family by R-PKG'.

[signature.families.package]
rule        = "uppercase(basename(package_dir)), hyphens deleted, then a leading COGRA deleted when the remainder is nonempty and unique among registered prefixes"
rule_id     = "R-PKG'"
applies_to  = "every unit the build system names as a package: a Cargo package, the Gradle build, the npm package"

# --- Hand-registered prefixes ----------------------------------
# owner  = stable owner id used everywhere else in this file
# prefix = the registered PREFIX for imported citations
# note   = provenance of the registration

[[signature.prefix]]
prefix = "LBL"
owner  = "doc.label-calculus"
note   = "provisional in ARCH preamble; kept verbatim"

[[signature.prefix]]
prefix = "KND"
owner  = "doc.kind-registry"
note   = "provisional in ARCH preamble; kept verbatim"

[[signature.prefix]]
prefix = "IDN"
owner  = "doc.identity-adjudication"
note   = "provisional in ARCH preamble; kept verbatim"

[[signature.prefix]]
prefix = "ICX"
owner  = "doc.interchange-conventions"
note   = "provisional in ARCH preamble; kept verbatim; the corpus's most-cited prefix — 70 imported citations in prose (65 from the interchange crate's docs, 4 from ARCH, 1 from the linter's concept) plus 1 in the interchange crate's Rust sources, measured 2026-08-25"

[[signature.prefix]]
prefix = "ARCH"
owner  = "doc.linter-architecture"
note   = "the linter's architecture document is its own owner; prefix in live use — 60 imported citations, 43 from the linter crate's concept and 17 from the interchange crate's docs, measured 2026-08-25"

# Doc-tree owners. These are NOT major documents; they are the
# residual groups that make Omega total over docs/ without inventing
# eight document owners for documents that carry no labels today.
# ARCH conv:linter:owner-partition leaves "how the docs trees group
# beneath major documents" to this file, and the grouping is: the
# major documents are exactly the label-bearing ones, each remaining
# docs tree gets one residual owner. Promoting a document to its own
# owner is one recorded decision, taken when it takes labels.

[[signature.prefix]]
prefix = "PRIM"
owner  = "tree.docs-primitive"
note   = "docs/primitive/ — 17 files in the carrier; 10 of them carry 42 label-shaped spans, every one naming the Layer 1 document and every one displayed in double backticks (R20), so the tree holds no occurrence at all; layer1-interface.md itself is outside the carrier, see [carrier] vendored_files"

[[signature.prefix]]
prefix = "INST"
owner  = "tree.docs-instances"
note   = "docs/instances/ — 10 files; 6 carry 13 label-shaped spans, all displayed in double backticks (R20): 11 name the Layer 1 document, 2 are governance action keys, which are data strings rather than labels and are displayed with the casing near-misses of their own family"

[[signature.prefix]]
prefix = "IMPL"
owner  = "tree.docs-implementation"
note   = "docs/implementation/ — 13 files; 2 carry 3 label-shaped spans, all displayed in double backticks (R20) — displaying them is what keeps them from becoming labels. api-spec.md (3479 lines) and data-model.md (1417 lines) are of major-document rank by function and are promoted the day they take labels"

[[signature.prefix]]
prefix = "DOCS"
owner  = "tree.docs-root"
note   = "docs/README.md and docs/open-questions.md; the latter carries 3 label-shaped spans, all displayed in double backticks (R20)"

[[signature.prefix]]
prefix = "NOTES"
owner  = "tree.working-notes"
note   = "ARCH conv:linter:owner-partition: working notes are their own owner. One owner, two roots (tmp_dev/, tmp_research_files/), both gitignored junctions — see the partition rules"

[[signature.prefix]]
prefix = "REPO"
owner  = "tree.repo-root"
note   = "the residual owner: root prose (README, CONTRIBUTING, CLAUDE.md), Makefile, scripts/, migrations/, docker/. Last rule of the partition; this is what makes Omega total"

# --- Prefixes derived by R-PKG' (listed for legibility only) -----
# They are members of the family, not separate registrations.
#   crates/api               -> API
#   crates/common            -> COMMON
#   crates/l1-standin        -> L1STANDIN
#   crates/postgres-store    -> POSTGRESSTORE
#   crates/cogra-linter      -> LINTER
#   crates/cogra-interchange -> INTERCHANGE
#   android                  -> ANDROID
#   web                      -> WEB
# None collides with a hand-registered prefix above.

# --- Numbered-record family: NOT registered in v1 ---------------
# LBL sig:labels:owners admits a family of numbered records
# (records/NNN-*.md, one owner per record, prefix from the filename).
# This corpus has no such tree. Registering one is a later decision.

[signature.families.numbered_records]
registered = false
reason     = "no records/NNN-*.md tree exists in this corpus"


####################################################################
# [partition] — Omega: ordered path-prefix rules -> owners
#
# RULED 2026-08-21.
#
# LBL sig:labels:owners: Omega is total on the carrier. ARCH
# sig:linter:adoption-data: explicit path-prefix rules, literal
# prefixes, no patterns. FIRST MATCH WINS, so the order below is
# load-bearing: the five document owners must precede the package
# rule for crates/cogra-linter/.
#
# LBL inf:labels:derivation-warrant: "The owner is the asset's
# package, never the module" — so a package's whole tree is one owner
# and refactoring inside it changes nothing.
####################################################################

[partition]
match = "first-match-wins, in the order listed"
order_rule = """
order IS CHECKED AT LOAD and is not decoration: each rule's order must
equal its 1-based position in this list, or the adoption data fails to
load with a located error naming both numbers. Matching walks the
rules in file order, so the list IS the order and `order` is this
document's claim about it; a shuffled or repeated integer would make a
rule match in an order its own row contradicts, silently. Inserting a
rule therefore means renumbering every rule below it.
"""

# --- 1..5: the discipline documents and the linter architecture ---
# Each is its own owner though all five sit inside the cogra-linter
# package tree. They are corpus-generic disciplines that happen to be
# kept there; ARCH conv:linter:owner-partition names the four
# disciplines as major documents, and ARCH registers its own prefix.

[[partition.rule]]
order = 1
path  = "crates/cogra-linter/docs/label-calculus.md"
owner = "doc.label-calculus"

[[partition.rule]]
order = 2
path  = "crates/cogra-linter/docs/environment-kinds.md"
owner = "doc.kind-registry"

[[partition.rule]]
order = 3
path  = "crates/cogra-linter/docs/identity-adjudication.md"
owner = "doc.identity-adjudication"

[[partition.rule]]
order = 4
path  = "crates/cogra-linter/docs/interchange-conventions.md"
owner = "doc.interchange-conventions"

[[partition.rule]]
order = 5
path  = "crates/cogra-linter/docs/architecture.md"
owner = "doc.linter-architecture"
note  = "the linter package's design document is its own owner, keeping the ARCH prefix its 16 live citations already use. It is a corpus-generic document like the four disciplines beside it, not the linter crate's internal prose"

# --- 6..13: package owners (prefixes by R-PKG') ------------------

[[partition.rule]]
order = 6
path  = "crates/cogra-linter/"
owner = "pkg.cogra-linter"
note  = "docs-only today; src/ lands with the first slice"

[[partition.rule]]
order = 7
path  = "crates/cogra-interchange/"
owner = "pkg.cogra-interchange"
note  = "COVERS ITS docs/ DELIBERATELY. Evidence: concept.md and design.md mint 16 + 76 labels with ZERO collisions, share the area 'xchg', and design.md cites concept.md's mints UNPREFIXED (e.g. req:xchg:determinism) — which resolves only if the two files are one owner (LBL inf:labels:same-owner-citation). They import ARCH and ICX with brackets, confirming those are other owners"

[[partition.rule]]
order = 8
path  = "crates/api/"
owner = "pkg.api"

[[partition.rule]]
order = 9
path  = "crates/common/"
owner = "pkg.common"

[[partition.rule]]
order = 10
path  = "crates/l1-standin/"
owner = "pkg.l1-standin"

[[partition.rule]]
order = 11
path  = "crates/postgres-store/"
owner = "pkg.postgres-store"

[[partition.rule]]
order = 12
path  = "android/"
owner = "pkg.android"
note  = """
ONE owner for the whole Gradle build, though android/ has 12 modules
(:app, :core:crypto|designsystem|domain|network,
:feature:auth|content|home|invites|onboarding|profile|settings).
Nothing is scanned there in v1 — the Kotlin frontend is slice 3 — so
a 12-way split would buy 12 prefixes and 12 rules over an empty
occurrence set. The split is revisited when the Kotlin frontend
lands and the modules start carrying labels; that is when
LBL inf:labels:derivation-warrant's package/module boundary begins
to decide anything here.
"""

[[partition.rule]]
order = 13
path  = "web/"
owner = "pkg.web"

# --- 14..17: doc-tree residual owners ---------------------------

[[partition.rule]]
order = 14
path  = "docs/primitive/"
owner = "tree.docs-primitive"
note  = "covers nothing label-bearing: layer1-interface.md, the one label-shaped file in the tree, is outside the carrier ([carrier] vendored_files)"

[[partition.rule]]
order = 15
path  = "docs/instances/"
owner = "tree.docs-instances"

[[partition.rule]]
order = 16
path  = "docs/implementation/"
owner = "tree.docs-implementation"

[[partition.rule]]
order = 17
path  = "docs/"
owner = "tree.docs-root"

# --- 18..19: working notes (one owner, two roots) ---------------

[[partition.rule]]
order    = 18
path     = "tmp_dev/"
owner    = "tree.working-notes"
optional = true

[[partition.rule]]
order    = 19
path     = "tmp_research_files/"
owner    = "tree.working-notes"
optional = true
note = """
optional = true means: a configured root that is ABSENT is legal and
silent. Both roots are gitignored junctions into the dev-state repo
and simply do not exist on some machines; a missing tree there is a
fact about the checkout, not a defect of the corpus.
Absence only. A root that EXISTS and cannot be read stays a loud
diagnostic — LBL cav:labels:coexistence forbids an unreadable tree
becoming an empty carrier, and optional does not touch that case.
When the trees are present they are fully checked: LBL
ansatz:labels:unchecked-locals expressly REJECTS exempting the
working notes from resolution.
"""

# --- 20: the residual rule that makes Omega total ---------------

[[partition.rule]]
order = 20
path  = ""
owner = "tree.repo-root"
note  = "empty prefix matches everything not matched above: README.md, CONTRIBUTING.md, CLAUDE.md, Makefile, Cargo.toml, rust-toolchain.toml, scripts/, migrations/, docker/, and anything new. Totality is structural, not a check that can fail"


####################################################################
# [profiles] — Pi: the registered family of inventory profiles
#
# RULED 2026-08-21.
#
# LBL sig:labels:profiles requires FIVE data per profile:
#   kind token, census, classification rule (the area derives from
#   it), name transformation, standard place.
# LBL inv:labels:inventory then binds: within each owner, EVERY asset
# of the census carries EXACTLY ONE label of the kind at the standard
# place; the derivation is INJECTIVE; and no label of the kind occurs
# without a covered asset.
#
# Two profiles in v1, both Rust, both named by ARCH
# conv:linter:rust-frontend ("a test profile recognizing
# test-attributed functions, a module profile recognizing mod items").
# No web, Kotlin, or Markdown profile in v1: their frontends are later
# slices (ARCH gate:linter:architecture-review, sequencing clause),
# and a profile whose frontend does not exist cannot compute a census.
#
# STAGED ENTRY — RULED 2026-08-25. LBL inv:labels:inventory admits
# nothing partial: every covered asset carries its label at the
# standard place or the run fails. The module profile below is
# therefore unsatisfiable on the day it is switched on: it wants 84
# inner doc comments that do not yet exist. So a profile ENTERS Pi
# together with the migration that makes it satisfiable, and not
# before: registered here, staged until its own condition holds.
# Entering is a commit that flips status and effective, nothing more.
####################################################################

[profiles]
count     = 2   # registered below
effective = 1   # in Pi today; each profile's status says what it waits on

# ---------------------------------------------------------------
# Profile 1: Rust tests
# ---------------------------------------------------------------
[[profiles.profile]]
id     = "rust-test"
kind   = "test"
status = "effective"
enters_when = "the linter's first register generation commits a label-register.md for every owner with covered assets"
# ENTERED PI 2026-08-26, its condition discharged by the run that
# committed a label-register.md for each of the six owners with
# covered assets, over a census of 1476.
# 'test' is the Assets-family row of KND conv:kinds:assets (Test ->
# test). Note the homonym: KND conv:kinds:examples also rows Test, as
# quiz. The kind token at the label is the disambiguation (KND
# cav:kinds:homonymy), and inventory kinds only ever derive.

  [profiles.profile.census]
  language    = "rust"
  recognizer  = "syn item tree: a fn item carrying a test attribute"
  attributes  = ["test", "tokio::test", "sqlx::test"]
  attribute_rule = "any attribute path whose final segment is 'test'"
  note = """
LBL cav:labels:assets: "A test is what the harness recognizes." The
three attributes above are what this corpus's harnesses recognize;
the open rule keeps a fourth harness from needing a code change.
MEASURED 2026-08-25 by the linter's own migrations subcommand, on its
first run over this corpus: 1444 test-attributed functions. The
census is the linter's now, so the number is read off the tool that
will enforce it rather than off a sweep beside it.
"""

  [profiles.profile.classification]
  # The AREA derives from this rule.
  rule  = "the Cargo TARGET containing the function"
  areas = { lib_or_bin_target = "unit", integration_test_target = "integration" }
  note = """
Two areas, because Cargo recognizes two test target kinds. The
illustration in LBL sig:labels:profiles also shows 'interunit'; this
corpus's build system draws no such line, and an area no recognizer
can populate would be a registration with nothing behind it.
THE READING, RECORDED: LBL judg:labels:derivation forbids file,
module, path and position from entering a derivation, and LBL
ansatz:labels:path-derivation rejects path-derived NAMES. "Which
Cargo target contains it" is a BUILD-SYSTEM fact about the asset's
class — the same species of fact as "the harness recognizes it as a
test", which is what makes the asset an asset at all — and not a path
fact, even though the build system happens to locate integration
targets by directory. The derivation reads the target, never the
path; moving a file between directories matters only insofar as the
build system thereby says it is a different kind of target.
"""

  [profiles.profile.name_transformation]
  rule = "the function's bare identifier, lowercased, underscores replaced by hyphens"
  example = "decode_roundtrip -> decode-roundtrip"
  note = """
Exactly the illustration's transformation, which produces
test:integration:decode-roundtrip. Output must match
name ::= word ("-" word)*, word ::= [a-z0-9]+ — Rust's snake_case
identifiers do, after the substitution.
MEASURED: injectivity holds TODAY. Per-owner distinct test-function
names: api 160/160, common 81/81, l1-standin 15/15,
postgres-store 26/26. Zero collisions; the profile is adoptable
without renaming a single test.
"""

  [profiles.profile.standard_place]
  place    = "a generated register of the owner"
  register = "one register per owner with covered assets, at <owner tree root>/label-register.md — e.g. crates/api/label-register.md. The register's NAME AND LOCATION ARE IMPLEMENTATION-DEFINED: the linter's generate mode maintains them and may move them. What the calculus fixes, and what this profile chooses, is only that the place is a generated register OF THE OWNER"
  form     = "one row per covered asset, carrying the label in the Markdown mint form (single-backtick span); rows ordered bytewise by label, per ARCH req:linter:determinism"
  note = """
LBL sig:labels:profiles allows four places — the header, the
documentation comment, the owner's prose, or a generated register of
the owner (LBL inv:labels:generated-compliance) — one choice per
profile. The register is this profile's place.
WHAT IT COSTS: one generator and zero source edits. LBL
inv:labels:inventory admits nothing partial — every covered asset
carries its label or the run fails — and at 1444 functions that is the
difference between a profile that is adoptable now and one that waits
on a 1444-function migration.
WHY IT IS SOUND: a generated mint stands on its warrant exactly as an
authored one does, and a derivation "is attested wherever the
profile's standard place lies, a generated register included" (LBL
inv:labels:generated-compliance). The one exclusion that carries the
safety — a generated region participates in nothing it presents — is
not even engaged here: these rows are generated from the CENSUS, an
AST fact, never from an occurrence set, so no row can feed a set it
was generated from and LBL metathm:labels:no-self-support stays a
theorem.
WHERE THE FILE LIVES: inside the tree of the owner it presents. The
mint occurs where the label is carried, and a mint must lie in the
owner that owns the label, so each register falls under its owner's
own partition rule.
FRESHNESS: each register is a committed generated file in the carrier
— regenerated in memory every run and compared byte-exact, never
written in check mode (ARCH rule:linter:register-freshness).
Markdown is a slice-1 frontend, so the register's own file is scanned
from the first slice; nothing here waits on a later one.
"""

# ---------------------------------------------------------------
# Profile 2: Rust modules
# ---------------------------------------------------------------
[[profiles.profile]]
id     = "rust-module"
kind   = "mod"
status = "staged"
enters_when = "the 84 module definitions carry the //! inner doc comment of this profile's standard place"
# KND conv:kinds:assets: Module -> mod.

  [profiles.profile.census]
  language   = "rust"
  recognizer = "syn item tree: module DEFINITIONS"
  definition_rule = "an inline `mod name { ... }` item, or the file (or dir/mod.rs) that backs a `mod name;` declaration — counted ONCE per definition, never per declaration"
  exclude    = ["modules attributed #[cfg(test)]"]
  note = """
LBL sig:labels:profiles admits "a container such as a module or
namespace DEFINITION" — the word decides the census, and measurement
confirms it must: `mod rig;` is declared NINE times in
crates/api/tests/*.rs, all naming the ONE definition at
crates/api/tests/rig/. Under a declaration-census that is a 9-way
injectivity violation of LBL inv:labels:inventory; under a
definition-census it is one asset.
#[cfg(test)] modules are EXCLUDED from the census: they are test
scaffolding, and what lives inside them is the test profile's
business. 13 files declare `mod tests`, so a census that kept them
would derive mod:*:tests thirteen times and fail injectivity in two
owners on day one. The consequence is accepted plainly — an inline
test module carries no label of its own.
MEASURED after the exclusion: no duplicate module name remains in any
owner (api, common, l1-standin, postgres-store all clean).
"""

  [profiles.profile.classification]
  rule  = "one constant area"
  areas = { all = "module" }
  note = """
Every module label is mod:module:<name>. The area carries no
information, and that is the point: it cannot be wrong, and it cannot
move.
A visibility-derived area would make visibility a CITATION-VISIBLE
FACET of the module — changing a module from private to pub would
change its label and dangle every citation of it (LBL
metathm:labels:warrant-lapse), so an ordinary refactor would break
prose that never mentioned visibility. The area must in any case
derive from a fact the asset itself exposes, never from where it sits
(LBL judg:labels:derivation; LBL ansatz:labels:path-derivation); a
constant satisfies that trivially.
Injectivity is decided by the name alone and is unaffected: MEASURED
clean in every owner after the #[cfg(test)] exclusion.
"""

  [profiles.profile.name_transformation]
  rule = "the module's bare identifier, lowercased, underscores replaced by hyphens"
  example = "record_mirror -> record-mirror"

  [profiles.profile.standard_place]
  place = "the module's INNER documentation comment"
  form  = "a //! line carrying the label alone, in the code (acute) syntax, at the top of the module body"
  note = """
One place per profile is required, and file-backed and inline modules
must share it. The inner doc comment is the only form both can carry:
//! at the top of the backing file, and //! at the top of an inline
`mod foo { ... }` body. An outer /// would work for inline items only.
The label sits at the asset, which is what this place buys over a
register.
PENDING TASK, MEASURED 2026-08-25 by the linter's own migrations
subcommand on its first run: 84 module definitions, every one of them
still needing an inner doc comment before this profile can pass —
the census and the remainder coincide because not one carries its
label yet. LBL inv:labels:inventory admits nothing partial, so the
migration is a precondition of enabling the profile, not a cleanup
after it.
"""

# --- Profiles deliberately NOT in v1 ----------------------------
# Naming them keeps K's reservations legible (see [reserved-kinds]).
#   func      Rust/Kotlin/TS functions  — census is large; no ruling
#   type      Rust type items           — no ruling
#   class     Kotlin classes            — needs the Kotlin frontend
#   migr      migrations/*.sql          — no SQL frontend
#   endpoint  GraphQL operations        — no GraphQL frontend
#   suite     test suites               — no harness notion of a suite
# LBL sig:labels:profiles: extending Pi is a RECORDED DECISION, and
# the deciding commit must, in the same commit, retire or rename every
# authored mint of the claimed kind. K below keeps that cost at zero
# by forbidding those kinds to authors from the start.


####################################################################
# [reserved-kinds] — K
#
# RULED 2026-08-21: K is the whole Assets family, all 36 tokens.
#
# LBL sig:labels:reserved-kinds: K is the set of kinds intended for
# DERIVATION ONLY. Every kind governed by Pi lies in K. A kind in K
# that no profile governs admits NEITHER warrant rule: its bare
# occurrence is a hard failure awaiting its derivation, never an
# authored mint (LBL inv:labels:warrant-totality).
#
# WHAT BELONGS IN K, AND WHY:
# The calculus says a corpus adopting a kind registry "populates K
# from it by its own recorded decision" but does not say WHICH kinds.
# The registry answers it: KND conv:kinds:assets is defined by exactly
# the property that makes a kind derivable — "The family's mark is
# that the name is the code's own: an asset is headed by the
# identifier it already bears, where every other family's head is a
# heading an author composes." A kind whose name is the code's own is
# a kind no author should be minting by hand. So:
#
#   K := the distinct kind tokens of KND conv:kinds:assets.
#
# COST TODAY: ZERO. Not one live mint in the corpus uses an
# Assets-family kind (checked across all 7 label-carrying files of the
# carrier: areas labels, kinds, identity, interchange, linter, xchg).
# Reserving now costs nothing and prevents the painful case LBL
# sig:labels:profiles describes — a later profile CLAIMING a kind and
# having to retire every authored mint of it in the same commit. A
# narrow K over the governed kinds alone would leave func, class,
# endpoint and migr authorable and pay for it at exactly that moment.
####################################################################

[reserved-kinds]
source = "KND conv:kinds:assets — distinct kind tokens of that table"
count  = 36

# STAGING (2026-08-25): the kinds below are governed by the profiles
# of [profiles], test by one in Pi since 2026-08-26 and mod by one
# still registered and staged. Until that profile enters Pi with its
# migration, no profile governs mod — and LBL
# sig:labels:reserved-kinds then makes a bare occurrence of it a hard
# failure awaiting its derivation, which is the same outcome by a
# different clause. The lists record registration, not entry.
governed = [
  "test",   # profile rust-test
  "mod",    # profile rust-module
]

reserved_ungoverned = [
  "api",         # API item
  "alert",       # Alert
  "bench",       # Benchmark
  "cli",         # CLI command
  "class",       # Class; also Struct, Structure (KND inv:kinds:one-kind)
  "dataset",     # Dataset
  "endpoint",    # Endpoint; also Route
  "envvar",      # Environment variable
  "errcode",     # Error code
  "event",       # Event
  "flag",        # Feature flag
  "fixture",     # Fixture
  "func",        # Function
  "fuzz",        # Fuzz target
  "iface",       # Interface
  "job",         # Job; also Task
  "lib",         # Library
  "lint",        # Lint rule
  "macro",       # Macro
  "metric",      # Metric
  "migr",        # Migration
  "ns",          # Namespace
  "pkg",         # Package
  "pipeline",    # Pipeline; also Workflow
  "query",       # Query
  "role",        # Role
  "runex",       # Runnable example
  "dataschema",  # Schema (data-shape sense; daggered in KND)
  "script",      # Script
  "svc",         # Service
  "setting",     # Setting
  "snapshot",    # Snapshot
  "suite",       # Suite
  "type",        # Type
]

# Deliberately OUTSIDE K, though they name code-adjacent things:
#   listing, impl, alg, model, data — these are AUTHORED environments
#   (KND conv:kinds:computation), headed by a heading an author
#   composes, not by an identifier the code already bears. design.md
#   already mints impl:xchg:* and model:xchg:* legitimately.


####################################################################
# [typed-data] — designated classes citing synthetically
#
# EMPTY IN V1 — stated, not omitted. RULED 2026-08-21.
#
# LBL inf:labels:synthetic-citation lets a corpus designate classes of
# typed-data strings (identifiers in schemas, manifests, machine-
# checked design artifacts) as citing a target owner. Designating a
# class makes every such string a citation that MUST resolve (LBL
# inv:labels:total-resolution) — so a designation is a hard commitment.
#
# STAGING, NOT SETTLED MINTLESSNESS. Empty is what the corpus supports
# today, not a judgment that these strings should never cite. Every
# candidate is missing the same half — a MINT to cite:
#   * interchange namespace labels — expressly disqualified by the
#     source: ICX's preamble states its namespace labels "are
#     unrelated to the documentation labels of any corpus labeling
#     discipline; only the word is shared". No invention available.
#   * schema.graphql type/field names — generated artifact, and no
#     documentation owner mints matching labels.
#   * migrations/*.sql filenames, design-tokens.json keys,
#     client-crypto-vectors.json ids — nothing mints them either.
# THE REVISIT CONDITION is exact: designations follow once inventory
# profiles derive mints for those asset classes — a migrations profile
# over migrations/*.sql, an endpoint profile over the GraphQL
# operations. Adopting such a profile reopens this section; nothing
# else does.
####################################################################

[typed-data]
classes = []
empty_in_v1 = true
status = "staging — empty because no mint exists to cite, not because permanent mintlessness is accepted"
reason = "no typed-data string in this corpus targets a documentation mint; ICX expressly disclaims the connection for its own namespace labels"
revisit_when = "an inventory profile derives mints for one of these asset classes (a migrations profile, an endpoint profile)"


####################################################################
# [citation-indexes] — documents maintaining committed indexes
#
# EMPTY IN V1 — stated, not omitted. RULED 2026-08-21.
#
# LBL inf:labels:anchor-harvest: a designated document D maintains a
# committed index of its citations into an UPSTREAM OWNER U, presented
# as exactly the distinct set Anchors(D, U), ordered bytewise-
# lexicographically, with any pinned hash computed from that ordered
# presentation alone.
#
# THE ONE CANDIDATE IS NOT DESIGNATED.
# docs/primitive/layer1-interface.md pins an anchor set — "364
# distinct anchor names, anchor_set_hash = sha256 over the sorted
# distinct anchor names joined by \n, no trailing newline" — which is
# the anchor-harvest shape almost exactly. It is nevertheless not a
# citation index of this corpus, on three grounds:
#   (1) the file is outside the carrier ([carrier] vendored_files), so
#       it has no citations in the calculus's sense to harvest;
#   (2) U must be an OWNER OF THIS CORPUS with actual mints — Import
#       requires O' |- o => l — and the PeerNetworks specification is
#       not in this corpus at all. There is nothing for harvested
#       citations to resolve INTO;
#   (3) the file materializes no index SECTION; it states a count and
#       a hash. LBL inf:labels:anchor-harvest requires the committed
#       index to present the set, and LBL metathm:labels:no-self-
#       support requires it to sit outside body(D).
# THE FUTURE PATH: when the L1 repository becomes public, the upstream
# specification joins as a citable owner; CoGra documents citing that
# surface do so in imported form, and it is THOSE citations — inside
# the carrier, into a registered owner — that a citation index would
# harvest. Note also that the calculus fixes only the ordering and the
# projection; the hash function, its role separation, and its
# identifier are owed to the identity discipline (LBL
# inf:labels:anchor-harvest, closing clause; IDN).
####################################################################

# THE SHAPE A DESIGNATION WILL CARRY — RULED 2026-08-25, NOT A SCHEMA
# CHANGE. When the first designation is recorded, it carries the
# UPSTREAM OWNER ID beside the document and the index section: the
# owners U that LBL inf:labels:anchor-harvest ranges over. The field
# is named now because it is the one the linter cannot do without and
# the one a designation written without it would silently omit — a
# PresentedSet is built from the harvested set of a NAMED upstream
# owner, and "the owners designated upstream of D" is not recoverable
# from the document alone.
#
# UNTIL THEN THE EXCLUSION IS VACUOUSLY DISCHARGED. LBL
# inv:labels:generated-compliance's one exclusion — a generated region
# participates in nothing it presents — needs a presented set to
# exclude, and with no designation there is none: no Anchors edge is
# harvested, no PresentedSet is built, and the judgment passes over an
# empty domain rather than by absence. That is why the linter
# implements the query today against nothing (ARCH
# tab:lint:judgment-implementation): the day a designation is recorded
# is the day the domain becomes non-empty, and nothing else changes.
[citation-indexes]
designations = []
empty_in_v1 = true
reason = "the only anchor-set-shaped file in the tree sits outside the carrier and pins names of an owner this corpus does not contain; a designation needs an upstream owner with mints here"


####################################################################
# [scanned-regions] — per language, which regions participate
#
# RULED 2026-08-21.
#
# LBL judg:labels:participation: "In code, only comments and
# documentation comments are scanned; string and character literals
# and fenced documentation examples are not. Which regions count as
# comments in each language is fixed at adoption."
# ARCH's frontend decisions fix them per language: Rust = doc comments
# only; Markdown = prose; web and Kotlin = comments.
#
# A language with NO frontend has NO scanned regions. Its files stay
# in the carrier and stay owned — they simply carry no occurrences,
# and LBL judg:labels:minting makes a file with no occurrences
# "vacuously in good standing".
####################################################################

[scanned-regions]

[[scanned-regions.language]]
language   = "markdown"
extensions = [".md"]
frontend   = "pulldown-cmark"
slice      = 1
scanned    = [
  "authored prose blocks (block-level elements, structure resolved away)",
  "generated prose regions (occurrences in full, excluded only from what the region presents — LBL inv:labels:generated-compliance; exactness still checked)",
]
not_scanned = [
  "fenced code blocks (nonparticipating wholesale)",
  "double-backtick code spans (displayed, not participating)",
]
region_unit = "one block-level element, list markers / quote markers / continuation indentation resolved away"
delimiter_note = "single- vs double-backtick is decided by reading the delimiter run length at the span's own offset (ARCH conv:linter:markdown-frontend); an unpaired backtick fails ITS BLOCK and only its block"

[[scanned-regions.language]]
language   = "rust"
extensions = [".rs"]
frontend   = "syn"
slice      = 1
scanned    = [
  "outer line doc comments (///)",
  "inner line doc comments (//!)",
  "outer block doc comments (/** ... */)",
  "inner block doc comments (/*! ... */)",
  "#[doc = \"...\"] attributes",
]
not_scanned = [
  "plain line comments (//) — BANNED, see [banned-tokens]",
  "plain block comments (/* ... */) — BANNED, see [banned-tokens]",
  "string and character literals, including raw strings",
  "fenced examples inside doc comments",
]
region_unit = "one comment, its leaders resolved away; a run of consecutive /// lines is ONE logical region"
note = "ARCH conv:linter:rust-frontend: Rust's scanned regions are exactly the documentation comments, which survive parsing as doc attributes with spans"

[[scanned-regions.language]]
language   = "typescript"
extensions = [".ts", ".tsx"]
frontend   = "swc_ecma_parser"
slice      = 2
scanned    = ["line comments (//)", "block comments (/* ... */)", "JSDoc block comments (/** ... */)"]
not_scanned = ["string, template and character literals", "JSX text nodes"]
region_unit = "one comment from swc's out-of-band comments store, keyed by byte position"
note = "ARCH conv:linter:web-frontend: web = comments, all forms. No ban applies to // in TypeScript"

[[scanned-regions.language]]
language   = "kotlin"
extensions = [".kt"]
frontend   = "tree-sitter, first-party grammar"
slice      = 3
scanned    = ["line comments (//)", "block comments (/* ... */)", "KDoc (/** ... */)"]
not_scanned = ["string literals including templates and multi-dollar interpolation", "character literals"]
region_unit = "one comment node from the grammar, leaders resolved away"
precondition = "the first-party grammar parses the whole Android corpus to ZERO error nodes (ARCH dec:linter:kotlin-tree-sitter)"
note = "MEASURED in ARCH rep:linter:kotlin-parser-study: 138 Kotlin files, 964 line comments, 441 block comments (all KDoc). .kts is not Kotlin for the linter's purposes in v1 — see the no-frontend entry below"

# --- Languages present with NO frontend, hence no scanned regions ---
# Listed so their absence is a decision rather than an oversight.
[[scanned-regions.none]]
languages  = ["sql", "graphql", "toml", "kotlin-script", "shell", "properties", "json", "yaml", "svg"]
extensions = [".sql", ".graphql", ".toml", ".kts", ".sh", ".properties", ".json", ".yaml", ".yml", ".svg"]
reason     = "no frontend exists; ARCH dec:linter:ast-frontends forbids analysing them as raw text. Files stay in the carrier and stay owned, carrying no occurrences"
kts_note   = "the 16 Gradle scripts (build.gradle.kts, settings.gradle.kts, build-logic/) are build infrastructure, not app source, and the zero-error precondition of ARCH dec:linter:kotlin-tree-sitter was measured over the 138 .kt files only. They are revisited at the Kotlin slice, where the grammar that would parse them arrives"
# LaTeX is absent from the corpus tree today; ARCH
# open:linter:latex-frontend keeps its frontend deferred.


####################################################################
# [head-recognition] — which regions are environment heads
#
# RULED 2026-08-25.
#
# KND def:kinds:presentation-reduction closes by making two things
# adoption data: "Which environment class a document format declares
# for a head, and how a head maps to one". KND judg:kinds:head-validation
# then judges every PARTICIPATING AUTHORED head, and KND
# inv:kinds:totality demands exactly one judgment per head — so a
# checker cannot validate one head until this section says which
# regions are heads at all. [scanned-regions] fixes which regions
# PARTICIPATE; this section fixes which of them are HEADS.
#
# Only Markdown carries heads in this corpus. A code comment is a
# scanned region and may carry occurrences, but it heads no
# environment: every document written under the discipline is prose,
# and the one label a Rust source is owed sits at an asset, not at a
# head (see [profiles] profile rust-module).
####################################################################

[head-recognition]
separator = "·"
match     = "case-exact"
note = """
CASE-EXACT, RULED. KND judg:kinds:head-validation holds when h "is an
exact catalogue name", and the registry catalogues its names with
their own capitalization. Folding case would make Table and table one
name and quietly widen N, which no row authorizes. A head whose only
defect is casing is therefore a validation failure that names the
catalogue spelling, never a silent pass.
ONE CONSEQUENCE, DISCHARGED: ARCH's own head at its LaTeX open
question read "Open question" where the catalogue carries "Open
Question". It is corrected in that document rather than absorbed by a
folding rule here.
The SEPARATOR is the middle dot that closes every head before its
mint. It is adoption data because the mint's position is: a checker
must know where the head text ends and the label begins.
"""

[[head-recognition.form]]
id       = "environment-head"
language = "markdown"
shape    = "a bold run opening a block, of the form Kind (Title), followed by the separator and the mint"
head     = "the bold run's text up to the opening parenthesis, trimmed"
note = """
The form every discipline document uses. The parenthesized Title is
the environment's own name and is NOT part of the head: the head is
what the registry classifies, and the Title is what the author calls
this one instance. A bold run carrying no parenthesis is not a head.
"""

[[head-recognition.form]]
id       = "heading"
language = "markdown"
shape    = "a Markdown heading followed by the separator and the mint"
head     = "the rung the format supplies, not the heading's own text"
note = """
KND def:kinds:presentation-reduction: "For named divisions — an
Introduction, a Conclusion — the underlying rung supplied by the
format is the base." Markdown's rung is Section, which the registry
classifies as sec (KND conv:kinds:structure), and every discipline
document's heading anchors carry sec accordingly. The heading's own
text is a title and is classified by nothing.
"""

# --- Formats with NO head form ---------------------------------
# Listed so their absence is a decision rather than an oversight. A
# scanned region in any of these may carry mints and citations; none
# of them heads an environment, so none is validated against the kind
# registry.
[[head-recognition.none]]
languages = ["rust", "typescript", "kotlin"]
reason    = "code comments carry occurrences, never environment heads"


####################################################################
# [banned-tokens] — this corpus's own additions
#
# RULED 2026-08-21.
#
# ARCH rule:linter:banned-tokens: per language, token classes that
# must not occur in carrier sources; every occurrence is a hard,
# located diagnostic. Detection is the pre-tokenizer's (ARCH
# dec:linter:pretokenizer), never a pattern match.
#
# EACH ROW CARRIES BOTH class AND token, AND THEY DO DIFFERENT WORK:
#   class = the pre-tokenizer's own vocabulary token for the lexeme
#           class this rule forbids. THE LINTER READS THIS ONE, and
#           it must be a name the lexer decides — "plain line
#           comment", "plain block comment", "outer line doc
#           comment", "string literal", and so on. A class no lexer
#           decides makes the row UNREADABLE: it bans nothing, and
#           the acceptance suite fails on it rather than letting it
#           sit here quietly.
#   token = the same class in this document's own words, with the
#           illustration a human wants. NO CODE READS IT; it is what
#           a diagnostic quotes back to a reader.
# class replaced a recovery that read the class off token's leading
# name — a machine reading prose written for a person. Adding a row
# now means naming its class from the lexer's vocabulary.
####################################################################

[banned-tokens]

[[banned-tokens.rule]]
id       = "rust-plain-line-comment"
language = "rust"
class    = "plain line comment"
token    = "plain line comment (// not followed by / or !)"
severity = "error"
status   = "ruled"
source   = "ARCH dec:linter:rust-comment-ban — the rule's named first entry"
note = """
The token must be recognized LEXICALLY, not textually: a // inside a
string literal, a raw string, or a char literal is not a comment.
That is precisely why ARCH dec:linter:pretokenizer exists.
MIGRATION COST, MEASURED 2026-08-20: ~1210 plain-comment occurrences
across 73 .rs files in crates/. ARCH names this: "the existing Rust
crates contain plain comments today, so adopting the ban implies a
one-time migration sweep — a separate task; the linter only reports."
"""

[[banned-tokens.rule]]
id       = "rust-plain-block-comment"
language = "rust"
class    = "plain block comment"
token    = "plain block comment (/* not followed by * or !)"
severity = "error"
status   = "ruled"
source   = "ARCH dec:linter:rust-comment-ban — its clause that Rust sources of this corpus carry documentation comments only"
note = """
Rust carries documentation comments only, and the two bans stand on
that one decision: a non-doc comment is contraband whichever
delimiter opens it.
MIGRATION COST, MEASURED 2026-08-21: ZERO. Not one /* occurs in the
73 .rs files under crates/ — a raw-text sweep, which can only
over-count, found none, so the lexical count is none.
Kept as its own rule because it is its own token class for the
pre-tokenizer and its own diagnostic for a reader.
"""

# No bans for markdown, typescript or kotlin in v1. Kotlin and
# TypeScript keep // — it is a scanned region there, not contraband.


####################################################################
# [kinds] — the kind registry's adoption data
#
# RULED 2026-08-25.
#
# Not one of the seven, and not the corpus's own invention either: the
# kind registry is a second discipline with adoption data of its own.
# KND sig:kinds:acceptee names exactly ONE acceptee A, who owns five
# things — the local extension set X_A, the evidence base E_A, the
# status map sigma_A, the register generator G_A, and the generated
# companion register E_hat_A — and KND gate:kinds:adoption blocks
# adoption until the decision names them. Head validation (R12 of the
# linter's functional requirements) reads the effective relation
# C_A = C union X_A, so a linter cannot validate one head until this
# section exists.
#
# THE RULING ADOPTS THE REGISTRY'S OWN DEFAULT. KND sig:kinds:acceptee
# closes: "For the corpus in which this registry itself travels, the
# registry authority is the acceptee, and the edition evidence base is
# E_A entire." This corpus is that corpus — environment-kinds.md lives
# in it — so the default fits exactly. A default is not a decision
# until it is recorded; this section is the record.
####################################################################

[kinds]
acceptee = "jakob"
registry = "crates/cogra-linter/docs/environment-kinds.md"
registry_note = """
The document the classification relation C is read out of (ARCH
dec:linter:registry-as-data). Named here as a key because the linter
READS it: a compiled-in path would be this corpus reaching the code by
another route, and before this key existed the path had to be
recovered from the prose of [kinds.evidence] adopted — a machine
reading a sentence written for a person. Its spelling is checked
against the corpus root at load, like every other configured path.
"""
note = """
KND sig:kinds:acceptee requires a NAMED authority, not a role, and the
repository owner is the registry authority for the four discipline
documents that travel here — so the registry's default resolves to one
person. (The repo's no-personal-names rule governs the L1 team, an
external party; it does not reach the corpus's own acceptee.)
"""

# --- X_A: local extensions ------------------------------------
# KND judg:kinds:classification: recorded extensions are the only
# further source of C_A. Empty, and stated rather than omitted, as
# [typed-data] and [citation-indexes] are.
[kinds.extensions]
rows        = []
hybrids     = []
empty_in_v1 = true
reason      = "every head in this corpus validates against C as published; no head needs a pair the registry does not carry"
revisit_when = "a document adopts an environment name the registry does not catalogue, or a local hybrid — either enters by a recorded decision, per KND inf:kinds:hybrid for the hybrid case"

# --- E_A: the evidence base -----------------------------------
# KND sig:kinds:acceptee splits E_A in two: an adopted component taken
# by reference, and an owned component held first-hand covering X_A
# and any status the acceptee strengthens. With X_A empty and no
# strengthening, the owned component is empty and E_A is the edition's
# entire evidence base — the default, verbatim.
[kinds.evidence]
adopted = "the edition evidence base of crates/cogra-linter/docs/environment-kinds.md, taken by reference"
owned   = []

# --- sigma_A: the status map ----------------------------------
# KND judg:kinds:attestation: an acceptee may STRENGTHEN a base row's
# edition status (borderline to firm) and never weakens one. None is
# strengthened, so sigma_A is the edition's statuses unchanged, and
# KND inv:kinds:attestation-coverage holds trivially: every pair of
# C_A carries exactly the edition's firm or borderline status.
[kinds.statuses]
strengthenings = []
daggered       = ["Yoga", "Meta-question", "Schema"]   # borderline, per the edition
candidates     = ["Record (member-bearing-aggregate sense)"]
note = """
The daggered rows and the one candidate are the present edition's,
recorded here so the corpus clause of KND inv:kinds:attestation-
coverage is checkable against something. The candidate lies OUTSIDE
C_A, as that invariant requires.
"""

# --- G_A: the register generator ------------------------------
# One generator for every generated register the disciplines call for,
# and it is the linter — ARCH rule:linter:register-freshness already
# fixes regeneration + exact byte compare as the mechanism, and a
# second generator would be a second source of truth.
[kinds.generator]
generator = "the linter's explicit regeneration mode"
covers = [
  "E_hat_A, the companion attestation register ([kinds.register])",
  "the headline counts of KND tab:kinds:headline-counts",
  "the per-owner label registers of the rust-test profile ([profiles])",
]
note = """
KND tab:kinds:headline-counts is a generated REGION inside an authored
file, not a generated file: environment-kinds.md therefore does NOT
join [carrier] generated_files, and what is regenerated and compared
is that one table. It is the registry document's only generated
region, per KND gate:kinds:adoption.
"""

# --- E_hat_A: the companion register --------------------------
# KND req:kinds:attestation-register: E_hat_A = G_A(E_A, sigma_A),
# under the total recorded ordering name, kind, source, locator, then
# a record sequence number as tiebreak; it presents exactly Hom(C_A)
# as its homonym section; maintenance is by regeneration and exactness
# check, and hand-editing it is a failure.
[kinds.register]
standard_place = "crates/cogra-linter/docs/attestation-register.md"
ordering       = "name, kind, source, locator, record sequence number"
presents       = ["evidence and status rows", "Hom(C_A), the homonym section"]
state          = "generated — compared byte-exact every run"
note = """
NAME AND LOCATION ARE IMPLEMENTATION-DEFINED, as the label registers'
are: the linter's regeneration mode maintains this file and may move
it. It carries names and kinds, never labels, so no owner constraint
falls on it and it may live beside the registry document it presents.
It is a committed generated file of the carrier ([carrier]
generated_files), regenerated in memory on every run and compared
byte-exact; hand-editing it is a failure, and regeneration is its only
repair.
