# The profile surface (api-spec.md "Actors"; roadmap "Slice 2.1"):
# public reads by handle, the viewer's own profile, the authored
# chronicle, and the parallel-Registration update.

fragment ProfileFields on User {
  id
  handle
  # The newest profile version's authoring instant. A profile edit is a
  # signed write that lands asynchronously — approve returns while the
  # record is still relaying, and this read serves only what has landed
  # — so an immediate re-read answers with the version the edit
  # replaced. This is what says the new one has arrived: it advances
  # when the edit lands, and nothing else about the profile reliably
  # does (an edit may set a field back to what it already was).
  updatedAt
  displayName {
    value
    status
  }
  bio {
    value
    status
  }
  websiteUrl {
    value
    status
  }
  # Null for an account that has never set one, which is the monogram
  # — the designed placeholder, not a gap (D13).
  avatar {
    ...MediaFields
  }
  # The profile menu's Save / Unsave row; null on the viewer's own.
  viewerBookmarkedAt
}

query UserByHandle($handle: String!) {
  user(handle: $handle) {
    ...ProfileFields
  }
}

query MyProfile {
  me {
    ...ProfileFields
  }
}

# The chronicle rendered as labelled rows: family + genesis mark, a
# snippet of the touched content, and the post to open. A record is a
# genesis when its target/terminal is the mint of its own act id.
# `act` is the server's reading of what the record did beyond its
# family — GENESIS (a post published, a comment made, the account's
# joining), WALK_BACK (every record a walk-back signed), VOUCH (the
# vouch that landed someone), ORDINARY — the chronicle verbs' data.
query AuthorRecords($author: UUID!, $family: RecordFamily, $first: Int!, $after: String) {
  records(author: $author, family: $family, first: $first, after: $after) {
    edges {
      node {
        id
        family
        act
        targetId
        terminalId
        # The chronicle card's age, and an opinion's own face (Profile.md:23).
        landedAt
        pDirected
        pInterest
        severed
        target {
          __typename
          # The person an opinion was given on: the card's `on @mira`.
          ... on User {
            handle
          }
          # A removed post or comment keeps its row in the chronicle;
          # `removal` is what its mark reads (web's twin carries the same).
          ... on Post {
            id
            title {
              value
            }
            content {
              value
            }
            removal {
              at
              by
            }
          }
          ... on Comment {
            id
            content {
              value
            }
            removal {
              at
              by
            }
            target {
              __typename
              ... on Post {
                id
              }
            }
          }
        }
        terminal {
          __typename
          ... on Comment {
            id
            content {
              value
            }
            target {
              __typename
              ... on Post {
                id
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# The header's three figures (ProfileHeader; open-questions.md Q35):
# record counts, each labelled and never merged, each a `totalCount`
# with `first: 0` — the number without a page. `Posts` counts the
# records that minted the person's posts (`genesis: true`), never an
# edit; `Opinions on them` the Opinion records aimed at their profile;
# `Opinions by them` the Opinion records they authored toward a person.
query ProfileFigures($id: UUID!) {
  user(id: $id) {
    id
    posts: outgoingRecords(family: PUBLISH, toKind: POST, genesis: true, first: 0) {
      totalCount
    }
    opinionsOn: incomingRecords(family: OPINION, first: 0) {
      totalCount
    }
    opinionsBy: outgoingRecords(family: OPINION, toKind: USER, first: 0) {
      totalCount
    }
  }
}

mutation PrepareProfileUpdate($input: PrepareProfileUpdateInput!) {
  prepareProfileUpdate(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
