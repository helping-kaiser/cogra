# The Saved list (api-spec.md `User.bookmarks`, `setBookmark`,
# `removeBookmark`; saved-surface packet). The document is web's twin
# (web/src/lib/graphql/saved.graphql): one mixed list of posts, comments
# and people, newest first by save time, a page of TEN at a time — every
# edge carries two whole card selections, and twenty of them price past
# the complexity ceiling's headroom (`crates/api/tests/client_operations.rs`).
#
# SAVED IS A FEED (Saved.md, round 12): every saved thing stands as its
# kind's own live feed card, so each kind is read the way its card reads
# it — a post as the feed card's `PostFields` with its comment count, a
# comment as the thread's `CommentFields` plus what its head row names
# (the thing it answers) and what its search reads it by (its thread's
# root post), and a person as the profile reads them. `bookmarkedAt` is
# the list's order and Undo's restore time; no card wears it.
#
# `$query` is the reader's search: the server narrows the saved set by
# the one search law (api-spec.md "Search" / "Saved") and pages the
# narrowed list on cursors of its own — so a cursor is only ever passed
# back with the query it came from. Absent or blank narrows nothing.
query SavedPage($query: String, $after: String) {
  me {
    id
    bookmarks(query: $query, first: 10, after: $after) {
      edges {
        cursor
        bookmarkedAt
        node {
          __typename
          ... on Post {
            ...PostFields
            commentCount: comments(first: 0, includePending: true) {
              totalCount
            }
          }
          ... on Comment {
            ...CommentFields
            # The comment card's head row: what the comment answers — a
            # post by its title (or first words) over its author, or a
            # comment by its author over its first words.
            target {
              __typename
              ... on Post {
                id
                title {
                  value
                  status
                }
                content {
                  value
                  status
                }
                # The head row's mark: the cover, or a clip's still.
                attachments {
                  url
                  status
                  mimeType
                  coverMedia {
                    url
                    status
                  }
                }
                author {
                  id
                  handle
                }
                moderationStatus
                # The target's own mark: the head row reads `Removed by
                # its author` off it (FeedCommentShapes.md:21-23).
                removal {
                  at
                  by
                }
              }
              ... on Comment {
                id
                content {
                  value
                  status
                }
                author {
                  id
                  handle
                }
                moderationStatus
                # The target's own mark, as the post's above.
                removal {
                  at
                  by
                }
              }
            }
            # The thread's root post: where the card's doors land, and the
            # title a search reads a comment through.
            post {
              id
              title {
                value
                status
              }
            }
          }
          ... on User {
            ...ProfileFields
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Save, or restore a removed row's place: Undo passes the edge's own
# `bookmarkedAt` back.
mutation SetBookmark($node: UUID!, $bookmarkedAt: DateTime) {
  setBookmark(input: { node: $node, bookmarkedAt: $bookmarkedAt }) {
    bookmark {
      cursor
      bookmarkedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RemoveBookmark($node: UUID!) {
  removeBookmark(input: { node: $node }) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}
