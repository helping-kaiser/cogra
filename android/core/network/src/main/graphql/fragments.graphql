# Shared selections. Every non-silent payload carries userErrors — empty
# exactly on success (api-spec.md "Errors are tiered").

fragment UserErrorFields on UserError {
  message
  code
  field
}

fragment StagedWriteFields on StagedWrite {
  id
  state
  carried
  family
  canonicalProposal
  verifiedAct
  record {
    id
  }
}

fragment PreparedWriteFields on PreparedWrite {
  id
  family
  canonicalProposal
  gcAfterEpochs
}

fragment AuthSessionFields on AuthSession {
  accessToken
  refreshToken
  user {
    id
  }
}

# An email change in flight — which sides landed, read by the settings
# row, the confirmation's pair and the landings.
fragment PendingEmailChangeFields on PendingEmailChange {
  newEmail
  requiresCode
  codeConfirmed
  linkConfirmed
  expiresAt
}

fragment ApplicationFields on Application {
  id
  handle
  emailVerified
  keyAttached
  approvedAt
  landedAt
  createdAt
}
