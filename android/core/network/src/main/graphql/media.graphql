# The media surface (api-spec.md "Media"; roadmap "Slice 2.5.1"): the
# one upload verb, and the selection every gallery render reads.
#
# `uploadMedia` takes one asset per call by design (D5): concurrency is
# the client's to arrange, and each upload retries on its own.

# What a client needs to draw an attachment and to honour its state.
#
# `digest`/`digestAlgo` are deliberately NOT selected: nothing on the
# device verifies bytes against the record yet, and every selected field
# is priced against the query budget. They arrive with the verification
# work, not before it.
fragment MediaFields on MediaAttachment {
  id
  url
  altText
  # NORMAL, or REDACTED once the bytes are gone — what lets the client
  # draw the calm placeholder instead of a broken image (D15).
  status
  # `video/mp4` or a still's type — what the gallery branches a player
  # on rather than guessing from the URL's extension.
  mimeType
  # Reserves the tile's space before a byte loads (design.md §6);
  # `durationMs` reads null on a still.
  options {
    aspectRatio
    durationMs
  }
  # The poster this placement names — the still shown before playback and
  # wherever autoplay does not run. Spelled out rather than spreading this
  # fragment, which cannot recurse; one level is all there is, since a
  # poster is an image and never carries a poster of its own. Kept
  # narrow against the query budget: what it takes to draw the still
  # and to honour a redaction of the cover alone. Null outside a
  # placement — a fresh upload names none.
  coverMedia {
    id
    url
    status
    options {
      aspectRatio
    }
  }
  # True when `coverMedia` is a frame taken from the clip rather than a
  # still its author chose — false on a chosen cover, on a placement
  # without one, and outside a placement (schema.graphql
  # `MediaAttachment.coverTaken`).
  coverTaken
}

# Bytes and nothing authored: a description and a video's cover both ride
# `AttachmentInput` at prepare, so a picture uploads the moment it is
# picked and a poster is an ordinary upload of its own.
#
# The input rides as ONE variable rather than as its fields spread into
# an inline object: both clients name this operation `UploadMedia`, and
# an operation of one name with two variable contracts is a contract
# the schema cannot check. Taking `UploadMediaInput!` whole also means
# a field added to it reaches this client as a compile error rather
# than as silence.
mutation UploadMedia($input: UploadMediaInput!) {
  uploadMedia(input: $input) {
    media {
      ...MediaFields
      # Not on the shared fragment (which every feed/profile read also
      # spreads): every asset a parent carries is READY, so only the
      # upload path itself, which selects these two directly, ever reads
      # anything else (schema.graphql `MediaAttachment.state`).
      state
      failureReason
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The resumable path, for anything too large to risk in one request.
#
# `declaredBytes` fixes the cut and buys an early refusal; it is never
# evidence about the bytes. The server dictates `partSizeBytes` because
# guessing it wrong is only discovered at assembly. `scale` is the parent
# the clip is headed for, whose cap the server sizes it against.
mutation BeginMediaUpload($declaredBytes: Int!, $kind: MediaUploadKind!, $scale: MediaScale!) {
  beginMediaUpload(input: { declaredBytes: $declaredBytes, kind: $kind, scale: $scale }) {
    upload {
      id
      partSizeBytes
      partCount
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Assembles the parts and answers with `uploadMedia`'s own payload, so
# one reader serves both paths.
#
# **Safe to retry**: a client whose connection dropped waiting for this
# reply calls it again and is handed the same asset.
mutation CompleteMediaUpload($uploadId: UUID!) {
  completeMediaUpload(input: { uploadId: $uploadId }) {
    media {
      ...MediaFields
      # See `UploadMedia`'s own comment: not on the shared fragment.
      state
      failureReason
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Polls one of the viewer's own uploads the way `stagedWrite` is polled
# (writes.graphql `StagedWrite`) — whether a PROCESSING asset has settled.
# Selects nothing beyond the gate's own question: the wizard never shows
# the server's rendition before the seal, so `url`/`options` would only
# spend budget nothing here reads.
query MediaAttachment($id: UUID!) {
  mediaAttachment(id: $id) {
    id
    state
    failureReason
  }
}

# Gives the parts back now rather than at expiry — what a cancelled
# compose owes the store, which otherwise holds them for a day.
mutation AbortMediaUpload($uploadId: UUID!) {
  abortMediaUpload(input: { uploadId: $uploadId }) {
    aborted
    userErrors {
      ...UserErrorFields
    }
  }
}
