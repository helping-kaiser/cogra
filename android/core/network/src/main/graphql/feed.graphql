# The ranked feed (ranked-feed-api packet §4.1, §4.4; api-spec.md
# `feedRanking`, `feed`): one ranking per fetch, held on the device as the
# frozen order, and windows of it hydrated by id. Order, people, seen and
# Still settling are the device's own cuts and never ride a request.

# The snapshot: every row's id, kind, figure, the vantage's mark of the
# person behind it, and its place in both woven orders. Nothing else rides
# (§4.13's tight row shapes). Reads are anonymous-capable: a guest ranks the
# view it borrows.
query FeedRanking($viewer: UUID!, $kinds: [NodeKind!], $topic: UUID) {
  feedRanking(viewer: $viewer, filter: { kinds: $kinds, topic: $topic }) {
    asOfEpoch
    entries {
      targetId
      kind
      score
      mark
      newestIndex
    }
    settling {
      targetId
      kind
      mark
      rankedPosition
      newestPosition
    }
  }
}

# One window of the derived list, in the order handed (CD-2). The card
# reads a post as `PostFields` carries it, the comment count included; the
# other kinds ride `FeedCards` below.
query FeedWindow($ids: [UUID!]!, $first: Int!) {
  feed(orderedIds: $ids, first: $first) {
    edges {
      node {
        ... on Post {
          ...PostFields
          # The card's comment count: the woven list carries pending rows,
          # so the count includes pending comments.
          commentCount: comments(first: 0, includePending: true) {
            totalCount
          }
        }
      }
    }
  }
}

# A WINDOW'S OTHER KINDS (FeedKinds.md; FeedCommentShapes, FeedProfileShapes,
# FeedTagShapes): the comments, people and topics a derived list carries once
# the reader lets their kinds in, each as its own feed card draws it — the
# selections History's cards read (`history.graphql` `HistoryPage`), so one
# card renders the same thing on both surfaces. web's twin is
# `web/src/lib/graphql/feed.graphql` `FeedCards`.
#
# A READ OF ITS OWN, AT TEN. Every edge carries whole card selections — a
# comment's with its head row's target, a topic's with a glimpse of three —
# so it is priced at a page of ten rather than the post window's twenty, and
# the page size is a literal so the client-operation guard
# (`crates/api/tests/client_operations.rs`) prices the call the device
# actually makes. The post rows keep riding `FeedWindow`; the device splits a
# window's ids by the kind the ranking already named.
query FeedCards($ids: [UUID!]!) {
  feed(orderedIds: $ids, first: 10) {
    edges {
      node {
        __typename
        ... on Comment {
          ...CommentFields
          # The comment card's head row: what the comment answers.
          target {
            ...CommentHeadFields
          }
          # The thread's root post: where the card's doors land.
          post {
            id
          }
        }
        ... on User {
          ...ProfileFields
        }
        ... on Hashtag {
          ...TagCardFields
        }
      }
    }
  }
}

# A topic as the tag feed card draws it (`TagFeedCard`; FeedTagShapes.md): its
# name and a glimpse of the newest three things carrying it.
fragment TagCardFields on Hashtag {
  id
  name {
    value
    status
  }
  taggedContent(limit: 3, includePending: true) {
    node {
      __typename
      ... on Post {
        id
        title {
          value
          status
        }
        content {
          value
          status
        }
        attachments {
          url
          status
          mimeType
          coverMedia {
            url
            status
          }
        }
        author {
          id
          handle
        }
        createdAt
      }
      ... on Comment {
        id
        content {
          value
          status
        }
        author {
          id
          handle
        }
        createdAt
      }
    }
  }
}
