# Search (api-spec.md "Search"; slice 2.7): the Explore surface's one
# read, under the one search law. Recall is names and titles only — a
# handle, a display name, a topic's name, a post's title; a leading
# `@prefix` or `#prefix` is a cue. The answer is SECTIONED — people,
# then topics, then content, each exact match first, then newest — and
# Explore draws it in the order served, never re-sorted.
#
# The node is the `SearchResult` UNION; each member's selection is an
# inline fragment, so Apollo Kotlin generates one `on<Member>` accessor
# per kind and the mapping layer switches on `__typename`. The document
# is web's twin (web/src/lib/graphql/search.graphql), selection for
# selection, so the client-operation guard prices both alike.
#
# `includeSeen` is the reader's `Show what you've already seen`; the
# exclusion runs server-side, so a page keeps its size. Nothing here is
# marked seen: search results never become seen by being on screen —
# only opening one counts, on the surface it opens.
#
# `order` is the filter's Ranked or Newest; RANKED names the reader as
# `viewer`, and each ranked edge carries its `score` — null past a
# section's seam. `hasMorePeople` is the See all profiles door.
query Search(
  $query: String!
  $kinds: [NodeKind!]
  $includeSeen: Boolean
  $order: ReadOrder
  $viewer: UUID
  $first: Int
  $after: String
) {
  search(
    query: $query
    kinds: $kinds
    includeSeen: $includeSeen
    order: $order
    viewer: $viewer
    first: $first
    after: $after
  ) {
    edges {
      cursor
      score
      node {
        __typename
        ... on Post {
          id
          title {
            value
            status
          }
          createdAt
          landing {
            state
          }
          author {
            id
            handle
          }
          # The first entry is the cover the row's mark draws.
          attachments {
            id
            url
            status
            mimeType
            coverMedia {
              url
              status
            }
          }
          # Sensitivity veils the cover: the row falls back to the text tile.
          attachmentsStatus
        }
        ... on Comment {
          id
          content {
            value
            status
          }
          createdAt
          landing {
            state
          }
          # The found-through line, `on <root title>`: the post the thread
          # hangs under, derived, never a field of its own — a reply is
          # found through its thread's root post.
          post {
            id
            title {
              value
            }
          }
        }
        ... on User {
          id
          handle
          displayName {
            value
          }
          avatar {
            url
            status
          }
        }
        ... on Hashtag {
          id
          name {
            value
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    hasMorePeople
  }
}
