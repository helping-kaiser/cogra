# The notification list (api-spec.md `User.notifications`,
# `User.hasUnreadNotifications`, `markNotificationsSeen`,
# `markNotificationRead`; notifications.md). The document is web's twin
# (web/src/lib/graphql/notifications.graphql).

# THE BELL'S DOT, read on a fresh root load and never live (FeedUnread):
# a boolean, never a count.
query NotificationBell {
  me {
    id
    hasUnreadNotifications
  }
}

# THE LIST, newest first, a page of twenty at a time — the page size is
# written as a literal so the client-operation guard prices the call the
# device actually makes. Every row is one act: `kind` picks the drawn
# sentence, `actor` names who acted and fills the disc, `subject` is where
# the tap lands and carries the second line's words, `record` carries an
# opinion row's pair, and `application` is the queue entry an application
# row concerns.
#
# The subject's selection is Saved's: a post carries its mime types for the
# untitled stand-in, a comment carries its thread's post (`Comment.post`),
# which a mention or citation carried by a comment names (`in <title>`) and
# a comment row opens on. Statuses ride along so a removed or sensitive
# thing reads through its own mark.
query Notifications($after: String) {
  me {
    id
    notifications(first: 20, after: $after) {
      edges {
        cursor
        node {
          id
          kind
          createdAt
          readAt
          actor {
            id
            handle
            displayName {
              value
              status
            }
            ... on User {
              avatar {
                url
                status
              }
            }
          }
          subject {
            __typename
            ... on Post {
              id
              title {
                value
                status
              }
              description {
                value
                status
              }
              content {
                value
                status
              }
              attachments {
                mimeType
              }
              moderationStatus
              sensitiveReason
              author {
                id
                handle
              }
            }
            ... on Comment {
              id
              content {
                value
                status
              }
              attachments {
                mimeType
              }
              moderationStatus
              sensitiveReason
              author {
                id
                handle
              }
              post {
                id
                title {
                  value
                  status
                }
                content {
                  value
                  status
                }
                attachments {
                  mimeType
                }
                author {
                  id
                  handle
                }
              }
            }
            ... on User {
              id
              handle
            }
          }
          context {
            __typename
            ... on Post {
              id
            }
            ... on Comment {
              id
            }
            ... on User {
              id
            }
          }
          record {
            id
            pDirected
            pInterest
            # Which (0, 0) an opinion row draws (`StanceValue.zeroLabel`):
            # walked back, or an empty sign that says nothing.
            severed
          }
          application {
            id
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Clears the bell's dot when the list opens: everything at or before the
# newest row the opened list holds becomes seen. A row that arrived after
# the read stays unseen and lights the bell at the next root load.
mutation MarkNotificationsSeen($through: DateTime!) {
  markNotificationsSeen(input: { through: $through }) {
    hasUnreadNotifications
    userErrors {
      ...UserErrorFields
    }
  }
}

# Clears one row's unread dot when it is tapped.
mutation MarkNotificationRead($notification: UUID!) {
  markNotificationRead(input: { notification: $notification }) {
    notification {
      id
      readAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
