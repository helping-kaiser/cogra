# The seen-list (api-spec.md `User.viewHistory`, `markSeen`): the seen
# tracker's one write. Ids travel in the order they were seen; at most a
# page of them per call. The document is web's twin
# (web/src/lib/graphql/history.graphql).

# The seen record's sync (ranked-feed-api §4.3; PR-52): the reader's own
# seen-list, ids and first seeings only, newest first — paged down to the
# device's watermark. `me.id` names whose list it is, so a page read across
# an account switch is never written into the wrong account's record.
query SeenHistory($first: Int!, $after: String) {
  me {
    id
    viewHistory(first: $first, after: $after) {
      edges {
        firstSeenAt
        node {
          ... on Post {
            id
          }
          ... on Comment {
            id
          }
          ... on User {
            id
          }
          ... on Hashtag {
            id
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

mutation MarkSeen($nodes: [UUID!]!) {
  markSeen(input: { nodes: $nodes }) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

# HISTORY'S OWN READ (History.md, HistoryFilter.md, HistorySearch.md): the
# seen-list as a feed, newest first by first seeing, a page of EIGHT at a
# time. The document is web's twin's (web/src/lib/graphql/history.graphql
# `HistoryPage`) in this client's card fragments, which are heavier than
# web's: every edge carries a post card's whole `PostFields` (its gallery,
# topics and references), and the tag card's glimpse adds three tagged
# things with their galleries. At ten a page it measured 51 663 complexity —
# past the 50 000 the query-budget guard's 1.4× headroom allows
# (`crates/api/tests/client_operations.rs`) — so the page, not the cards,
# gives: eight a page keeps every card whole and pages a little sooner.
#
# EVERY KIND AS ITS OWN FEED CARD: a post as the feed card's `PostFields`
# with its comment count, a comment as the thread's `CommentFields` plus its
# head row's target and its thread's post (Saved's selection), a person as
# the profile reads them, and a topic as the tag card draws it — its name and
# a glimpse of the newest three things carrying it.
#
# `kinds` NARROWS (null = every kind History serves) and `query` NARROWS BY
# THE ONE SEARCH LAW over the seen set alone, on the server; a narrowed list
# is sectioned — people, then topics, then content — pages on its own
# cursors, and caps its people and topics at three behind `hasMorePeople` /
# `hasMoreTags`, the sections' doors. A cursor is only ever passed back with
# the query and kinds it came from.
query HistoryPage($query: String, $kinds: [NodeKind!], $after: String) {
  me {
    id
    viewHistory(kinds: $kinds, query: $query, first: 8, after: $after) {
      edges {
        cursor
        firstSeenAt
        node {
          __typename
          ... on Post {
            ...PostFields
            commentCount: comments(first: 0, includePending: true) {
              totalCount
            }
          }
          ... on Comment {
            ...CommentFields
            # The comment card's head row: what the comment answers.
            target {
              ...CommentHeadFields
            }
            # The thread's root post: where the card's doors land.
            post {
              id
            }
          }
          ... on User {
            ...ProfileFields
          }
          ... on Hashtag {
            # The tag card, as the feed's draws it (`feed.graphql` `TagCardFields`).
            ...TagCardFields
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      hasMorePeople
      hasMoreTags
    }
  }
}
