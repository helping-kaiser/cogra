# The content surface (api-spec.md "Content authoring", roadmap
# "Slice 2"): the four prepare verbs, the chronological listing, and
# the post-with-thread read. Reads are anonymous-capable; prepares are
# member-session writes signed on this device.

fragment PostFields on Post {
  id
  title {
    value
    status
  }
  description {
    value
    status
  }
  content {
    value
    status
  }
  # The other half of the body: a post is words XOR media (D16), so a
  # media post's `content.value` is null and this carries it instead.
  # A bounded fold list, not a connection — the write side caps a post
  # at ten, so the whole gallery is always servable (D9).
  attachments {
    ...MediaFields
  }
  # One state for the whole set: the veil covers the body as a unit
  # (D12), so there is nothing per-asset to read.
  attachmentsStatus
  author {
    id
    handle
    displayName {
      value
    }
    avatar {
      ...MediaFields
    }
  }
  createdAt
  updatedAt
  landing {
    state
    epoch
  }
  moderationStatus
  license {
    attribution
    provenance
  }
  # The author's own current topics — the content-intrinsic channel
  # this slice shows (hashtag.md §4, §5; D8).
  topics {
    hashtag {
      ...HashtagFields
    }
    relevance
    confidence
    pending
  }
  # The author's own current references, on the same content-intrinsic
  # channel the topics ride (D12).
  references {
    ...ReferenceClaimFields
  }
}

fragment CommentFields on Comment {
  id
  content {
    value
    status
  }
  # A comment is text **plus** optional media — deliberately not the
  # post's exclusive-or (D16) — capped at four.
  attachments {
    ...MediaFields
  }
  attachmentsStatus
  # The avatar the comment cards draw (Q49).
  #
  # It was omitted while the thread read prefetched three replies inside
  # every comment: that made the fragment eighty spreads deep in one
  # document, and an author picture inside it cost 560 of complexity
  # against 224 of headroom. The prefetch is gone — replies arrive
  # collapsed behind `totalCount` and load on expand — so the fragment
  # is spread twenty times rather than eighty, and the picture fits
  # inside the budget it used to break. The monogram remains the
  # designed fallback for an author who has set none, never a gap
  # waiting for a photo.
  author {
    id
    handle
    displayName {
      value
    }
    avatar {
      ...MediaFields
    }
  }
  createdAt
  updatedAt
  landing {
    state
    epoch
  }
  moderationStatus
  license {
    attribution
    provenance
  }
  topics {
    hashtag {
      ...HashtagFields
    }
    relevance
    confidence
    pending
  }
  references {
    ...ReferenceClaimFields
  }
}

mutation PreparePost($input: PreparePostInput!) {
  preparePost(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PreparePostEdit($input: PreparePostEditInput!) {
  preparePostEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareComment($input: PrepareCommentInput!) {
  prepareComment(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareCommentEdit($input: PrepareCommentEditInput!) {
  prepareCommentEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# `includePending` defaults to true per api-spec.md "Pending entries come
# first, in their own cursor namespace"; false serves only what landed.
query Posts($first: Int!, $after: String, $includePending: Boolean! = true) {
  posts(first: $first, after: $after, includePending: $includePending) {
    edges {
      node {
        ...PostFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# The author's own mark, read alone — what the edit form has to
# re-state.
#
# A content act carries the complete content state, so an edit that
# omits the switch unmarks the post (api-spec.md "The author's own
# sensitive mark"). The form therefore has to know the mark it is
# leaving standing, and `sensitiveSelfMark` is the only field that
# says it: the statuses read the OR of the author's mark and a
# moderator's verdict, and an edit can change just the author's half.
#
# Deliberately its own query rather than two more fields on
# `PostFields`: that fragment is spread once per feed entry and again
# per comment in the detail read, so anything added to it is priced
# across the corpus's heaviest document. An edit opens one post, once.
query PostSelfMark($id: UUID!) {
  post(id: $id) {
    id
    sensitiveSelfMark
    sensitiveReason
  }
}

# The same read for a comment, and for the same reason: `CommentFields`
# is the most multiplied fragment in the corpus, and an edit opens one
# comment, once. It is not a nicety — `PrepareCommentEditInput` is
# complete-state, so an edit that cannot read the standing mark cannot
# help clearing it.
query CommentSelfMark($id: UUID!) {
  comment(id: $id) {
    id
    sensitiveSelfMark
    sensitiveReason
  }
}

# The thread read (Q49). Replies are **counted, not carried**: the
# board shows them collapsed behind "View n replies", and the count is
# `totalCount` — cursor-independent, and filtered exactly as the edges
# would have been. Unfolding one branch fires `CommentReplies`.
#
# Prefetching three replies per comment made this document eighty
# `CommentFields` spreads deep for a page nobody had asked to see. The
# budget that bought back is what pays for the comment avatars.
query PostDetail($id: UUID!, $commentsFirst: Int!, $commentsAfter: String, $includePending: Boolean! = true) {
  post(id: $id) {
    ...PostFields
    comments(first: $commentsFirst, after: $commentsAfter, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          replies(includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies, each
# counting its own branch rather than carrying it.
#
# The thread is two levels deep on screen (readme §13) — a comment, and
# its replies indented once — so a reply's own replies are never drawn
# beside it; they flatten into that one level and open with the @handle
# they answer. Counting them is what the collapsed line needs, and
# carrying them would multiply this document for a level no board draws.
query CommentReplies($id: UUID!, $first: Int!, $after: String, $includePending: Boolean! = true) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          replies(includePending: $includePending) {
            totalCount
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
