# The content surface (api-spec.md "Content authoring", roadmap
# "Slice 2"): the four prepare verbs, the chronological listing, and
# the post-with-thread read. Reads are anonymous-capable; prepares are
# member-session writes signed on this device.

fragment PostFields on Post {
  id
  title {
    value
    status
  }
  description {
    value
    status
  }
  content {
    value
    status
  }
  author {
    id
    handle
    displayName {
      value
    }
  }
  createdAt
  updatedAt
  landing {
    state
    epoch
  }
  moderationStatus
  license {
    attribution
    provenance
  }
  # The author's own current topics — the content-intrinsic channel
  # this slice shows (hashtag.md §4, §5; D8).
  topics {
    hashtag {
      ...HashtagFields
    }
    relevance
    confidence
    pending
  }
  # The author's own current references, on the same content-intrinsic
  # channel the topics ride (D12).
  references {
    ...ReferenceClaimFields
  }
}

fragment CommentFields on Comment {
  id
  content {
    value
    status
  }
  author {
    id
    handle
    displayName {
      value
    }
  }
  createdAt
  updatedAt
  landing {
    state
    epoch
  }
  moderationStatus
  license {
    attribution
    provenance
  }
  topics {
    hashtag {
      ...HashtagFields
    }
    relevance
    confidence
    pending
  }
  references {
    ...ReferenceClaimFields
  }
}

mutation PreparePost($input: PreparePostInput!) {
  preparePost(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PreparePostEdit($input: PreparePostEditInput!) {
  preparePostEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareComment($input: PrepareCommentInput!) {
  prepareComment(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation PrepareCommentEdit($input: PrepareCommentEditInput!) {
  prepareCommentEdit(input: $input) {
    node
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# `includePending` defaults to true per api-spec.md "Pending entries come
# first, in their own cursor namespace"; false serves only what landed.
query Posts($first: Int!, $after: String, $includePending: Boolean! = true) {
  posts(first: $first, after: $after, includePending: $includePending) {
    edges {
      node {
        ...PostFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query PostDetail($id: UUID!, $commentsFirst: Int!, $commentsAfter: String, $repliesFirst: Int!, $includePending: Boolean! = true) {
  post(id: $id) {
    ...PostFields
    comments(first: $commentsFirst, after: $commentsAfter, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          replies(first: $repliesFirst, includePending: $includePending) {
            edges {
              node {
                ...CommentFields
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# The expand read: a further page of one comment's direct replies,
# each carrying its own first reply page so nesting can continue.
query CommentReplies($id: UUID!, $first: Int!, $after: String, $repliesFirst: Int!, $includePending: Boolean! = true) {
  comment(id: $id) {
    id
    replies(first: $first, after: $after, includePending: $includePending) {
      edges {
        node {
          ...CommentFields
          replies(first: $repliesFirst, includePending: $includePending) {
            edges {
              node {
                ...CommentFields
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
