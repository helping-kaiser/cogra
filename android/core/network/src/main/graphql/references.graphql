# The reference surface (api-spec.md "Content authoring", roadmap
# "Slice 2.4"): the finder that turns what an author types into a
# citable target, the standalone gesture that hangs a citation off
# already-published content, and the withdrawal that nets one away.
#
# Quoting, embedding and mentioning are one record and the target's
# node class is the whole distinction (D2) — so there is one fragment
# for the target union, and the render decides which chip to draw. A
# reference whose target is a person is a mention; the user-facing
# word is always Reference, never "cite" (D20). Topics are not
# reference targets — tagging is what a topic is for (D21).
#
# References declared at creation ride `PreparePostInput` /
# `PrepareCommentInput` instead (content.graphql), exactly as tags do.

# The node classes a citation may point at. Topics are not among
# them: tagging is what a topic is for, and referencing covers every
# other passive node (D21).
fragment ReferenceTargetFields on ReferenceTarget {
  __typename
  ... on Post {
    id
    title {
      value
      status
    }
    content {
      value
      status
    }
    author {
      id
      handle
      displayName {
        value
      }
    }
  }
  ... on Comment {
    id
    content {
      value
      status
    }
    author {
      id
      handle
      displayName {
        value
      }
    }
    # A comment is read inside the post that carries it, and there is
    # no comment permalink — so the chip needs that post walked up
    # from here. Two levels covers a reply to a reply; deeper than
    # that the chip renders without a destination rather than
    # recursing forever.
    target {
      ... on Post {
        id
      }
      ... on Comment {
        target {
          ... on Post {
            id
          }
        }
      }
    }
  }
  ... on User {
    id
    handle
    displayName {
      value
    }
  }
}

# One standing citation. `target` is nullable and `targetId` is not:
# the fold reads the record mirror, which reaches further than the
# display store, so a citation can stand as a substrate fact this
# instance cannot type.
fragment ReferenceClaimFields on ReferenceClaim {
  target {
    ...ReferenceTargetFields
  }
  targetId
  relevance
  support
  # What removing this citation costs: the counter-records that net its
  # bundle to (0, 0), off the RAW sums the clipped pair above has
  # already lost. An editing surface confirms against this BEFORE it
  # prepares anything.
  withdrawalCost
  # The sums that cost is read off: a withdrawal's counter-records must
  # net exactly these to (0, 0), and the device checks that before it
  # signs one (Intent.kt).
  rawRelevance
  rawSupport
  pending
}

# The one search matcher (slice 2.7): names and titles, exact matches
# first, then newest; a leading `@` narrows to people, and a UUID names
# whatever node it addresses. An empty or unresolvable query yields an
# empty list rather than an error — a finder runs on every keystroke,
# so most of what it is asked is a prefix of something still being
# typed (D20). `kinds` is the picker filter's narrowing (kinds subtract;
# null narrows nothing), so the filter never trims a 10-row answer locally.
query ReferenceCandidates($query: String!, $kinds: [NodeKind!], $limit: Int) {
  referenceCandidates(query: $query, kinds: $kinds, limit: $limit) {
    target {
      ...ReferenceTargetFields
      # The citation picker's row (ReferencePicker.jsx): its age, and for
      # a post the cover its mark wears — a veiled or removed gallery reads
      # the text tile instead. web's twin selects the same.
      ... on Post {
        createdAt
        attachmentsStatus
        attachments {
          id
          url
          status
          mimeType
          coverMedia {
            url
            status
          }
        }
      }
      ... on Comment {
        createdAt
      }
    }
    targetId
  }
}

mutation PrepareReference($input: PrepareReferenceInput!) {
  prepareReference(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The counter-records that net one citation bundle to (0, 0). The
# batch length *is* the gesture's cost — a citation revised upward
# several times needs more than one record to walk back — which is
# why the count is quoted before anything signs (D11).
mutation PrepareReferenceWithdrawal($input: PrepareReferenceWithdrawalInput!) {
  prepareReferenceWithdrawal(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# WHAT CITES THIS — the inbound mirror of the references a node declares
# (CitedBy.md, CommentCitedByEmpty.md). Read from the TERMINAL leg: a
# Reference is a hyper act, Actor -> citing artifact -> target, so the
# artifacts pointing AT this node are exactly the records whose terminal
# leg lands on it; a node-anchored read would also match the A leg of the
# node's own citations. The records, not the citations: the rows are the
# client's fold over the whole set (`CitingFold.kt`), read 100 at a time.
# Inbound records are display only — nothing read here reaches a feed.
# web's twin is `web/src/lib/graphql/references.graphql` `CitingRecords`.
query CitingRecords($id: UUID!, $after: String) {
  records(terminal: $id, family: REFERENCE, first: 100, after: $after) {
    edges {
      node {
        id
        # The bundle key's other half, and the fold's inputs.
        authorId
        targetId
        pDirected
        pInterest
        payloadMarked
        # The key of record: which record in a bundle is newest.
        landingEpoch
        position
        # The middle node of the hyper act: the artifact the citation was
        # built into, which is what the row names. A removed one keeps its
        # row, `removal` reading its mark.
        target {
          __typename
          ... on Post {
            id
            title {
              value
              status
            }
            content {
              value
              status
            }
            # The row's tile: the first entry's picture, or a clip's poster.
            attachments {
              id
              url
              mimeType
              status
              coverMedia {
                id
                url
                status
              }
            }
            author {
              id
              handle
            }
            removal {
              by
            }
          }
          ... on Comment {
            id
            content {
              value
              status
            }
            removal {
              by
            }
            # The thread a citing comment opens: the post it answers, one hop.
            target {
              __typename
              ... on Post {
                id
              }
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
