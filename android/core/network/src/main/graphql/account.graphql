# The viewer's own account: profile and provenance, the key backup,
# credentials, and the inviter surface (api-spec.md "Auth and
# accounts", "Private viewer state").

query Me {
  me {
    id
    handle
    displayName {
      value
    }
    accountState
    hasReciprocated
    vouchBackDismissed
    invitedBy {
      id
      handle
    }
  }
}

# Puts the vouch-back prompt away for good — account state, so it holds
# on every device (auth.md "Reciprocation is the joiner's own act").
mutation DismissVouchBack {
  dismissVouchBack {
    user {
      id
      vouchBackDismissed
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Whose view this reader browses from (api-spec.md "Queries") — the one
# read behind the borrowed-view band, and the only one a signed-out
# reader makes about themselves. Null once their own view exists.
query BorrowedView {
  borrowedView {
    id
    handle
    displayName {
      value
    }
  }
}

query KeyBackup {
  me {
    id
    keyBackup
  }
}

mutation CreateKeyBackupChallenge {
  createKeyBackupChallenge {
    challenge
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation UploadKeyBackup($input: UploadKeyBackupInput!) {
  uploadKeyBackup(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangeHandle($input: ChangeHandleInput!) {
  changeHandle(input: $input) {
    user {
      id
      handle
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RequestPasswordReset($input: RequestPasswordResetInput!) {
  requestPasswordReset(input: $input) {
    ok
  }
}

mutation ConfirmPasswordReset($input: ConfirmPasswordResetInput!) {
  confirmPasswordReset(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

# A wrong password and a malformed address refuse as userErrors; a spent
# account mail budget is a transport-tier RATE_LIMITED.
mutation RequestEmailChange($input: RequestEmailChangeInput!) {
  requestEmailChange(input: $input) {
    pendingEmailChange {
      newEmail
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ConfirmEmailChange($input: ConfirmEmailChangeInput!) {
  confirmEmailChange(input: $input) {
    user {
      id
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

query InviteLinks {
  me {
    id
    inviteLinks(first: 50) {
      edges {
        node {
          id
          singleUse
          createdAt
          expiresAt
          revokedAt
          applications(first: 50) {
            edges {
              node {
                ...ApplicationFields
              }
            }
          }
        }
      }
    }
  }
}

mutation CreateInviteLink($input: CreateInviteLinkInput!) {
  createInviteLink(input: $input) {
    inviteLink {
      id
      singleUse
      createdAt
      expiresAt
      revokedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RevokeInviteLink($input: RevokeInviteLinkInput!) {
  revokeInviteLink(input: $input) {
    inviteLink {
      id
      revokedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ApproveApplicants($input: ApproveApplicantsInput!) {
  approveApplicants(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
