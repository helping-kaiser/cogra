# The viewer's own account: profile and provenance, the key backup,
# credentials, and the inviter surface (api-spec.md "Auth and
# accounts", "Private viewer state").

query Me {
  me {
    id
    handle
    displayName {
      value
    }
    accountState
    hasReciprocated
    vouchBackDismissed
    invitedBy {
      id
      handle
    }
  }
}

# Puts the vouch-back prompt away for good — account state, so it holds
# on every device (auth.md "Reciprocation is the joiner's own act").
mutation DismissVouchBack {
  dismissVouchBack {
    user {
      id
      vouchBackDismissed
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Whose view this reader browses from (api-spec.md "Queries") — the one
# read behind the borrowed-view band, and the only one a signed-out
# reader makes about themselves. Null once their own view exists.
query BorrowedView {
  borrowedView {
    id
    handle
    displayName {
      value
    }
  }
}

query KeyBackup {
  me {
    id
    keyBackup
  }
}

mutation CreateKeyBackupChallenge {
  createKeyBackupChallenge {
    challenge
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation UploadKeyBackup($input: UploadKeyBackupInput!) {
  uploadKeyBackup(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ChangeHandle($input: ChangeHandleInput!) {
  changeHandle(input: $input) {
    user {
      id
      handle
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RequestPasswordReset($input: RequestPasswordResetInput!) {
  requestPasswordReset(input: $input) {
    ok
  }
}

mutation ConfirmPasswordReset($input: ConfirmPasswordResetInput!) {
  confirmPasswordReset(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

# Settings' one read (settings-surface §6.1): every row the page draws
# stands on these, all viewer-only. The sessions come this device first
# by the client's own sort, `isCurrent` naming it. Mirrors the web
# document of the same name selection for selection.
query SettingsAccount {
  me {
    id
    handle
    email
    emailVerified
    accountState
    actorPubkey
    passwordChangedAt
    keyBackupCreatedAt
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    preferences {
      defaultLicense {
        attribution
        provenance
      }
    }
    sessions {
      id
      deviceLabel
      createdAt
      lastUsedAt
      isCurrent
    }
  }
}

# The license a new post starts from — the wizard's seed. Null reads as
# public domain.
query DefaultLicense {
  me {
    id
    preferences {
      defaultLicense {
        attribution
        provenance
      }
    }
  }
}

# An absent field is left as it is; null restores the default.
mutation SetPreferences($input: SetPreferencesInput!) {
  setPreferences(input: $input) {
    preferences {
      defaultLicense {
        attribution
        provenance
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# A wrong password and a malformed address refuse as userErrors; a spent
# account mail budget, and a run of wrong passwords, are a transport-tier
# RATE_LIMITED.
mutation RequestEmailChange($input: RequestEmailChangeInput!) {
  requestEmailChange(input: $input) {
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The code from the current address or the token from the new one's
# link; `user.pendingEmailChange` reads null once the change applied.
mutation ConfirmEmailChange($input: ConfirmEmailChangeInput!) {
  confirmEmailChange(input: $input) {
    user {
      id
      email
      pendingEmailChange {
        ...PendingEmailChangeFields
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Re-mails the owed sides only; NOT_FOUND once nothing is pending.
mutation ResendEmailChange {
  resendEmailChange {
    pendingEmailChange {
      ...PendingEmailChangeFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation CancelEmailChange {
  cancelEmailChange {
    user {
      id
      email
      pendingEmailChange {
        ...PendingEmailChangeFields
      }
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# The signed-out landing's read of a new-address link: anonymous, writes
# nothing, null for any token that names no change. The token is a
# secret, so it rides the POST body like every operation here.
query EmailChangeLinkCheck($token: String!) {
  emailChangeLinkCheck(token: $token) {
    newEmail
    state
  }
}

query InviteLinks {
  me {
    id
    inviteLinks(first: 50) {
      edges {
        node {
          id
          singleUse
          createdAt
          expiresAt
          revokedAt
          applications(first: 50) {
            edges {
              node {
                ...ApplicationFields
              }
            }
          }
        }
      }
    }
  }
}

mutation CreateInviteLink($input: CreateInviteLinkInput!) {
  createInviteLink(input: $input) {
    inviteLink {
      id
      singleUse
      createdAt
      expiresAt
      revokedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation RevokeInviteLink($input: RevokeInviteLinkInput!) {
  revokeInviteLink(input: $input) {
    inviteLink {
      id
      revokedAt
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ApproveApplicants($input: ApproveApplicantsInput!) {
  approveApplicants(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
