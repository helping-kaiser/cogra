# The joining flow (auth.md "Application (the applicant state)";
# api-spec.md "Auth and accounts"): invite check → register (account +
# session) → the logged-in key attach and email verification → the
# me-driven status poll. The staged Registration rides the ordinary
# staged-write surface in writes.graphql.

query InviteLinkCheck($id: UUID!) {
  inviteLinkCheck(id: $id) {
    usable
    inviterHandle
    expiresAt
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    auth {
      ...AuthSessionFields
    }
    expiresAt
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    ok
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ResendVerificationEmail($input: ResendVerificationEmailInput!) {
  resendVerificationEmail(input: $input) {
    ok
  }
}

mutation AttachActorKey($input: AttachActorKeyInput!) {
  attachActorKey(input: $input) {
    user {
      id
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

mutation ApplyWithInvite($input: ApplyWithInviteInput!) {
  applyWithInvite(input: $input) {
    application {
      ...ApplicationFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

query ApplicationStatus {
  me {
    id
    accountState
    application {
      ...ApplicationFields
    }
    stagedWrites(first: 10) {
      nodes {
        ...StagedWriteFields
      }
    }
  }
}
