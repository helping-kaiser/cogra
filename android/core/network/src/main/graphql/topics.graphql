# The topic surface (hashtag.md; roadmap "Slice 2.3"): the naming
# service's own read — a topic's canonical name and its tagged content
# — the standalone Tag gesture the chip row's add/remove rides, and the
# follow control.
#
# Follow/unfollow reuse the schema's generic `prepareStance` /
# `prepareSeverance` mutations (writes.graphql, stance.graphql) with
# `topicName` in place of `target` — a Type is anchored vacuously, so a
# topic nobody has tagged yet has no id to look up (D4). The read side
# needs its own query, since `viewerStance` sits on `Hashtag` here
# rather than on Post/Comment/User.

fragment HashtagFields on Hashtag {
  id
  name {
    value
    status
  }
}

query Hashtag($name: String!, $limit: Int, $includePending: Boolean!) {
  hashtag(name: $name) {
    ...HashtagFields
    taggedContent(limit: $limit, includePending: $includePending) {
      node {
        __typename
        ... on Post {
          id
          title {
            value
            status
          }
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
          }
        }
        ... on Comment {
          id
          content {
            value
            status
          }
          author {
            id
            handle
            displayName {
              value
            }
          }
        }
      }
      relevance
      confidence
      pending
    }
  }
}

mutation PrepareTag($input: PrepareTagInput!) {
  prepareTag(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}

# Your topics (YourTopics.dc.html; api-spec.md `User.heldTopics`): every
# topic the reader holds, strongest first by association, each row the
# topic's mark and name with the pair the reader signed and the pending
# marker while an act is in flight. The page size is a literal so the
# client-operation guard prices the call the device actually makes.
query HeldTopics($after: String, $includePending: Boolean!) {
  me {
    id
    heldTopics(first: 50, after: $after, includePending: $includePending) {
      totalCount
      edges {
        cursor
        pDirected
        pInterest
        pending
        node {
          ...HashtagFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Explore's Your topics door (Explore.md: the second line counts the topics
# the reader holds, the length of the list it opens) — the count alone, no
# edges.
query HeldTopicsCount($includePending: Boolean!) {
  me {
    id
    heldTopics(first: 0, includePending: $includePending) {
      totalCount
    }
  }
}
