# The stance control's two legs beyond the generic prepare
# (api-spec.md "The generic stance"): the read-side bundle fold, and
# severance's own staging.
#
# `viewerStance` is a FIELD on each stance-able node, not a root read,
# and no interface gathers the three types that carry it. So the read
# enters through the root that matches the target: one document per
# root, each spreading the same fragment.
#
# THE SHAPE IS PRICED, NOT ASSUMED — measured under
# `client_operations.rs --nocapture`. One document asking all three
# roots behind `@include` flags measures complexity 39; each per-root
# document measures 15. The complexity visitor does not discount a
# guarded arm — `@include(if: false)` walks the same — so the single
# document paid 39 on every stance read, including the ones that
# already knew which root to ask. A feed page draws one control per
# card, which is what makes 39 against 15 worth three documents.
#
# The control holds an opaque target id, so a target of unknown class
# is first read through `PageStances` below, whose `__typename` names
# its class. A node never changes class, so a later read standing alone
# asks the one root that holds it (StanceRepositoryImpl remembers it).
#
# A TOPIC IS NOT IN THAT PROBE AND CANNOT BE. It is addressed by NAME —
# `hashtag(name:)`, not an id — because a Type is anchored vacuously and
# its id derives one-way from its name, so a topic nobody has tagged yet
# has no id to look up and is followable anyway
# (`PrepareStanceInput.topicName`). The name says which root to ask, so
# this read never probes: it is the one document, always.

fragment StanceBundleFields on StanceBundle {
  # The node the bundle points at — what a stance or severance signed from
  # this read must name (Intent.kt).
  targetGraphId
  pDirected
  pInterest
  # The sums before the clip. The landing line folds them locally so it
  # can move with the thumb, and every surface that explains cost states
  # them rather than the clipped fold (design.md §8.3).
  rawPDirected
  rawPInterest
  recordCount
  # Either axis at zero — the contract's own reading of "carries
  # nothing". Selected so both clients read the same field for it.
  inert
  severed
  severanceCost
  projected {
    pDirected
    pInterest
    inert
    severed
  }
}

query PostStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean!) {
  post(id: $id) {
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query CommentStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean!) {
  comment(id: $id) {
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

query ProfileStance($id: UUID!, $pick: StancePickInput, $includePending: Boolean!) {
  user(id: $id) {
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# A PAGE'S FACES IN ONE REQUEST — the web's operation of the same name, so
# both clients ride one `ID_BATCHES` row (`client_operations.rs`). The
# standings a page's controls ask together leave as one read rather than one
# root read each, and the server answers the faces at one depth of a document
# in one grouped bundle read (api-spec.md "The generic stance"). Standing
# only: a projection names a pick and keeps its own root. `nodes` is priced at
# its ids times the row and capped at the server's page size, so the loader
# sends at most that many ids at once. A topic is not a `Node` and keeps
# `HashtagStance`.
query PageStances($ids: [UUID!]!, $includePending: Boolean!) {
  nodes(ids: $ids) {
    __typename
    id
    ... on Post {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
    ... on Comment {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
    ... on User {
      viewerStance(includePending: $includePending) {
        ...StanceBundleFields
      }
    }
  }
}

query HashtagStance($name: String!, $pick: StancePickInput, $includePending: Boolean!) {
  hashtag(name: $name) {
    viewerStance(pick: $pick, includePending: $includePending) {
      ...StanceBundleFields
    }
  }
}

# A GUEST'S FACES WEAR THE BORROWED VIEW'S OWN STANCE (FeedBare.md:7,
# TagPage.md:73, GuestGate.md:11): `borrowedStance`, read-only, null where
# that view holds none and for any session. Its own four reads rather than a
# field on the four above: a guest's request never asks `viewerStance` or a
# `targetGraphId`, so nothing an act could be signed toward rides it, and a
# member's reads stay as they were. Never in a card fragment (the price of
# the card pages, seam 428). The root's `id` is what tells "this root does
# not hold the id" (the probe moves on) from "it holds it and the view holds
# no opinion" (the hollow face).

# The borrowed view's own landed bundle toward one node — what a guest's face
# wears. No node id, no raw sums, no cost: nothing on it can name or price an
# act.
fragment BorrowedStanceFields on BorrowedStance {
  pDirected
  pInterest
  recordCount
  inert
  severed
}

query PostBorrowedStance($id: UUID!) {
  post(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query CommentBorrowedStance($id: UUID!) {
  comment(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query ProfileBorrowedStance($id: UUID!) {
  user(id: $id) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

query HashtagBorrowedStance($name: String!) {
  hashtag(name: $name) {
    id
    borrowedStance {
      ...BorrowedStanceFields
    }
  }
}

mutation PrepareSeverance($input: PrepareSeveranceInput!) {
  prepareSeverance(input: $input) {
    writes {
      ...PreparedWriteFields
    }
    userErrors {
      ...UserErrorFields
    }
  }
}
