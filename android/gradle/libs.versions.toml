# Central version catalog. Every module references these aliases so the
# whole build stays on one consistent, mutually-compatible set of versions.
# The groupings below mirror the module layout in
# docs/implementation/android.md.

[versions]
# Build tooling — AGP/Kotlin/KSP must move together; the Compose compiler
# ships with Kotlin 2.x via the `kotlin.plugin.compose` plugin.
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.11"

# SDK levels. minSdk 26 gives a clean Android Keystore story for the
# encrypted token store; compile/target track the current stable platform.
# targetSdk 36 is also Play's floor for new apps and updates from
# 2026-08-31. Raising it moves Robolectric onto the API 36 sandbox,
# which is why tests launch on Java 21 (AndroidModuleConventionPlugin).
minSdk = "26"
compileSdk = "36"
targetSdk = "36"

# AndroidX / Compose
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.13.0"
# Compose 1.9.4 + Material3 1.4.0: the 2025.10 line is the earliest
# BOM carrying the stable short navigation bar the shell's compact
# bar needs. It also has to clear 1.8.0, where `LocalClipboard` (the
# recovery-code copy) lands.
composeBom = "2025.10.01"
navigationCompose = "2.8.5"
datastore = "1.1.1"
# BiometricPrompt is the documented way to re-confirm the person before
# revealing or replacing key material; it hosts its dialog in a
# fragment, which is why the app's activity is a FragmentActivity.
biometric = "1.1.0"
fragment = "1.9.0"
# The AndroidX ExifInterface, not the framework one: it reads and writes the
# tag set on every supported API level, which the platform class does not.
exifinterface = "1.4.2"

# DI
hilt = "2.58"
hiltNavigationCompose = "1.3.0"

# GraphQL
apollo = "4.4.3"

# Images. Coil 3 is the Compose-native loader Android's own Compose docs
# point at, and the one the media slice's D20 ruling names. Coil 3 ships no
# network fetcher by default, so `coil-network-okhttp` is required as well
# to load over HTTP — see https://coil-kt.github.io/coil/network/.
#
# 3.4.0 rather than the newest 3.6.0 because Coil tracks Compose and Kotlin
# closely and this is the release built for the pair we are on: 3.4.0 targets
# Compose 1.9.3 / Kotlin 2.3.10 against our Compose 1.9.4 (BOM 2025.10.01) and
# Kotlin 2.3.21. 3.5.0 moves to Compose 1.11.1 / Kotlin 2.4.0 and 3.6.0 to
# Compose 1.12.0 / Kotlin 2.4.10, whose artifacts refuse to resolve under
# AGP 8.13.2 ("requires Android Gradle plugin 9.1.0 or higher"). Moving up
# is a toolchain migration — AGP 9 + Kotlin 2.4 + a new Compose BOM — not a
# dependency bump, so it rides with that migration and Coil follows it.
coil = "3.4.0"

# Video. Media3 is Android's own media stack — the player, the
# transcoder, and the Compose bindings are one library at one version,
# and Android documents no other supported way to do either job
# (developer.android.com/media/media3). `media3-transformer` re-encodes
# a picked clip to the one accepted stored format; `media3-exoplayer`
# plays it back; `media3-ui-compose` carries the state holders the
# player surface binds to. All Media3 modules must be the same version
# (developer.android.com/media/media3/transformer/getting-started).
#
# 1.11.0 is the current stable (2026-08-05). Its `minSdk` is 23, under
# our 26. Unlike Coil it states no AGP floor above ours — it is an
# AndroidX library built against the same toolchain line we are on.
media3 = "1.11.0"

# Cropping. The crop step runs an established cropper rather than our own
# geometry (jakob 2026-08-31: "i cant imagine that you cant find a nice
# opensource cropping that we can use here"), picked by the same D20
# standard as Coil — most used, best suited, maintained.
#
# CanHub's Android-Image-Cropper is the fork that carries the abandoned
# ArthurHub original (https://github.com/CanHub/Android-Image-Cropper). It
# is the only current candidate that is on Maven Central, embeddable as a
# plain `CropImageView` inside our own chrome rather than a whole Activity
# we would have to launch, and able to switch aspect ratio at runtime and
# reset the window against the original — the three things this step needs.
# uCrop is JitPack-only and Activity-shaped; the Compose-native croppers
# (SmartToolFactory, easycrop) have not released in years.
androidImageCropper = "4.7.0"

# Crypto — Tink backs the encrypted token store (EncryptedSharedPreferences
# is deprecated in current androidx.security-crypto). BouncyCastle's
# lightweight API backs the signing crypto in core:crypto: Tink's own
# Ed25519 lives in its `subtle` package, which Tink documents as internal
# and subject to removal, and its keyset API cannot import a raw seed —
# which key recovery requires.
tink = "1.23.0"
bouncycastle = "1.85.2"

# Type-safe Navigation Compose routes are @Serializable, so the build needs
# the kotlinx-serialization plugin (versioned with Kotlin) and its JSON runtime.
kotlinxSerialization = "1.11.0"

# DI annotations usable from the pure-Kotlin domain module (javax.inject is
# plain Java, not an Android dependency).
javaxInject = "1"

# Async
coroutines = "1.11.0"

# Test
junit = "4.13.2"
coroutinesTest = "1.11.0"
turbine = "1.2.1"
truth = "1.4.5"
mockwebserver = "5.5.0"
robolectric = "4.16.1"
# Robolectric's android-all sandbox jars, one per API level the suites
# launch on: the library modules' default (minSdk 26), the two levels
# `RecoveryCodeConfirmTest` pins with `@Config`, and `app`'s targetSdk.
# The coordinates are Robolectric's own hard-coded SDK table
# (`DefaultSdkProvider.populateSdks`, `-i` suffix =
# `PREINSTRUMENTED_VERSION`), so they move with the `robolectric` version
# above — a mismatch fails the suite with the resolver's directory listing.
androidAllApi26 = "8.0.0_r4-robolectric-r1-i7"
androidAllApi32 = "12.1-robolectric-8229987-i7"
androidAllApi33 = "13-robolectric-9030017-i7"
androidAllApi36 = "16-robolectric-13921718-i7"
androidxTestExt = "1.3.0"
androidxTestCore = "1.7.0"

[libraries]
# Build-logic only: the plugin artifacts the convention plugins compile against
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# Core / lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Compose (BOM-managed — no versions on the individual artifacts)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Apollo (GraphQL)
apollo-runtime = { group = "com.apollographql.apollo", name = "apollo-runtime", version.ref = "apollo" }

# Images
android-image-cropper = { group = "com.vanniktech", name = "android-image-cropper", version.ref = "androidImageCropper" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-test = { group = "io.coil-kt.coil3", name = "coil-test", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }

# Video (Media3)
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

# Crypto
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
bouncycastle-provider = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# DI annotations
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all-api26 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "androidAllApi26" }
robolectric-android-all-api32 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "androidAllApi32" }
robolectric-android-all-api33 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "androidAllApi33" }
robolectric-android-all-api36 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "androidAllApi36" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
