"""
A user account's service state (auth.md "Account states"): it gates
acting through CoGra, never reading, and is distinct from the
mutual-pair membership of invitations.md §2. GUEST is reserved — no
flow creates one yet.
"""
enum AccountState {
	GUEST
	APPLICANT
	MEMBER
}

"""
An actor in the one handle namespace — a mention resolves to exactly
one actor. Interface coverage grows with the slices
(api-spec.md "Actors").
"""
interface Actor {
	id: UUID!
	handle: String!
	"""
	The current display name (the newest profile version).
	"""
	displayName: ModeratedText!
}

type Application {
	id: UUID!
	"""
	The applying account's handle.
	"""
	handle: String!
	"""
	Whether the account has proved its email channel — one of the two
	approvability proofs.
	"""
	emailVerified: Boolean!
	"""
	Whether the account has attached its device-minted key and L0
	address — the other approvability proof.
	"""
	keyAttached: Boolean!
	"""
	When the inviter's priced approval happened; null while pending.
	"""
	approvedAt: DateTime
	"""
	When the Registration confirmed and the account became a member;
	null before.
	"""
	landedAt: DateTime
	createdAt: DateTime!
	expiresAt: DateTime!
}

input ApplicationApprovalInput {
	application: UUID!
	"""
	The inviter's stance toward the joiner — pre-filled from the
	link, committed here.
	"""
	pDirected: Dimension!
	pInterest: Dimension!
}

type ApplicationConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ApplicationEdge!]!
}

"""
An edge in a connection.
"""
type ApplicationEdge {
	"""
	The item at the end of the edge
	"""
	node: Application!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Re-arm an expired, never-approved application with a fresh invite
link — a new application row for the viewer's account (auth.md
"Expiry"). BAD_INPUT while a live application exists;
INVITE_UNUSABLE for a dead link.
"""
input ApplyWithInviteInput {
	inviteLink: UUID!
}

type ApplyWithInvitePayload {
	application: Application
	userErrors: [UserError!]!
}

input ApprovalSignatureInput {
	stagedWriteId: UUID!
	"""
	The approval-witness signature over the exact verified act,
	host-added commitments included (base64).
	"""
	signature: String!
}

input ApproveActsInput {
	approvals: [ApprovalSignatureInput!]!
}

type ApproveActsPayload {
	"""
	Landing stays asynchronous; observe via `stagedWrite`.
	"""
	stagedWrites: [StagedWrite!]
	userErrors: [UserError!]!
}

input ApproveApplicantsInput {
	approvals: [ApplicationApprovalInput!]!
}

"""
Attach the device-minted actor identity to the viewer's account — the
key ceremony's server half (auth.md §Application step 3). Replaceable
while the viewer's application is unapproved; FORBIDDEN once approval
has bound the address.
"""
input AttachActorKeyInput {
	"""
	The device-generated actor public key (base64) — the key never
	leaves the device; this is its public half.
	"""
	actorPubkey: String!
	"""
	The device-generated L0 address — the address approval funds.
	"""
	l0Address: String!
}

type AttachActorKeyPayload {
	user: User
	userErrors: [UserError!]!
}

type AuthSession {
	"""
	The bearer token for `Authorization: Bearer <token>`; 15-minute
	lifetime.
	"""
	accessToken: String!
	"""
	The rotating refresh token. Every refresh consumes it and issues
	a successor — replace the stored copy on every refresh.
	"""
	refreshToken: String!
	"""
	The issuing session.
	"""
	session: Session
	"""
	The viewer the pair authenticates.
	"""
	user: User
}

input ChangeHandleInput {
	handle: String!
}

type ChangeHandlePayload {
	user: User
	userErrors: [UserError!]!
}

input ChangePasswordInput {
	currentPassword: String!
	newPassword: String!
}

type ChangePasswordPayload {
	ok: Boolean
	userErrors: [UserError!]!
}

type Comment implements Node {
	id: UUID!
	"""
	When this node was created — when its minting record was
	authored, which on a pending node precedes landing.
	"""
	createdAt: DateTime!
	"""
	The most recent fold-winning update's promotion; equals
	`createdAt` if never changed.
	"""
	updatedAt: DateTime!
	"""
	Where this comment stands relative to L1 finality.
	"""
	landing: Landing!
	content: ModeratedText!
	author: User
	"""
	The license qualifiers the minting Review record carried.
	"""
	license: License!
	"""
	The node this comment is on — the genesis Review's parent.
	"""
	target: CommentTarget
	moderationStatus: ModerationStatus!
	"""
	This comment's direct replies, newest-first: pending entries,
	then landed entries in landing order. `includePending: false`
	serves only what has landed on L1.
	"""
	replies(after: String, before: String, first: Int, last: Int, includePending: Boolean! = true): CommentConnection!
	"""
	This comment's current topics — the same fold and the same
	author-owned channel as `Post.topics`; a Comment is Taggable
	like any other passive node.
	"""
	topics(includePending: Boolean! = true): [TopicClaim!]!
	"""
	The viewer's own stance bundle toward this comment, and — with
	`pick` — where a candidate stance would land it. Null for a
	viewer with no bundle to read. `includePending: false` folds
	only what has landed on L1.
	"""
	viewerStance(pick: StancePickInput, includePending: Boolean! = true): StanceBundle
}

type CommentConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [CommentEdge!]!
}

"""
An edge in a connection.
"""
type CommentEdge {
	"""
	The item at the end of the edge
	"""
	node: Comment!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
What a Review can respond to (comment.md §1). Every passive node
type is Reviewable on the substrate; the variants grow with the
slices that carry them — slice 2 offers Posts and Comments.
"""
union CommentTarget = Post | Comment

input ConfirmEmailChangeInput {
	"""
	Either side's proof: the code mailed to the current (original)
	address, or the token from the new address's verification link.
	The change applies only once both sides have been confirmed.
	"""
	code: String!
}

type ConfirmEmailChangePayload {
	user: User
	userErrors: [UserError!]!
}

input ConfirmPasswordResetInput {
	resetToken: String!
	newPassword: String!
}

type ConfirmPasswordResetPayload {
	ok: Boolean
	userErrors: [UserError!]!
}

input CreateInviteLinkInput {
	expiresAt: DateTime!
	prefillPDirected: Dimension!
	prefillPInterest: Dimension!
	"""
	Defaults to multi-use.
	"""
	singleUse: Boolean
}

type CreateInviteLinkPayload {
	"""
	Its id is the shareable capability.
	"""
	inviteLink: InviteLink
	userErrors: [UserError!]!
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

scalar Dimension

"""
One shared error vocabulary across both tiers: transport faults ride
the GraphQL errors array; expected outcomes ride `userErrors`.
"""
enum ErrorCode {
	"""
	The request needed an authenticated viewer and had none.
	"""
	UNAUTHENTICATED
	"""
	The viewer is not eligible for the field or gesture.
	"""
	FORBIDDEN
	"""
	The referenced object does not exist.
	"""
	NOT_FOUND
	"""
	Malformed input; `field` names the offender.
	"""
	BAD_INPUT
	"""
	An auth endpoint's per-IP / per-account backoff.
	"""
	RATE_LIMITED
	"""
	Collapsed server fault; detail is logged, not surfaced.
	"""
	INTERNAL
	"""
	The email / password pair did not match.
	"""
	INVALID_CREDENTIALS
	"""
	Invite link invalid, expired, revoked, or consumed.
	"""
	INVITE_UNUSABLE
	"""
	The handle is already held in the one actor namespace.
	"""
	HANDLE_TAKEN
	"""
	Under the length floor or in the breach corpus.
	"""
	WEAK_PASSWORD
	"""
	The email already belongs to an account.
	"""
	EMAIL_IN_USE
	"""
	The actor key is already bound to a different account.
	"""
	ACTOR_KEY_IN_USE
	"""
	The email-verification token is invalid or expired.
	"""
	VERIFICATION_TOKEN_INVALID
	"""
	The password-reset token is invalid, expired, or already used.
	"""
	RESET_TOKEN_INVALID
	"""
	Refresh token invalid, expired, or reuse-detected.
	"""
	REFRESH_TOKEN_INVALID
	"""
	The prepare pre-check: W1 solvency or W2 stamps.
	"""
	WRITE_RULE_FAILED
	"""
	The staged write was garbage-collected unlanded.
	"""
	STAGED_WRITE_EXPIRED
	"""
	A submitted signature does not verify the record.
	"""
	SIGNATURE_INVALID
	"""
	The key-backup upload challenge is unknown, expired, or spent.
	"""
	CHALLENGE_EXPIRED
}

"""
Per-field moderation state (api-spec.md "Per-field moderation").
SENSITIVE is the read-side flag; REDACTED means the value is gone
and the mark remains — record-granular, so every field carried by a
removed payload goes REDACTED together.
"""
enum FieldModerationStatus {
	NORMAL
	SENSITIVE
	REDACTED
}

type Hashtag {
	"""
	The content-addressed id: `UUIDv5(HASHTAG_NAMESPACE, name)`. A
	pure function of the name, identical on every instance and fork.
	"""
	id: UUID!
	"""
	The canonical tag — lowercase, without `#`.
	"""
	name: ModeratedText!
	"""
	Constant NORMAL until the moderation slice stores verdicts; the
	substrate-visible verdict is The Moderator's Tag behind it.
	"""
	moderationStatus: ModerationStatus!
	"""
	The content currently tagged with this topic, newest claim first
	— the current-topics fold read from the Type's side.
	
	Only the *content-intrinsic* channel this slice: claims whose
	author is the content's own author. A stranger's tag reaches a
	viewer only through the tagger, at the viewer's forward-path
	weight, and that weight is the ranker's — slice 3
	(feed-ranking.md §4).
	
	A plain list rather than a connection: the fold this reads is
	limit-bounded, not cursor-bounded, and a Relay connection would
	promise a pagination the read cannot honour.
	`includePending: false` serves only what has landed on L1.
	"""
	taggedContent(limit: Int, includePending: Boolean! = true): [TaggedContent!]!
	"""
	The viewer's own Affinity bundle toward this topic — the follow
	control's read — and, with `pick`, where a candidate would land
	it. Null for a viewer with no bundle to read.
	"""
	viewerStance(pick: StancePickInput, includePending: Boolean! = true): StanceBundle
}

"""
Connectivity report for the API process and its store.
"""
type Health {
	"""
	Version of the backend serving this schema.
	"""
	backendVersion: String!
	"""
	True when PostgreSQL answers a round-trip probe.
	"""
	postgresConnected: Boolean!
	"""
	The last L1 epoch fully ingested into the record mirror; -1 until
	the first epoch lands, null when the cursor could not be read.
	"""
	mirrorEpoch: Int
}

type InviteLink {
	"""
	The shareable capability: the URL carries only this id, so it is
	issuer-visible only.
	"""
	id: UUID!
	"""
	The issuing actor.
	"""
	inviter: Actor
	"""
	A suggestion, never a commitment.
	"""
	prefillPDirected: Dimension!
	prefillPInterest: Dimension!
	"""
	One applicant slot (single-use) or many applicants until expiry
	(multi-use).
	"""
	singleUse: Boolean!
	createdAt: DateTime!
	expiresAt: DateTime!
	"""
	Null if still live.
	"""
	revokedAt: DateTime
	"""
	The inviter's approval queue: applications staged through this
	link, with their status.
	"""
	applications(after: String, before: String, first: Int, last: Int): ApplicationConnection!
}

"""
The anonymous pre-submit view of an invite link — enough for the app
to gate the registration form and key ceremony on a usable capability,
and to show who is vouching. Holding the id is holding the link.
"""
type InviteLinkCheck {
	"""
	Whether the link can stage a new applicant now — live, unexpired,
	unrevoked, and (single-use) its one slot free.
	"""
	usable: Boolean!
	"""
	The issuing actor's handle.
	"""
	inviterHandle: String!
	expiresAt: DateTime!
}

type InviteLinkConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [InviteLinkEdge!]!
}

"""
An edge in a connection.
"""
type InviteLinkEdge {
	"""
	The item at the end of the edge
	"""
	node: InviteLink!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type KeyBackupChallengePayload {
	"""
	The challenge to sign (base64); null with a refusal.
	"""
	challenge: String
	expiresAt: DateTime
	userErrors: [UserError!]!
}

"""
A node's landing position. `epoch` is the graph's own clock and is
null exactly while `state` is PENDING — a pending write has no causal
key yet (architecture.md "The write path").
"""
type Landing {
	state: LandingState!
	epoch: Int
}

"""
Where a node stands relative to L1 finality. PENDING: authored and
signed, not yet ordered — real content whose place in the order is
not yet fixed (substrate.md §6). LANDED: the minting act is ordered
fact. There is no expired state: an expired act's content leaves
every reader's view.
"""
enum LandingState {
	PENDING
	LANDED
}

"""
The license qualifiers a content node was minted with (§5 of
platform-guidelines.md; layer1-interface.md §10) — set by the creator
when the node entered the graph, immutable thereafter, and surviving
payload removal. Both are duties on *downstream use*, never a
statement about how the content was made.
"""
type License {
	"""
	`a` — the degree to which a use must credit the maker, on
	`[0, 1]` (attribution, layer1-interface.md §10). CoGra publishes
	three readings: 0 no credit owed, 0.5 credit on commercial uses
	only, 1 credit on every use.
	"""
	attribution: Float!
	"""
	`o` — the degree to which a use must be tracked publicly and
	left open to audit, on `[0, 1]` (provenance, layer1-interface.md
	§10). CoGra publishes three readings: 0 no record owed, 0.5 a
	public record of commercial uses only, 1 a public record of every
	use.
	"""
	provenance: Float!
}

"""
License qualifiers, mandatory at authoring time and immutable
(platform-guidelines.md §5): they ride the structural record as
public protocol references, surviving every payload state.
"""
input LicenseInput {
	"""
	`a` — how far a use must credit the maker, a degree on `[0, 1]`
	(attribution, layer1-interface.md §10). CoGra's composer offers
	the three readings it publishes: 0, 0.5 (commercial uses only),
	and 1.
	"""
	attribution: Float!
	"""
	`o` — how far a use must be tracked publicly and left open to
	audit, a degree on `[0, 1]` (provenance, layer1-interface.md §10),
	offered on the same three readings.
	"""
	provenance: Float!
}

input LogInInput {
	email: String!
	password: String!
	deviceLabel: String
}

type LogInPayload {
	"""
	Null with an INVALID_CREDENTIALS userError when the email /
	password pair did not match.
	"""
	auth: AuthSession
	"""
	The pending refresh-token-reuse security event (auth.md "Reuse
	detection"), delivered exactly once: set to the detection time
	on the first successful login after a reuse-detected revocation,
	null otherwise and on every refusal.
	"""
	reuseDetectedAt: DateTime
	userErrors: [UserError!]!
}

"""
Text carrying its own moderation status. `value` is null when the
field is redacted, or unset where the field is optional — `status`
disambiguates; empty is a value, null never is.
"""
type ModeratedText {
	value: String
	status: FieldModerationStatus!
}

"""
Node-level moderation cache — the cheap "is anything wrong here"
check; the substrate-visible verdict is the Tag record behind it
(moderation.md). Constant NORMAL until the moderation slice stores
verdicts (api-spec.md "Content nodes").
"""
enum ModerationStatus {
	NORMAL
	SENSITIVE
	ILLEGAL
}

type Mutation {
	"""
	Register through an invite link: creates the account — the actor
	row (no key yet) and its credentials, in the applicant state —
	records the application against the link, sends the verification
	email, and returns an ordinary session. Budgeted per IP and per
	invite link (auth.md "Rate limiting").
	"""
	register(input: RegisterInput!): RegisterPayload!
	"""
	Proves the login channel. `ok` is false with a
	VERIFICATION_TOKEN_INVALID userError when the token is invalid or
	the account expired.
	"""
	verifyEmail(input: VerifyEmailInput!): VerifyEmailPayload!
	"""
	Attaches the device-minted actor identity to the viewer's account
	— the key ceremony's server half. Replaceable while the viewer's
	application is unapproved; FORBIDDEN once approval has bound the
	address. An address binds at most one account: a key already
	bound to a different account refuses with an ACTOR_KEY_IN_USE
	userError.
	"""
	attachActorKey(input: AttachActorKeyInput!): AttachActorKeyPayload!
	"""
	Re-arms an expired, never-approved application with a fresh
	invite link — a new application row for the viewer's account. A
	re-arm is an application submit, so it spends the same budgets
	`register` does (auth.md "Rate limiting").
	"""
	applyWithInvite(input: ApplyWithInviteInput!): ApplyWithInvitePayload!
	"""
	Always succeeds, to avoid revealing whether an application
	exists. The per-account resend budget (auth.md "Rate limiting")
	trips silently for the same reason: a visible refusal would leak
	exactly what the verb is built to hide.
	"""
	resendVerificationEmail(input: ResendVerificationEmailInput!): ResendVerificationEmailPayload!
	"""
	Approve staged applicants — the inviter's deliberate, priced act:
	per applicant or in batch, with the pre-filled stance values
	adjusted at will. Triggers the funding burn and the staged
	Registration backend-side, and returns the inviter's own Opinion
	records to sign — the vouch is the inviter's signature, not a
	server write. Requires an approvable application: email verified
	and key attached.
	"""
	approveApplicants(input: ApproveApplicantsInput!): PreparePayload!
	"""
	A session from credentials; `auth` is null with an
	INVALID_CREDENTIALS userError when the email / password pair did
	not match.
	
	Two budgets guard it in order — the per-IP window, then the
	per-email consecutive-failure backoff (auth.md "Rate limiting").
	A missing account still pays for a password hash, so it costs the
	same time a wrong password does and the timing tells nothing
	apart. Any pending reuse mark is taken and cleared only behind a
	verified password, so a refusal can never leak it.
	"""
	logIn(input: LogInInput!): LogInPayload!
	"""
	A rotated session; `auth` is null with a REFRESH_TOKEN_INVALID
	userError when the refresh token is invalid, expired, or
	revoked. A just-rotated token's replay inside the grace window
	returns the same successor; outside it, reuse detection revokes
	every session.
	"""
	refreshSession(input: RefreshSessionInput!): RefreshPayload!
	"""
	Revoke one session (the current one if no id is given). The
	associated access token cannot be invalidated mid-TTL but cannot
	be refreshed past expiry.
	"""
	revokeSession(input: RevokeSessionInput!): RevokeSessionPayload!
	"""
	Revoke every session except the one making the request.
	"""
	revokeOtherSessions: RevokeSessionsPayload!
	"""
	Always succeeds, to avoid revealing whether an account exists. If
	one does, a single-use reset link goes to its address — and the
	bare token beside it, which native apps accept as a paste
	(auth.md "Link URLs").
	
	The two budgets differ accordingly (auth.md "Rate limiting"): the
	per-IP window refuses visibly, while the per-email one trips
	silently, returning the same `ok: true`.
	"""
	requestPasswordReset(input: RequestPasswordResetInput!): RequestPasswordResetPayload!
	"""
	Rotates the password and revokes every session — a reset is a
	security event.
	"""
	confirmPasswordReset(input: ConfirmPasswordResetInput!): ConfirmPasswordResetPayload!
	"""
	Re-verifies the current password, rotates the hash, and revokes
	the account's other sessions.
	"""
	changePassword(input: ChangePasswordInput!): ChangePasswordPayload!
	"""
	Re-authenticates with the current password, then runs the
	two-sided proof: a confirmation code to the current address, a
	verification link to the new one. Always succeeds for a
	well-formed request, to avoid revealing whether the new address
	is already registered. A wrong current password is silent for the
	same reason: it too reads as success.
	"""
	requestEmailChange(input: RequestEmailChangeInput!): RequestEmailChangePayload!
	"""
	Submits either side's proof; the change applies — and the account
	email updates — only once both the original-address code and the
	new-address verification have been confirmed. A fully-proven
	change whose new address was registered by someone else in the
	meantime surfaces EMAIL_IN_USE, on this call and on retries,
	until the change expires.
	
	Either side's proof may arrive first, so both are tried and the
	apply step runs even when the code matched neither. That is what
	keeps a collided change answerable: its row stays alive, so a
	retry with an already-consumed code still learns the real reason
	instead of a token error.
	"""
	confirmEmailChange(input: ConfirmEmailChangeInput!): ConfirmEmailChangePayload!
	"""
	Renames the account in the one actor namespace — L2 account
	state, not graph or profile payload. Subject to the global handle
	rules: 3–30 chars of [a-z0-9_], case-folded.
	"""
	changeHandle(input: ChangeHandleInput!): ChangeHandlePayload!
	"""
	Issues the challenge an upload must spend (auth.md "Key
	recovery"). The server picks it: a client-chosen nonce would let
	a captured upload be replayed verbatim, which is the whole attack
	the proof exists to stop. Asking again discards the previous one.
	"""
	createKeyBackupChallenge: KeyBackupChallengePayload!
	"""
	Upload (or replace) the client-encrypted key-backup blob —
	ciphertext under the device-generated recovery code; the server
	stores what it cannot decrypt. One blob per account; blobs over
	4 KiB refuse as BAD_INPUT. Retrieval is the `User.keyBackup`
	field: login + code is the recovery.
	
	The upload is signed by the actor key over a server-issued
	challenge (auth.md "Key recovery"): a session alone could
	otherwise overwrite the blob and silently destroy the account's
	recovery path. Replacing an existing blob mails a notice.
	
	An account with no attached key is refused outright: there is
	nothing to verify against, and no legitimate caller either, since
	the ceremony attaches before it uploads. The signature is checked
	before the challenge is spent, so a bad one does not burn it — a
	wrong-key client would otherwise need a fresh round trip per
	attempt for no security gain.
	"""
	uploadKeyBackup(input: UploadKeyBackupInput!): UploadKeyBackupPayload!
	"""
	Issues an invite link — pure service-side staging UX; its id is
	the shareable capability. Nothing binds at issue: the stance
	values are pre-filled suggestions, and the approval is the priced
	act.
	"""
	createInviteLink(input: CreateInviteLinkInput!): CreateInviteLinkPayload!
	"""
	Revokes one of the viewer's own invite links.
	"""
	revokeInviteLink(input: RevokeInviteLinkInput!): RevokeInviteLinkPayload!
	"""
	Prepares the viewer's stance toward a node — one new edge carrying
	exactly the picked values, never a delta against the bundle
	(design.md §8.1). Toward a Profile this is the interpersonal
	stance, including the reciprocation gesture.
	"""
	prepareStance(input: PrepareStanceInput!): PreparePayload!
	"""
	Prepares severance toward a node: the counter-records that net the
	viewer's bundle to `(0, 0)`. Each is its own priced act, so the
	batch length is the gesture's cost — a bundle carrying more
	conviction than one record can walk back needs several
	(feed-ranking.md §8.1).
	"""
	prepareSeverance(input: PrepareSeveranceInput!): PreparePayload!
	"""
	Prepares a new Post: one genesis Publish through the ordinary
	write path — the returned write pre-signs, seals, and approves
	like any other; `node` is the id the post serves under once the
	record lands (post.md §1).
	"""
	preparePost(input: PreparePostInput!): PrepareContentPayload!
	"""
	Prepares a Post edit: an ordinary-role Publish at attachment 0
	toward the existing node, chained behind the current head.
	Creator-only; one in-flight edit per post and author
	(post.md §4).
	"""
	preparePostEdit(input: PreparePostEditInput!): PrepareContentPayload!
	"""
	Prepares a new Comment: one genesis Review whose terminal leg
	mints the Comment on the target (comment.md §1).
	"""
	prepareComment(input: PrepareCommentInput!): PrepareContentPayload!
	"""
	Prepares one standalone Tag on existing content — the gesture
	that adds a topic after creation. There is no un-tag mutation:
	withdrawing a topic is a further Tag at `pDirected: 0`, which the
	current-topics fold reads as withdrawn (hashtag.md §4). Tagging
	is not restricted to the content's author; the read side is what
	separates the author's own declarations from third-party claims.
	"""
	prepareTag(input: PrepareTagInput!): PreparePayload!
	"""
	Prepares a Comment edit: an ordinary-role Review at (0,0) — A
	leg to the genesis parent, terminal leg to the existing Comment
	(comment.md §4).
	"""
	prepareCommentEdit(input: PrepareCommentEditInput!): PrepareContentPayload!
	"""
	Prepares an update of the viewer's profile — a parallel
	Registration, L1's own profile-update idiom: payload only, never
	identity (substrate.md §9). Chained behind the current head; one
	in-flight update per profile.
	"""
	prepareProfileUpdate(input: PrepareProfileUpdateInput!): PreparePayload!
	"""
	Relays the pre-signed proposals to L1's seal round trip. When the
	seal returns synchronously the payload's staged writes are
	already AWAITING_APPROVAL, verified act included. Verification
	failures surface as SIGNATURE_INVALID userErrors per proposal.
	Resubmitting a sealed proposal is idempotent only for the exact
	signature that was sealed; differing bytes refuse as BAD_INPUT.
	
	A keyless account is refused rather than rendered: no staged write
	can exist for one, because the Registration stages only after the
	attach proof, so a missing key here is a client bug.
	"""
	submitProposals(input: SubmitProposalsInput!): SubmitProposalsPayload!
	"""
	Relays the approval witnesses — only an approved act is orderable
	— and drives retries across epoch boundaries. Landing stays
	asynchronous; observe via `stagedWrite`.
	"""
	approveActs(input: ApproveActsInput!): ApproveActsPayload!
}

"""
Every graph-backed thing with an identity and a lifecycle
(api-spec.md "Identity and actor interfaces"). Coverage grows with
the slices; slice 2 carries the content nodes.

The `duplicated_attributes` allow answers a named clippy false
positive (rust-clippy #12537): the lint misfires on derive-helper
fields that share a value, and `createdAt` and `updatedAt` genuinely
have the same GraphQL type.
"""
interface Node {
	"""
	The node's L2 id.
	"""
	id: UUID!
	"""
	When this node was created — when its minting record was authored, which on a pending node precedes landing.
	"""
	createdAt: DateTime!
	"""
	The most recent fold-winning update's promotion; equals createdAt if never changed.
	"""
	updatedAt: DateTime!
	"""
	Where this node stands relative to L1 finality — landing is a substrate fact about every minted node.
	"""
	landing: Landing!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

"""
An act payload's one-way state (layer1-interface.md §8.4): FULL
until the controller removes, REDUCED forever after.
"""
enum PayloadState {
	FULL
	REDUCED
}

type Post implements Node {
	id: UUID!
	"""
	When this node was created — when its minting record was
	authored, which on a pending node precedes landing.
	"""
	createdAt: DateTime!
	"""
	The most recent fold-winning update's promotion; equals
	`createdAt` if never changed.
	"""
	updatedAt: DateTime!
	"""
	Where this post stands relative to L1 finality.
	"""
	landing: Landing!
	title: ModeratedText!
	description: ModeratedText!
	content: ModeratedText!
	author: User
	"""
	The license qualifiers the minting Publish record carried.
	"""
	license: License!
	moderationStatus: ModerationStatus!
	"""
	This post's direct comments — genesis Reviews whose A leg
	enters here — newest-first: pending entries, then landed entries
	in landing order (a comment's landing position is its genesis, so
	edits never reorder the thread), keyset-paginated.
	`includePending: false` serves only what has landed on L1.
	"""
	comments(after: String, before: String, first: Int, last: Int, includePending: Boolean! = true): CommentConnection!
	"""
	This post's current topics — the author's own declarations, as
	the current-topics fold reads them: newest record per (author,
	content, Type), relevance 0 read as withdrawn (hashtag.md §4).
	
	Third-party topic claims are deliberately absent: they reach a
	viewer only through the tagger, at a forward-path weight the
	ranker computes, and the ranker arrives in slice 3.
	`includePending: false` serves only what has landed on L1; the
	pending half is the viewer's own in-flight tags on their own
	content.
	"""
	topics(includePending: Boolean! = true): [TopicClaim!]!
	"""
	The viewer's own stance bundle toward this post, and — with
	`pick` — where a candidate stance would land it. Null for a
	viewer with no bundle to read. `includePending: false` folds
	only what has landed on L1.
	"""
	viewerStance(pick: StancePickInput, includePending: Boolean! = true): StanceBundle
}

type PostConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PostEdge!]!
}

"""
An edge in a connection.
"""
type PostEdge {
	"""
	The item at the end of the edge
	"""
	node: Post!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
A Comment edit: the complete new body (comment.md §4).
"""
input PrepareCommentEditInput {
	id: UUID!
	content: String!
}

"""
A new Comment: one genesis Review — A leg to the target, terminal
leg minting the Comment (comment.md §1) — plus one Tag record per
declared topic. This slice offers the comment box on Posts and
Comments.
"""
input PrepareCommentInput {
	target: UUID!
	content: String!
	license: LicenseInput!
	"""
	Enthusiasm and effort; each defaults to +0.1 (invitations.md §3).
	"""
	pDirected: Dimension
	pInterest: Dimension
	"""
	Topics declared at creation; same rules as on a Post.
	"""
	tags: [TagInput!]
}

"""
A prepared content write: the staged batch plus `node` — the L2
id the envelope binds to the minted node, and the id the content
reads serve once the record lands. `writes` carries the minting
record first, then one Tag record per declared topic, each its own
priced act. Null when `userErrors` is non-empty.
"""
type PrepareContentPayload {
	node: UUID
	writes: [PreparedWrite!]
	userErrors: [UserError!]!
}

"""
Staged proposals to pre-sign, in relay order. Each is its own priced
act running its own two-signature handshake; null when `userErrors`
is non-empty.
"""
type PreparePayload {
	writes: [PreparedWrite!]
	userErrors: [UserError!]!
}

"""
A Post edit: the complete new content state, the same field set a
create carries (post.md §4). An omitted title or description is a
Post without one. Identity, creator, and license never edit.
"""
input PreparePostEditInput {
	id: UUID!
	title: String
	description: String
	content: String!
}

"""
A new Post: one genesis Publish whose envelope carries the display
fields (post.md §1), plus one Tag record per declared topic — each
its own priced act. Fields are raw scalars; moderation is
server-assigned.
"""
input PreparePostInput {
	title: String
	description: String
	content: String!
	license: LicenseInput!
	"""
	The author's attachment; defaults to the low-defaults policy
	value (+0.1). `pInterest` is census-fixed at 1 for Publish.
	"""
	pDirected: Dimension
	"""
	Topics declared at creation — explicit structured input, never
	parsed from the body, so display content and graph structure stay
	decoupled. At most 10 per batch; two names that canonicalize
	alike are refused rather than deduplicated.
	"""
	tags: [TagInput!]
}

"""
A profile update's field set — omitted = untouched, explicit null =
cleared, a value = replaced (api-spec.md "Content authoring"). The
display name refuses the clear; the handle is L2 account state, not
profile payload — see changeHandle.
"""
input PrepareProfileUpdateInput {
	displayName: String
	bio: String
	websiteUrl: String
}

input PrepareSeveranceInput {
	"""
	The node to sever the acting identity's bundle toward. Exactly
	one of `target` and `topicName`.
	"""
	target: UUID
	"""
	A topic by name — unfollowing is severance toward the Type.
	"""
	topicName: String
}

input PrepareStanceInput {
	"""
	The passive node the stance points at. The target selects the
	family: Affinity toward a Type, Opinion toward everything else —
	toward a Profile it is the interpersonal stance (and the
	reciprocation gesture completing the CoGra-join mutual pair).
	Exactly one of `target` and `topicName`.
	"""
	target: UUID
	"""
	A topic by name, for the follow gesture. A Type is anchored
	vacuously and its id derives one-way from its name, so a topic
	nobody has tagged yet has no id to look up — and is followable
	anyway. Naming it here registers the name, as any record that
	references it does.
	"""
	topicName: String
	"""
	Written as picked — one new edge carrying exactly these values.
	The bundle is a read-side fold (`viewerStance`); severance is its
	own gesture, not a value these fields reach.
	"""
	pDirected: Dimension!
	pInterest: Dimension!
}

"""
One standalone topic declaration on existing content — the gesture
that adds a topic after creation, and, at `pDirected: 0`, the one
that withdraws it. Tags are never edit fields: changing a post's
topics is its own priced act (post.md §3).
"""
input PrepareTagInput {
	"""
	The content being tagged.
	"""
	target: UUID!
	name: String!
	"""
	Relevance `r`; defaults to +0.1. Zero is the un-tag.
	"""
	pDirected: Dimension
	"""
	Confidence `c`, census-bounded to `[0, 1]`; defaults to 1.
	"""
	pInterest: Dimension
}

type PreparedWrite {
	"""
	The handle for the whole handshake.
	"""
	id: UUID!
	family: RecordFamily!
	"""
	The canonical proposal, serialized for pre-signing (base64). It
	carries everything the author asserts — endpoints, parameters,
	dependency list, payload bytes — and the device recomputes every
	signing base from it: the user never signs blind bytes.
	"""
	canonicalProposal: String!
	"""
	Domain-separated digest over the payload bytes — a transport
	cross-check for the parsed proposal. The signing pre-digests are
	computed on-device under the private nonce and never leave it.
	"""
	contentPreDigest: String!
	"""
	Domain-separated digest over the canonical dependency encoding —
	the dependency-side transport cross-check.
	"""
	dependencyPreDigest: String!
	"""
	A staged write that never completes the handshake and lands is
	garbage-collected — staged payload included — after this many
	epochs (an operational parameter; data-model.md "Staged writes").
	"""
	gcAfterEpochs: Int!
}

input ProposalSignatureInput {
	stagedWriteId: UUID!
	"""
	The pre-commitment blob (base64): the device's private nonce and
	pre-commitment signature — produced with the actor's device-held
	key; opaque to this API.
	"""
	signature: String!
}

type Query {
	"""
	Reports whether the API can reach its store, and how far the record
	mirror has ingested. Answers even when the store does not, so a
	dumb probe always gets a response: a failed cursor read comes back
	as a null `mirrorEpoch` rather than an error, and so stays
	distinguishable from the legitimate "-1, nothing ingested".
	"""
	health: Health!
	"""
	The host key the device verifies seals against before approving
	(base64) — realization transparency: every host-added field of a
	verified act is checkable on-device.
	"""
	hostPublicKey: String!
	"""
	Anonymous pre-submit check of an invite link, so the app can gate
	the registration form and key ceremony on a usable capability.
	Null when the id references no link.
	"""
	inviteLinkCheck(id: UUID!): InviteLinkCheck
	"""
	The viewer's own account, resolved from the request's auth token.
	Null when the request is unauthenticated.
	"""
	me: User
	"""
	One user by id or unique handle — exactly one argument
	(api-spec.md "Queries"). Handles resolve case-insensitively
	(auth.md "Handle and email format"); null for no match.
	"""
	user(id: UUID, handle: String): User
	"""
	Any actor by id or unique handle — one namespace across kinds, so
	a handle resolves to exactly one actor; exactly one argument.
	Kinds resolve as their types arrive with the slices — users
	today; null for no match.
	"""
	actor(id: UUID, handle: String): Actor
	"""
	One staged write mid-handshake. Field-level: resolves only for
	the staging actor's session; null otherwise.
	"""
	stagedWrite(id: UUID!): StagedWrite
	"""
	One post by id; null for an unknown id.
	"""
	post(id: UUID!): Post
	"""
	One comment by id; null for an unknown id.
	"""
	comment(id: UUID!): Comment
	"""
	One topic by name — canonicalized here (lowercase, `#` stripped)
	before anything is looked at.
	
	Every well-formed name already denotes a Type, whether or not any
	record has referenced it: Types are anchored vacuously and their
	ids are a pure function of the name. So this resolves without a
	registry row and without writing one — a client can navigate to
	an empty topic page and follow it from there. Null only for a
	name the substrate could never carry.
	"""
	hashtag(name: String!): Hashtag
	"""
	Any node by its L2 id, typed. Coverage grows with the slices —
	content nodes resolve here today; null for an unknown id.
	"""
	node(id: UUID!): Node
	"""
	Batch node lookup — order preserved; an unknown id yields null
	in its slot.
	"""
	nodes(ids: [UUID!]!): [Node]!
	"""
	One L1 record by its own identifier — the unit of the chronicle.
	"""
	record(id: RecordId!): Record
	"""
	Generic record lookup over the mirror — the public chronicle,
	filterable along the mirror's own indexes, newest-first in
	landing order. `target` matches a record's target (the middle
	node on hyper families); `terminal` matches the terminal leg —
	a comment's revision chain is `records(terminal: <comment>)`.
	The UUID filters translate to the mirror's own identifiers, so an
	id that resolves to no known node yields an empty page rather than
	an error — the same contract a null slot in `nodes` carries.
	"""
	records(author: UUID, target: UUID, terminal: UUID, family: RecordFamily, payloadMarked: Boolean, sinceEpoch: Int, untilEpoch: Int, after: String, before: String, first: Int, last: Int): RecordConnection!
	"""
	The chronological listing (roadmap "Slice 2"): every post,
	newest-first — pending entries, then landed entries in landing
	order, the record set's own order, never wall clock
	(graph-model.md §2). `includePending: false` serves only what has
	landed on L1. Deliberately not the ranked feed.
	"""
	posts(after: String, before: String, first: Int, last: Int, includePending: Boolean! = true): PostConnection!
}

type Record {
	"""
	L1's own record identifier, verbatim.
	"""
	id: RecordId!
	family: RecordFamily!
	"""
	The authoring account. Null when no account fronts the author's
	address — system actors, until the actor surface grows.
	"""
	author: User
	"""
	The far end of a binary act, or the middle node the actor's leg
	enters on a hyper act (a Review's parent). Resolved as a typed
	node when CoGra carries one for it; `targetId` is always the raw
	identifier.
	"""
	target: Node
	"""
	The raw L1 identifier of `target`.
	"""
	targetId: String
	"""
	The terminal leg's node — hyper acts only; minted by the act
	when the record is a genesis (a Review's Comment).
	"""
	terminal: Node
	"""
	The raw L1 identifier of `terminal`; null on binary families.
	"""
	terminalId: String
	"""
	The authored directed parameter, as the actor's leg renders it.
	"""
	pDirected: Dimension!
	"""
	The authored interest parameter, as the actor's leg renders it.
	"""
	pInterest: Dimension!
	"""
	The landing epoch.
	"""
	landingEpoch: Int!
	"""
	Authoritative act time — the first component of the causal key.
	"""
	actTime: Int!
	"""
	Position within the epoch's authoritative order.
	"""
	position: Int!
	"""
	Whether the act committed a non-empty payload.
	"""
	payloadMarked: Boolean!
	"""
	FULL until the payload controller removes; a reduced record
	keeps its structure and witness forever (layers.md §5).
	"""
	payloadState: PayloadState!
	"""
	The content commitment (base64) — the payload bytes in carriage
	verify against it.
	"""
	payloadWitness: String!
}

type RecordConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [RecordEdge!]!
}

"""
An edge in a connection.
"""
type RecordEdge {
	"""
	The item at the end of the edge
	"""
	node: Record!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
The record families of the L1 edge census (layer1-interface.md §9).
"""
enum RecordFamily {
	REGISTRATION
	PUBLISH
	OPINION
	AFFINITY
	PARTICIPANT
	OWNER
	JOIN_REQUEST
	ACCEPT
	RATIFY
	WITHDRAW
	RESCIND
	LEAVE
	TAG
	REVIEW
	BID
	INVITATION
	DE_INVITE
	SEND
	REFERENCE
}

scalar RecordId

type RefreshPayload {
	"""
	A rotated session; null with a REFRESH_TOKEN_INVALID userError
	when the token is invalid, expired, or revoked. A just-rotated
	token's replay inside the grace window returns the same
	successor; outside it, reuse detection revokes every session.
	"""
	auth: AuthSession
	userErrors: [UserError!]!
}

input RefreshSessionInput {
	refreshToken: String!
}

